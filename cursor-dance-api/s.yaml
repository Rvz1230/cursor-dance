# CursorDance AI API — 阿里云 FC3 部署配置
# 使用 Serverless Devs (s) CLI
#
# 部署命令：cd cursor-dance-api && s deploy -y
#
# 部署后去 FC 控制台手动设置敏感环境变量：
#   CURSORDANCE_AI_API_KEY=sk-your-deepseek-key
#   CURSORDANCE_AI_API_ACCESS_TOKEN=your-random-token
# （不在本文件中写死，避免每次 s deploy 覆盖控制台上的值）

edition: 3.0.0
name: cursor-dance-ai-api
access: default

resources:
  api:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: cursor-dance-api
      description: "CursorDance AI 方案助手 — 统一 API 入口"
      runtime: nodejs20
      handler: index.handler
      code: ./
      timeout: 120
      memorySize: 512
      environmentVariables:
        CURSORDANCE_AI_API_BASE_URL: https://api.deepseek.com/v1
        CURSORDANCE_AI_API_MODE: chat_completions
        CURSORDANCE_AI_MODEL: deepseek-chat
        CURSORDANCE_ALLOWED_ORIGINS: "*"
        CURSORDANCE_AI_METRICS_LOG: "1"
      triggers:
        - qualifier: LATEST
          triggerName: http
          triggerType: http
          triggerConfig:
            methods:
              - GET
              - POST
              - OPTIONS
            authType: anonymous
