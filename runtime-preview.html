<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CursorDance 网页试用</title>
    <script type="module" src="/src/extension/smoke-entry.ts"></script>
    <style>
      :root {
        font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        color: #0f172a;
        background:
          radial-gradient(circle at 18% 12%, rgba(251, 113, 133, 0.2), transparent 28%),
          radial-gradient(circle at 82% 4%, rgba(245, 158, 11, 0.2), transparent 30%),
          linear-gradient(145deg, #fffaf5, #f8fafc 48%, #eef2ff);
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .stage {
        width: min(760px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.78);
        padding: clamp(28px, 6vw, 64px);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.1);
        backdrop-filter: blur(18px);
      }
      .eyebrow { color: #d97706; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; }
      h1 { margin: 12px 0 14px; font-size: clamp(34px, 7vw, 64px); line-height: 0.98; }
      p { max-width: 580px; margin: 0; color: #475569; font-size: 16px; line-height: 1.8; }
      .tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 32px; }
      .tip { border-radius: 18px; background: rgba(248, 250, 252, 0.9); padding: 16px; color: #475569; font-size: 13px; line-height: 1.55; }
      .tip strong { display: block; margin-bottom: 5px; color: #0f172a; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      button, a {
        border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer;
        font: inherit; font-size: 14px; font-weight: 750; text-decoration: none;
      }
      button { background: #0f172a; color: white; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16); }
      a { background: white; color: #334155; box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.45); }
      @media (max-width: 680px) { .tips { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <section class="stage">
        <div class="eyebrow">LIVE RUNTIME</div>
        <h1>移动鼠标，看看你的拖尾。</h1>
        <p>这里加载的不是工作台模拟器，而是网页实际使用的 CursorDance 内容运行时。保存主题后无需刷新，本页会自动同步最新配置。</p>
        <div class="tips">
          <div class="tip"><strong>慢慢移动</strong>观察平滑、长度与双色渐变。</div>
          <div class="tip"><strong>快速甩动</strong>触发速度亮度和前向爆发。</div>
          <div class="tip"><strong>急转与急停</strong>触发侧向散射和收束涟漪。</div>
        </div>
        <div class="actions">
          <button id="runtime-trigger" type="button">点击测试动作效果</button>
          <a href="/">返回工作台</a>
        </div>
      </section>
    </main>
  </body>
</html>
