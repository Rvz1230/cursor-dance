<!--
  Smoke test target page for Playwright E2E tests (smoke/local-preview-flow.spec.js).
  Contains interactive elements used to verify cursor effects render correctly.
-->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CursorDance Smoke Target</title>
    <script src="/config-runtime/text-semantics.js"></script>
    <script src="/config-runtime/action-config.js"></script>
    <script src="/config-runtime/compute-specs.js"></script>
    <script src="/config.js"></script>
    <script src="/content-runtime/site-matcher.js"></script>
    <script src="/content-runtime/diagnostics.js"></script>
    <script src="/content-runtime/config-store.js"></script>
    <script src="/content-runtime/visual-effects.js"></script>
    <script src="/content-runtime/audio-duck-profile.js"></script>
    <script src="/content-runtime/audio.js"></script>
    <script src="/content-runtime/cursor-overlay.js"></script>
    <script src="/content-runtime/trigger-handlers.js"></script>
    <script src="/content-runtime/atmosphere.js"></script>
    <script src="/content.js"></script>
    <style>
      :root {
        font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        color: #10233f;
        background:
          radial-gradient(circle at top, rgba(110, 231, 183, 0.28), transparent 34%),
          linear-gradient(180deg, #f8fafc 0%, #eef6ff 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 96px 24px 120px;
      }

      .panel {
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.88);
        padding: 36px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 40px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        max-width: 620px;
        line-height: 1.7;
        color: #475569;
      }

      .actions {
        display: flex;
        gap: 16px;
        margin-top: 32px;
      }

      button,
      a {
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #059669, #0f766e);
        color: white;
        padding: 14px 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 12px 24px rgba(5, 150, 105, 0.18);
      }

      .ghost {
        background: white;
        color: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>CursorDance 本地冒烟页</h1>
        <p>这个页面会直接加载 <code>config.js</code> 和 <code>content.js</code>，用于验证 popup 选中主题、workbench 未保存预览、以及回退到已保存配置的联动链路。</p>
        <p style="margin-top: 14px;">如需查看运行时诊断日志，可追加 <code>?cursordance-debug=1</code>，或在控制台执行 <code>localStorage.setItem('cursordance.debug', '1')</code> 后刷新。</p>

        <div class="actions">
          <button id="smoke-trigger" type="button">点击我触发特效</button>
          <a class="ghost" href="https://example.com" target="_blank" rel="noreferrer">普通链接目标</a>
        </div>
      </section>
    </main>

    <script>
      (function setupSmokeMediaProbe() {
        const media = document.createElement("video");
        let currentVolume = 0.72;
        let currentMuted = false;
        let emulateSiteReassert = false;
        media.id = "smoke-media";
        media.setAttribute("aria-hidden", "true");
        media.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;";

        Object.defineProperty(media, "readyState", {
          configurable: true,
          get() {
            return 4;
          },
        });

        Object.defineProperty(media, "paused", {
          configurable: true,
          get() {
            return false;
          },
        });

        Object.defineProperty(media, "volume", {
          configurable: true,
          get() {
            return currentVolume;
          },
          set(nextValue) {
            const numericValue = Number(nextValue);
            currentVolume = Number.isFinite(numericValue) ? Math.max(0, Math.min(1, numericValue)) : currentVolume;
            media.dataset.volume = currentVolume.toFixed(3);
          },
        });

        Object.defineProperty(media, "muted", {
          configurable: true,
          get() {
            return currentMuted;
          },
          set(nextValue) {
            currentMuted = Boolean(nextValue);
            media.dataset.muted = String(currentMuted);
          },
        });

        document.body.appendChild(media);
        media.volume = 0.72;
        media.muted = false;

        window.__cursorDanceSmokeMedia = {
          reset() {
            emulateSiteReassert = false;
            media.volume = 0.72;
            media.muted = false;
          },
          enableReassert() {
            emulateSiteReassert = true;
          },
          disableReassert() {
            emulateSiteReassert = false;
          },
          getState() {
            return {
              volume: currentVolume,
              muted: currentMuted,
              emulateSiteReassert,
            };
          },
        };

        window.setInterval(() => {
          if (!emulateSiteReassert) return;
          media.volume = 0.72;
          media.muted = false;
        }, 60);
      })();
    </script>
  </body>
</html>
