appId: com.cursordance.app
productName: CursorDance
copyright: Copyright © 2026 CursorDance

# electron-vite 把构建产物落到 out/，下面的 directories 配置让 builder 直接接收 out/ + node_modules
directories:
  output: release
  buildResources: build

# 进入 asar 的源
files:
  - out/**/*
  - "!out/renderer/**/*.map"
  - package.json
  - "!**/.DS_Store"
  - "!**/*.{md,markdown}"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/*.test.*"
  - "!**/__tests__/**"

# 不进 asar，直接拷贝到 Resources/ —— extension/ 下的 icon-16.png 等运行时资源由
# resolveTrayIconPath() 在 process.resourcesPath/extension/ 下查找。
extraResources:
  - from: extension
    to: extension
    filter:
      - "**/*"
      - "!**/*.test.*"
      - "!**/.DS_Store"

# uiohook-napi 的 .node 二进制必须从 asar 里 unpack，否则运行时 dlopen 失败。
# get-windows 同理 —— 它依赖打包内的 macOS 原生 helper。
asarUnpack:
  - "**/node_modules/uiohook-napi/**/*"
  - "**/node_modules/get-windows/**/*"

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 普通 CI 明确保持 unsigned；正式 release workflow 通过命令行覆盖 identity / notarize，
  # 并在发布前强制验签，避免证书缺失时误发 unsigned 产物。
  identity: null
  extraResources:
    - from: build/native/${arch}/cursordance-cursor-helper
      to: native/cursordance-cursor-helper
  # 正式签名启用后，将原生 helper 与主应用使用同一身份签名。
  binaries:
    - Contents/Resources/native/cursordance-cursor-helper
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extendInfo:
    NSAppleEventsUsageDescription: CursorDance 需要监听全局鼠标和窗口切换以渲染光标特效。
    LSUIElement: false

dmg:
  title: ${productName} ${version}
  icon: build/icon.icns
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  # icon 留空 —— electron-builder 自动从 build/icon.png（512×512）派生 .ico
  extraResources:
    - from: build/native/${arch}/cursordance-cursor-helper.exe
      to: native/cursordance-cursor-helper.exe
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: CursorDance
  # 升级和卸载均保留 electron-store 配置与素材；用户数据清理必须由应用内显式操作完成。
  deleteAppDataOnUninstall: false

# 自动更新通过 GitHub Releases 分发。electron-builder 只生成安装包与更新元数据；
# `.github/workflows/release.yml` 在两端验签后统一生成 checksums 并创建 Release，
# 避免平台 job 分别 publish 导致半成品版本可见。
publish:
  provider: github
  owner: Rvz1230
  repo: cursor-dance
  releaseType: release
