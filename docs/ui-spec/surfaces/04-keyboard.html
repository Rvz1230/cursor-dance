<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>键盘动效 · UX 原型</title>
<link rel="stylesheet" href="../mockup.css" />
<style>
  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .key-glyph { position: absolute; line-height: 1; pointer-events: none; user-select: none; white-space: pre; }
  /*
    默认与大窗口使用真正的编辑器分栏：左边只负责预览，右边负责配置并独立滚动。
    主区页头保持固定，调整长配置时不再反复丢失预览上下文。
  */
  [data-w="md"] #main.keyboard-main,
  [data-w="lg"] #main.keyboard-main { display: flex; flex-direction: column; overflow: hidden; }
  [data-w="md"] #mainGrid,
  [data-w="lg"] #mainGrid { min-height: 0; flex: 1 1 0%; align-items: start; overflow: hidden; }
  [data-w="md"] #mainGrid { grid-template-columns: minmax(0, 1fr) 350px; }
  [data-w="lg"] #mainGrid { grid-template-columns: minmax(0, 1fr) 420px; }
  [data-w="md"] .settings-column,
  [data-w="lg"] .settings-column {
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 2px;
    scrollbar-gutter: stable;
  }
  [data-w="md"] .kbd-stage { max-width: 430px; }
  [data-w="lg"] .kbd-stage { max-width: 720px; }
  /* 最小窗口回到单列文档流，避免嵌套滚动。 */
  [data-w="sm"] .kbd-stage { max-width: 250px; }
  .compact-group > section { border-radius: .65rem; box-shadow: none; }
</style>
</head>
<body class="bg-slate-200 p-6 text-slate-900">

<div id="proto"></div>
<div id="app"></div>

<template id="page">

      <!-- 页头 -->
      <div class="mb-2.5 flex min-h-8 flex-row items-center justify-between gap-3">
        <h1 class="min-w-0 text-base font-semibold text-slate-900 text-balance">键盘动效</h1>
        <div class="flex shrink-0 flex-wrap items-center gap-2">
          <!--
            全页最重要的控件原先是个 `<div>`：`tabIndex` 实测 -1、无 `role`——
            既不可聚焦、键盘到不了，读屏也只看到一个匿名容器。
            改成 `button role="switch"`，选中态由 aria-checked 携带（syncAll 里同步），
            不再只靠旋钮的位移和底色表达。
          -->
          <button id="enableToggle" type="button" role="switch" aria-checked="true"
            class="flex h-8 items-center gap-2 rounded-xl bg-white px-2.5 text-xs text-slate-600 shadow-sm ring-1 ring-slate-200 transition-colors hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400">
            <span id="enableKnob" class="switch-knob switch-on"></span>
            <span class="font-medium">启用动效</span>
          </button>
          <div class="relative">
            <button id="pageMoreBtn" class="grid size-8 place-items-center rounded-xl bg-white text-slate-500 shadow-sm ring-1 ring-slate-200 transition-colors hover:bg-slate-50 hover:text-slate-800" aria-label="更多操作" aria-expanded="false">···</button>
            <div id="pageMoreMenu" class="absolute right-0 top-10 z-30 hidden w-36 rounded-xl border border-slate-200 bg-white p-1.5 shadow-lg">
              <button id="resetBtn" class="flex h-8 w-full items-center rounded-lg px-2.5 text-left text-xs text-slate-600 hover:bg-slate-50">
                恢复当前主题默认
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 缺权限 -->
      <div data-show="denied" class="mb-2.5 flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
        <svg class="mt-0.5 size-4 shrink-0 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <div class="min-w-0">
          <div class="text-xs font-medium text-amber-900">仅预览模式 · 需要辅助功能权限</div>
          <p class="mt-1 hint-warn">
            授权前动效只在下方预览里生效，桌面上不会出现。预览本身不需要权限，可以先把外观调好。
          </p>
          <button class="mt-2 inline-flex items-center gap-1 text-xs font-medium text-amber-900 underline underline-offset-2 transition-colors hover:text-amber-700">
            打开系统设置 → 隐私与安全 → 辅助功能
            <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
          </button>
        </div>
      </div>

      <section id="offSummary" class="mb-2.5 hidden rounded-xl border border-slate-200 bg-white px-4 py-4 shadow-sm">
        <div class="flex items-center justify-between gap-4">
          <div class="min-w-0">
            <h3 class="text-sm font-medium text-slate-900">当前主题的键盘动效已关闭</h3>
            <p class="mt-1 text-xs leading-relaxed text-slate-500">配置仍然保留，重新开启后会立即恢复。</p>
          </div>
          <button id="editWhileOffBtn" class="btn-ghost h-8 shrink-0 px-3 text-xs">继续调整</button>
        </div>
      </section>

      <!--
        和 02 同一个坑：`xl:grid-cols-[...]` 看的是浏览器视口，在固定尺寸的模拟窗口里**从不生效**。
        后果是右侧 360px 的配置面板（入场方向、字号、缩放、语义分层…）一直堆在
        404px 屏幕预览**下面**，真实默认窗口下首屏只看得到预览——
        而预览是辅助元素，配置才是这一页的主任务。
        改成按模拟窗口宽度分档（shell.js 的 widthBucket）。
      -->
      <!--
        ════ 单列（w=sm）时的顺序 ════
        两列断点修好之后仍然剩一个洞：w=sm 只有一列，此时两个列容器**整块**堆叠，
        于是「左列」的 屏幕预览 + 语义分层 + 调制（实测共 1137px）全压在配置面板前面。
        实测 720×480 下内容 2244px / 视口 396px ≈ 5.7 屏，而这一页的主任务面板「外观」
        在 1251px 处——要滚三屏才够得着。这与两列断点那个坑是**同一个失效模式**
        （辅助元素占住首屏、主任务在折叠线以下），只是阈值从浏览器视口挪到了 w=sm。

        修法：单列时给两个列容器 `contents`，八个区块升成同一个 grid 的直接子元素，
        再用 order 排出真正的优先级：
          预览（要先看到才知道在调什么）→ 外观（主任务）→ 锚点/位置/显示内容（三个 64px 折叠头，很便宜）
          → 语义分层 → 调制 → 精调
        列容器同时从 space-y 换成 grid+gap：space-y 的 `& > * + *` 外边距在
        `display:contents` 下仍然命中子元素，会和外层 grid 的 gap 叠加成双倍间距。
      -->
      <div id="mainGrid" class="grid gap-2.5 group-data-[w=md]/win:grid-cols-[minmax(0,1fr)_300px] group-data-[w=lg]/win:grid-cols-[minmax(0,1fr)_360px]">

        <!-- ════ 左：屏幕预览 + 语义分层 ════ -->
        <div class="preview-column grid min-w-0 content-start gap-2.5 group-data-[w=sm]/win:contents">
          <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm group-data-[w=sm]/win:order-1">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-4 py-3">
              <div class="min-w-0">
                <h3 class="text-sm font-medium text-slate-900">屏幕预览</h3>
                <!--
                  缩放比原先写死「按 50% 缩放」。实测它只在某个特定宽度下碰巧成立：
                  默认 960 窗口下是 0.367、最小 720 窗口是 0.415、大屏才接近 0.66。
                  预览框宽度是弹性的，任何写死的比例都必然说谎，所以改成实测值。
                -->
                <!--
                  这句必须短到**一行**。它和右侧那组控件（浅色/深色分段 + 折叠按钮）
                  抢同一条标题栏的宽度：本轮加折叠按钮之后它折成两行，
                  把标题栏从 63px 又顶回 105px——上一批省下的 42px 原路还了回去。
                  「在页面任意处打字都会触发」删掉不丢信息：舞台里的 #typeHint
                  写着「直接开始打字」，顶栏提示也写着同一件事，这里是第三遍。
                -->
                <div class="hidden"><span id="previewScaleWrap"><span id="previewScale">50</span></span><span id="previewNote"></span></div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="seg-group" role="radiogroup" aria-label="桌面底色">
                  <button data-wall="light" role="radio" aria-checked="false" class="seg-item">浅色</button>
                  <button data-wall="dark" role="radio" aria-checked="false" class="seg-item">深色</button>
                </div>
                <!--
                  预览可折叠。**这一节是唯一没法靠压缩解决的纵向占用**：
                  最小窗口（720×480）主区只有 396px，而预览一节约 340px，
                  于是首屏放不下任何一个配置区块的标题——这一档下的内容里第一屏全是预览。

                  刻意**不做自动折叠**：这一页的入口就是「点一下预览再打字」，
                  在某个尺寸下默认把它藏起来是一个产品判断，不该由重排顺手做掉。
                  这里只给出手动收起的口子，让小窗口下的人自己拿回那 340px。

                  折叠按钮单独一个 button，而不是把整条标题栏做成按钮：
                  标题栏里已经有「浅色/深色」分段控件和两个徽标，按钮不能套按钮。
                  （「调制」那节改成整条标题栏可点，是因为那条标题栏本来就没有别的控件。）
                -->
                <button id="previewToggle" class="grid size-7 shrink-0 place-items-center rounded-lg text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                  aria-expanded="true" aria-controls="previewBody" aria-label="收起屏幕预览">
                  <svg id="previewChevron" class="size-4 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </button>
              </div>
            </div>

            <div id="previewBody" class="px-4 py-3">
              <!-- 屏幕框：四条边可点选入场边；内部可拖停留位置 -->
              <div class="relative kbd-stage mx-auto">
                <div id="screen" tabindex="0" role="group" aria-label="屏幕预览：点一下再打字即可预览效果"
                  class="relative aspect-[16/10] w-full overflow-hidden rounded-xl border border-slate-200 bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2">
                  <!--
                    桌面底图（功能性参照物，用来判断字符在真实桌面上看不看得清）。

                    内容由 syncAll 从 WALL 表生成，几何走**百分比**。原先是写死像素的
                    `left-8 w-64` + `right-10 w-72`：横向共需 618px，而预览框宽度跟着
                    模拟窗口变——实测默认 960 窗口下只有 530px，两个「窗口」横向重叠 88px；
                    最小 720 窗口 600px，重叠 18px；只有大屏 950px 才不叠。
                    也就是**只有用户实际会用的两个尺寸是坏的**。
                    连带损失更贵：重叠掉的正是 #fgWin 对齐的那个右侧窗口，
                    于是「前台窗口」锚点在默认尺寸下点亮的是一团糊在一起的白框，这一档的演示等于失效。
                  -->
                  <div id="wallpaper" class="absolute inset-0"></div>

                  <!--
                    前台窗口 + 文字插入点。

                    刻意**不放进 #wallpaper**：那块的 innerHTML 在 syncAll 里整体重建，
                    锚点元素放进去每次同步都会被冲掉，而 anchorBox() 要读它的实测几何，
                    元素身份必须稳定。

                    但要放进 **#screen 里**（原先是 #screen 的兄弟节点）。
                    原因是百分比的参照系必须和 #wallpaper 同一个：#wallpaper 是
                    `absolute inset-0`，参照 #screen 的 padding box；而放在外层 .relative
                    时参照的是含 1px 边框的 border box。实测两者差 1px（223 vs 222），
                    「点亮底图上那个窗口」于是变成「盖上一个错开一像素的框」。
                    放进 #screen 后两者共用同一个包含块，永远严丝合缝，
                    也顺带被 #screen 的 overflow-hidden 正确裁切。

                    位置由 syncAll 从 WALL[2] 一处套上去（FG_WIN_STYLE），不写在这里。
                  -->
                  <div id="fgWin" class="pointer-events-none absolute hidden rounded-lg border border-slate-400">
                    <div class="absolute left-1 top-1 text-2xs font-medium text-slate-500">前台窗口</div>
                    <div class="absolute inset-x-4 top-6 space-y-1.5">
                      <div class="h-1.5 w-4/5 rounded-full bg-slate-300/70"></div>
                      <div class="h-1.5 w-3/5 rounded-full bg-slate-300/70"></div>
                    </div>
                    <!-- 插入点：一条竖线 + 它左边的一段已输入文字，位置就是 anchorBox('caret') 的取值点 -->
                    <div id="caretRow" class="absolute inset-x-4 top-16 hidden items-center gap-1">
                      <div class="h-1.5 flex-1 rounded-full bg-slate-300/70"></div>
                      <div id="caretMark" class="h-4 w-0.5 shrink-0 bg-slate-900"></div>
                      <div class="w-10 shrink-0"></div>
                    </div>
                  </div>

                  <!--
                    打字机基线。和键位散开带是同一个用途——把「字符会落在哪儿」
                    在配置阶段就画出来，不用先打字再猜。
                    两者互斥（同一时刻只有一种横向分布生效），所以各自独立显隐即可。
                  -->
                  <div id="typeLine" class="pointer-events-none absolute hidden">
                    <div class="absolute inset-x-0 bottom-0 border-b border-dashed border-slate-400/80"></div>
                    <div id="typeLineSamples" class="absolute inset-0"></div>
                    <div class="absolute -top-5 left-0 stage-tag">打字机基线</div>
                  </div>

                  <!-- 键位散开带 -->
                  <div id="spreadBand" class="pointer-events-none absolute hidden">
                    <div class="absolute inset-0 rounded-lg border border-dashed border-slate-300/80"></div>
                    <div id="bandSamples" class="absolute inset-0"></div>
                    <div id="bandLabel" class="absolute -top-5 left-0 stage-tag">按键位散开</div>
                  </div>

                  <!-- 停留位置 / 起始位置手柄 -->
                  <div id="restHandle" class="absolute z-10 -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing">
                    <div class="grid size-5 place-items-center rounded-full border-2 border-white bg-slate-950 shadow-sm ring-1 ring-slate-300">
                      <span class="size-1.5 rounded-full bg-white"></span>
                    </div>
                    <div id="restLabel" class="stage-tag absolute left-1/2 top-6 -translate-x-1/2 whitespace-nowrap text-slate-600">停留位置</div>
                  </div>

                  <!-- 入场提示 -->
                  <div id="typeHint" class="pointer-events-none absolute inset-x-0 top-1/2 -translate-y-1/2 text-center">
                    <span class="rounded-lg bg-white/85 px-3 py-1.5 text-xs font-medium text-slate-500 ring-1 ring-slate-200">直接开始打字</span>
                  </div>

                  <!--
                    输入法组字提示。

                    `07` 的「输入」组早就有一条守卫开关「输入法组字期间不显示字符」，
                    但用户是**在这一页**调键盘动效的，在这里完全看不到「中文输入时不出字符」。
                    这个落差被插入点锚点放大了：组字期间插入点还在动，却什么都不出——
                    看起来像是这一页的参数没生效。
                    所以就近给一句，并指回 07 那个开关（它才是真值源，这里不重复一个开关）。
                  -->
                  <div id="imeNote" class="pointer-events-none absolute inset-x-2 bottom-2 hidden justify-center">
                    <span class="rounded-lg bg-slate-900/80 px-2.5 py-1 text-xs font-medium text-white/90">中文输入组字期间不出字符 · 上屏那一刻才触发</span>
                  </div>

                  <!--
                    关闭态的蒙层。原先只写「动效已关闭」四个字，配上右栏 opacity-60 的减淡，
                    读起来像「这一页现在不能用了」——而配置其实一直可编辑。
                    改成把「哪一半停了、哪一半照常」说清，减淡则整个撤掉。
                  -->
                  <div id="offBadge" class="pointer-events-none absolute inset-0 hidden place-items-center bg-white/70">
                    <span class="mx-4 rounded-xl bg-white px-3 py-2 text-center text-xs font-medium text-slate-600 shadow-sm ring-1 ring-slate-200">
                      动效已关闭
                      <span class="hint-sub">配置仍可调整，开启后生效</span>
                    </span>
                  </div>
                </div>

                <!-- 四条边：入场边选择 -->
                <button data-edge="top" role="radio" aria-checked="false" class="edge-btn left-1/2 top-0 h-6 w-24 -translate-x-1/2 -translate-y-1/2">上</button>
                <button data-edge="bottom" role="radio" aria-checked="false" class="edge-btn bottom-0 left-1/2 h-6 w-24 -translate-x-1/2 translate-y-1/2">下</button>
                <button data-edge="left" role="radio" aria-checked="false" class="edge-btn left-0 top-1/2 h-20 w-7 -translate-x-1/2 -translate-y-1/2">左</button>
                <button data-edge="right" role="radio" aria-checked="false" class="edge-btn right-0 top-1/2 h-20 w-7 -translate-y-1/2 translate-x-1/2">右</button>
              </div>

              <!--
                这句原先是**恒定文案**，于是在两个状态下都在指挥用户操作不存在的控件：
                  · ②雨滴 + 按键位散开：圆点手柄实测 `hidden`，而它照旧写着「拖动圆点」
                  · 插入点锚点：四条边全部 `disabled`、手柄也 `hidden`，两句都失效
                右栏「位置」面板对这两种情况做了完整的禁用与改标签，预览这句却没跟上——
                同一份状态出两套说法，比不给说明更糟。现在由 syncStageHint() 按实际可用的控件生成。
              -->
              <!--
                两个实时读数放在**舞台下方这一行**，不放标题栏。

                第一版把它们改成按需出现后留在了标题栏里，结果是打字时标题栏
                从 63px 涨回 105px（徽标一出现就把那一行挤成两行），整块预览随打字上下跳。
                「按需出现」本身是对的，错的是位置：会出现和消失的东西不能放在
                一个宽度已经排满的行里。

                这一行本来只有一句 10px 提示，右侧全是空的，读数放这儿零成本，
                而且离它们描述的舞台更近。
              -->
              <!--
                `min-h-6` 把这一行的高度**预留出来**。不留的话徽标（h-6 = 24px）
                比单行提示（约 16px）高，一出现就把这一节从 447px 顶到 463px——
                跳动只是从标题栏挪到了这里，没有消失。会出现和消失的东西，
                要么放进已经足够高的行，要么把高度预留好。
              -->
              <div class="mt-2.5 flex min-h-6 items-center justify-between gap-3">
                <p id="stageHint" class="min-w-0 text-2xs leading-relaxed text-slate-500"></p>
                <div class="flex shrink-0 items-center gap-1.5">
                  <span id="liveCount" class="hidden h-6 items-center gap-1.5 rounded-lg bg-slate-50 px-2 text-xs font-semibold tabular-nums text-slate-600 ring-1 ring-slate-200">
                    同显 <span id="countNow">0</span>/<span id="countMax">30</span>
                  </span>
                  <span id="comboBadge" class="hidden h-6 items-center gap-1.5 rounded-lg bg-slate-50 px-2 text-xs font-medium text-slate-500 ring-1 ring-slate-200">
                    连击
                    <span class="flex items-center gap-0.5">
                      <span class="combo-dot size-1.5 rounded-full bg-slate-200"></span>
                      <span class="combo-dot size-1.5 rounded-full bg-slate-200"></span>
                      <span class="combo-dot size-1.5 rounded-full bg-slate-200"></span>
                      <span class="combo-dot size-1.5 rounded-full bg-slate-200"></span>
                      <span class="combo-dot size-1.5 rounded-full bg-slate-200"></span>
                    </span>
                  </span>
                </div>
              </div>
            </div>
          </section>

  if (Math.abs(fx.dur - 1) > 0.001) parts.push(`时长 ${pct(fx.dur)}`);

  // g=0 时等于关掉——但开关仍然独立保留：0% 是「暂时不要」，关掉是「不用这套」，
  // 前者会保留三个目标的选择，后者整段收起。
  if (base.typingCombo && kind === 'character' && comboLevel > 0) {
    const b = Math.min(comboLevel, 5);
    const g = (base.comboGain ?? 100) / 100;
    if (base.comboScale) n = { ...n, scale: n.scale * (1 + b * 0.035 * g) };
    if (base.comboOpacity) n = { ...n, opacity: Math.min(100, n.opacity + b * 2 * g) };
    if (base.comboGlow && b >= 3) n = { ...n, glow: true, glowRadius: Math.max(n.glowRadius, 6 + b * 2 * g) };
  }
  return n;
}

// ── 渲染（keyframes 与运行时同构，尺寸按预览缩放）
const SCREEN_REF_W = 1440;
// 在场字符数改为从 DOM 现数（见 liveCount），不再留独立计数器——
// 计数器和真实状态是两份数据，漂了就会把 render 的上限闸永久卡住。
let combo = { count: 0, at: 0 }, lastKeyAt = {};

/**
 * 锚点框：所有位置计算的参照系，单位是 #screen 的局部像素。
 *
 * 三档锚点统一成同一个矩形，位置公式只写一份：
 *   screen  整块屏幕
 *   window  前台窗口的实测矩形
 *   caret   插入点——**退化成零尺寸的框**
 *
 * 零尺寸这一步是关键：`A.x + A.w * offset` 在 w=0 时就等于 A.x，
 * 于是「键位散开」「水平偏移」这些按比例算的项自动失效，不需要为 caret 写特例分支。
 * 少一个分支就少一处将来会忘记同步的地方。
 *
 * 几何一律实测（getBoundingClientRect），不写死常量——README 教训：
 * 时间轴播放头当初就是因为依赖常量而偏了 5px，改布局会再错一次。
 */
function anchorBox(c) {
  const screen = $('screen');
  const W = screen.clientWidth, H = screen.clientHeight;
  if (c.anchor === 'screen') return { x: 0, y: 0, w: W, h: H };
  const sr = screen.getBoundingClientRect();
  if (c.anchor === 'window') {
    const wr = $('fgWin').getBoundingClientRect();
    return { x: wr.left - sr.left, y: wr.top - sr.top, w: wr.width, h: wr.height };
  }
  const cr = $('caretMark').getBoundingClientRect();
  return { x: cr.left - sr.left + cr.width / 2, y: cr.top - sr.top + cr.height, w: 0, h: 0 };
}

/**
 * 生效入场边。插入点锚点下四条边都没有意义（插入点是一个点，没有边），
 * 统一按「向上冒出」处理——与界面上禁用「入场边」保持一致。
 * 界面禁用而计算仍读旧值的话，会出现「控件是灰的但结果跟着它变」这种最难查的不一致。
 */
function effectiveEdge(c) {
  return c.anchor === 'caret' ? 'bottom' : c.originEdge;
}

function render(label, code, c, kind, level) {
  const screen = $('screen');
  const W = screen.clientWidth, H = screen.clientHeight;
  const S = W / SCREEN_REF_W;
  const fontSize = c.fontSize * c.scale * S;
  const half = fontSize / 2;
  const edge = effectiveEdge(c), vertical = edge === 'bottom' || edge === 'top';
  const layoutX = LAYOUT_X[code] ?? 0.5;
  let startX, startY, dx = 0, dy = 0;
  const bounce = c.animationStyle === 'bounce';
  const restDist = c.bounceHeight * S;
  const A = anchorBox(c);

  // 雨滴的行程原本是「贯穿锚点框」（A.h + 两个字高）。这在屏幕锚点下是 401px、
  // 窗口锚点下是 257px，都读得出「坠落」；但插入点是**零尺寸**框，A.h=0 →
  // 行程只剩 fontSize*2 ≈ 40px，是一次抽动而不是坠落，而且这个组合下
  // restField 被 raindrop 分支藏起来，用户连一个距离控件都没有。
  // 所以插入点锚点下雨滴的行程改由「坠落距离」（复用 bounceHeight）给出。
  const rainSpanY = A.h > 0 ? (A.h + fontSize * 2) : (restDist + half);
  const rainSpanX = A.w > 0 ? (A.w + fontSize * 2) : (restDist + half);
  /*
    打字机档的横向位置：接着上一个字符往右排。

    宽度用 0.62em 近似——这一稿不做字形测量（`measureText` 要拿 canvas 上下文，
    而这里每个字符都是独立 DOM 节点，量一次就要一次强制布局）。
    0.62 是等宽/半宽混排的经验值，够表达「排队」这个形态。

    换行判据是「排到锚点框右边界」。不做真正的多行：多行需要行高、行数上限、
    滚动策略一整套决定，而这一档要说明的是「字符横向依次出现」，不是做一个文本编辑器。
  */
  const advance = fontSize * 0.62;
  let queueX = 0;
  if (c.originMapping === 'typewriter') {
    const now = performance.now();
    if (now - typeRun.at > 1200 || typeRun.x + advance > A.w * 0.92) typeRun.x = 0;
    typeRun.at = now;
    queueX = typeRun.x;
    typeRun.x += advance;
  }
  /** 三档横向分布的起点，写一份供四条边复用。 */
  const spreadX = () => c.originMapping === 'typewriter'
    ? A.x + A.w * 0.04 + queueX + half
    : A.x + (c.originMapping === 'center' ? A.w * c.globalOffsetX : A.w * layoutX);
  if (edge === 'bottom') {
    startX = spreadX();
    startY = A.y + A.h + half;
    dy = bounce ? -(restDist + A.h * c.globalOffsetY + half) : -rainSpanY;
  } else if (edge === 'top') {
    startX = spreadX();
    startY = A.y - half;
    dy = bounce ? (restDist + A.h * c.globalOffsetY + half) : rainSpanY;
  } else if (edge === 'left') {
    startX = A.x - half;
    startY = A.y + (c.originMapping === 'center' ? A.h * c.globalOffsetY : A.h * 0.5);
    dx = bounce ? (restDist + A.w * c.globalOffsetX + half) : rainSpanX;
  } else {
    startX = A.x + A.w + half;
    startY = A.y + (c.originMapping === 'center' ? A.h * c.globalOffsetY : A.h * 0.5);
    dx = bounce ? -(restDist + A.w * c.globalOffsetX + half) : -rainSpanX;
  }
  // 插入点锚点不加抖动：这一档的全部意义就是「精确出现在你打字的那个位置」，
  // 抖开就退化成又一个随机位置的飘字了。
  // 打字机档也不加抖动，理由和插入点一样：这一档的全部意义是「排成一行」，
  // 抖开之后就退化成又一种散落，和「按键位散开」再也分不出来。
  const jitter = (c.anchor === 'caret' || c.originMapping === 'typewriter') ? 0 : (Math.random() * 40 - 20) * S;
  if (vertical) dy += dy >= 0 ? jitter : -jitter; else dx += dx >= 0 ? jitter : -jitter;

  const weights = { '标准': 400, '中等': 500, '半粗': 600, '加粗': 700 };
  /* 字体栈从 Ctl.FONTS 取，不在这里再写一份。
     这原先是**第三份**字体拷贝：下拉读 FAMILIES（下面那个常量）、舞台读这个 families，
     两份都手写 4 条。名字在一份里有、在另一份里没有的时候，
     舞台会静默退回 system-ui——而下拉照旧显示你选中的那个字体名。 */
  const paint = resolveColor(c, code, kind, level);

  /**
   * 一个字符节点。拖尾会用它做出 N 个副本，所以建节点的逻辑必须只有一份。
   *
   * 渐变用 `background-clip: text` + 透明文字实现。**这条路会把 text-shadow 吃掉**
   * （阴影是文字的阴影，而文字此时是透明的），所以渐变开着时发光改走
   * `filter: drop-shadow`。两条路都留着，不是重复——它们的失效条件不一样，
   * 合成一条就必然有一种组合出不来。
   */
  const makeGlyph = (opacity, extraScale) => {
    const el = document.createElement('div');
    el.className = 'key-glyph';
    el.textContent = c.uppercase ? label.toUpperCase() : label;
    el.style.left = startX + 'px'; el.style.top = startY + 'px';
    el.style.fontSize = fontSize + 'px';
    el.style.fontWeight = weights[c.fontWeight] || 700;
    el.style.fontFamily = Ctl.fontStack(c.fontFamily);
    el.style.opacity = String(opacity);
    if (c.gradient) {
      el.style.backgroundImage = `linear-gradient(180deg, ${paint}, ${c.gradientTo})`;
      el.style.webkitBackgroundClip = 'text';
      el.style.backgroundClip = 'text';
      el.style.color = 'transparent';
      if (c.glow) el.style.filter = `drop-shadow(0 0 ${c.glowRadius * S * 2}px ${c.glowColor})`;
    } else {
      el.style.color = paint;
      if (c.glow) el.style.textShadow = `0 0 ${c.glowRadius * S * 2}px ${c.glowColor}`;
    }
    return el;
  };
  const el = makeGlyph(c.opacity / 100);

  const target = c.opacity / 100;
  let frames;
  if (c.animationStyle === 'raindrop') {
    const boost = c.gravity * 0.5;
    const windDist = (vertical ? W : H) * 0.3 * c.wind;
    const fdx = dx * (1 + boost) + (vertical ? windDist : 0);
    const fdy = dy * (1 + boost) + (vertical ? 0 : windDist);
    frames = [
      { opacity: 0, transform: 'translate(-50%,-50%) translate(0,0)' },
      { opacity: target, transform: `translate(-50%,-50%) translate(${dx * 0.2}px,${dy * 0.2}px)`, offset: 0.2 },
      { opacity: target, transform: `translate(-50%,-50%) translate(${dx * 0.5 + (vertical ? windDist * 0.3 : 0)}px,${dy * 0.5 + (vertical ? 0 : windDist * 0.3)}px)`, offset: 0.6 },
      { opacity: 0, transform: `translate(-50%,-50%) translate(${fdx}px,${fdy}px)` },
    ];
  } else {
    const ease = 'cubic-bezier(0.4, 0, 0.2, 1)';
    frames = [
      { opacity: 0, transform: 'translate(-50%,-50%) translate(0,0) scale(0.4)', easing: ease },
      { opacity: target, transform: `translate(-50%,-50%) translate(${dx * 0.12}px,${dy * 0.12}px) scale(0.82)`, offset: 0.12, easing: ease },
      { opacity: target, transform: `translate(-50%,-50%) translate(${dx * 1.06}px,${dy * 1.06}px) scale(1.18)`, offset: 0.42, easing: ease },
      { transform: `translate(-50%,-50%) translate(${dx * 0.94}px,${dy * 0.94}px) scale(0.96)`, offset: 0.6, easing: ease },
      { transform: `translate(-50%,-50%) translate(${dx * 1.02}px,${dy * 1.02}px) scale(1.04)`, offset: 0.74, easing: ease },
      { opacity: target, transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1)`, offset: 0.85, easing: ease },
      { opacity: 0, transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1)` },
    ];
  }

  /*
    消散方式只改**最后一帧**，前面所有段保持原样。

    这样做的理由是范围控制：入场那一整套 keyframe（弹跳的多段振荡、雨滴的
    重力/风力）是这一页最容易改坏的东西——README 记过一次把「弹跳」曲线
    当整条动画 timing function 用、结果字符全程不可见的事故。
    消散只碰终点，四档都不可能影响入场。

    `blur` 用 filter。它和渐变态的 `filter: drop-shadow` 会**互相覆盖**
    （同一个属性），所以两者同开时把 drop-shadow 一起写进最后一帧，
    否则渐变+发光+模糊的组合会在消散的瞬间把发光丢掉。
  */
  const last = frames[frames.length - 1];
  const glowFilter = (c.gradient && c.glow) ? ` drop-shadow(0 0 ${c.glowRadius * S * 2}px ${c.glowColor})` : '';
  const tail = { ...last };
  if (c.exitStyle === 'shrink') {
    tail.transform = String(last.transform).replace(/scale\([^)]*\)/, 'scale(0.35)');
    if (!/scale\(/.test(String(last.transform))) tail.transform = `${last.transform} scale(0.35)`;
  } else if (c.exitStyle === 'rise') {
    const lift = fontSize * 1.1;
    tail.transform = String(last.transform).replace(
      /translate\((-?[\d.]+)px,(-?[\d.]+)px\)/,
      (_, x, y) => `translate(${x}px,${Number(y) - lift}px)`);
  } else if (c.exitStyle === 'blur') {
    tail.filter = `blur(${Math.max(3, fontSize * 0.16)}px)${glowFilter}`;
  }
  if (c.exitStyle !== 'blur' && glowFilter) tail.filter = glowFilter.trim();
  frames[frames.length - 1] = tail;
  // 缓动只作用在「入场那一段」，整条动画必须走 linear。
  //
  // 踩过的坑：把 `弹跳`（cubic-bezier(0.34,1.56,0.64,1)）当成整条动画的 timing
  // function 时，这条曲线中段 y > 1，缓动后的进度会提前冲过 1 并钳在最后一帧上——
  // 而最后一帧是 opacity:0，于是字符全程几乎不可见。keyframe 的 offset 语义要求
  // 整体 linear，各段自己的 easing 才能生效。
  /* timing function 由 Ctl.cssEasing 从**同一份 pts** 拼出来。
     原先这里是一张手写的 name → CSS 字符串表，而下拉的缩略图读的是另一份 pts 数组，
     两者对「弹性」的定义完全不同：这里是 cubic-bezier(0.68,-0.55,0.27,1.55)
     （先下冲、再过冲 55%），缩略图画的是 [.22,1,.36,1.18]（过冲 6.2%）。
     **缩略图画的曲线和真跑的动画是两条不同的曲线**，而界面上没有任何痕迹提示这件事。 */
  frames[0] = { ...frames[0], easing: Ctl.cssEasing(c.easing) };
  screen.appendChild(el);
  syncCount();
  const anim = el.animate(frames, { duration: c.duration, easing: 'linear', delay: c.delay, fill: 'forwards' });
  const done = () => { el.remove(); syncCount(); };
  anim.addEventListener('finish', done, { once: true });
  anim.addEventListener('cancel', done, { once: true });

  /*
    拖尾：同一条 keyframes 上错开 delay 的 N 个副本，越靠后越淡。
    `trail` / `trailLength` 在 KeyFeedbackConfigV4 里**本来就存在**，
    只是注释写着「保留但不实现不暴露 UI」——所以这不是新造字段，是把已有的接出来。

    刻意**不计入「同显」**（靠 `.key-ghost` 类被 liveCount 排除）：
    `maxSimultaneous` 是用户设的「同时显示几个字符」，
    一个带 3 段拖尾的字符如果算 4 个，把上限调到 30 实际只能打 7 个字，
    而界面上的「同显 x/30」会跟着跳到 4——那个数就不再是它标称的意思了。
    拖尾是这个字符的一部分，不是另外的字符。

    副本插在主字符**前面**（insertBefore），保证主字符始终压在拖影上方。
  */
  if (c.trail && c.trailLength > 0) {
    const n = Math.min(c.trailLength, 6);
    for (let i = 1; i <= n; i += 1) {
      const ghost = makeGlyph((c.opacity / 100) * (1 - i / (n + 1)) * 0.7);
      ghost.classList.add('key-ghost');   // liveCount 靠这个类把残影排除在「同显」之外
      ghost.style.pointerEvents = 'none';
      screen.insertBefore(ghost, el);
      const ga = ghost.animate(frames, {
        duration: c.duration,
        easing: 'linear',
        delay: c.delay + i * Math.max(24, c.duration * 0.035),
        fill: 'forwards',
      });
      const gdone = () => ghost.remove();
      ga.addEventListener('finish', gdone, { once: true });
      ga.addEventListener('cancel', gdone, { once: true });
    }
  }
}

/**
 * 在场字符数**从 DOM 数**，不再维护一个独立计数器。
 *
 * 原先是 `let active = 0` 配 `active += 1` / `active -= 1`。走查时我自己
 * 手动 remove 了几个节点，`active` 就永久卡在 30（= maxSimultaneous）——
 * 而 render 的第一道闸是 `if (active >= cfg.maxSimultaneous) return`，
 * 于是**整页再也不出任何效果，不报错、不留痕**，「同显 30/30」还理直气壮地显示着。
 *
 * 计数器和它描述的真实状态是两份数据，就一定会漂。改成每次现数：
 * 节点数是唯一真值源，任何异常清理都会自动被纠正。
 * 数量级是几十，querySelectorAll 的成本可以忽略。
 *
 * 拖尾残影带 `.key-ghost`，不计入——它是这个字符的一部分，不是另外的字符
 * （否则把上限调到 30、开 3 段拖尾，实际只能打 7 个字）。
 */
function liveCount() {
  return $('screen').querySelectorAll('.key-glyph:not(.key-ghost)').length;
}
function syncCount() {
  const active = liveCount();
  $('countNow').textContent = active;
  $('countMax').textContent = cfg.maxSimultaneous;
  // 只在有字符在场时出现（见标记里的说明）。className 里保留 hidden/inline-flex 的切换，
  // 不写成 classList.toggle 之外的形式——这一行本来就整串重建，加两个 token 最省事。
  $('liveCount').className = (active > 0 ? 'inline-flex' : 'hidden')
    + ' h-6 items-center gap-1.5 rounded-lg px-2 text-xs font-semibold tabular-nums ring-1 '
    + (active >= cfg.maxSimultaneous ? 'bg-amber-50 text-amber-800 ring-amber-200' : 'bg-slate-50 text-slate-600 ring-slate-200');
}
function syncCombo(level) {
  document.querySelectorAll('.combo-dot').forEach((d, i) => {
    d.className = 'combo-dot size-1.5 rounded-full ' + (i < level ? 'bg-emerald-500' : 'bg-slate-200');
  });
  // 正在连打时才出现（见标记里的说明）
  $('comboBadge').classList.toggle('hidden', level <= 0);
  $('comboBadge').classList.toggle('inline-flex', level > 0);
  // 调制节的「当前档位」：把连击级别换算成实际加成，
  // 光有一排点看不出它到底改了多少。三个目标全关时说清是空转，
  // 否则会出现「点亮了 4 级但画面毫无变化」这种看起来像坏了的状态。
  const out = $('liveGain');
  if (!out) return;
  const g = cfg.comboGain / 100;
  const anyTarget = cfg.comboScale || cfg.comboOpacity || cfg.comboGlow;
  if (!cfg.typingCombo) out.textContent = '已关闭';
  else if (!level) out.textContent = '未在连打';
  else if (!anyTarget || cfg.comboGain === 0) out.textContent = `${level} 级 · 没有作用目标`;
  else {
    const parts = [];
    if (cfg.comboScale) parts.push(`字号 +${(level * 3.5 * g).toFixed(1)}%`);
    if (cfg.comboOpacity) parts.push(`不透明度 +${Math.round(level * 2 * g)}`);
    if (cfg.comboGlow && level >= 3) parts.push('发光');
    out.textContent = `${level} 级 · ${parts.join(' · ')}`;
  }
  out.className = 'text-xs font-semibold tabular-nums '
    + (cfg.typingCombo && level ? 'text-slate-700' : 'text-slate-500');
}
function flashLegend(kind) {
  document.querySelectorAll('.legend-row').forEach((row) => {
    row.classList.toggle('legend-row-hit', row.dataset.kind === kind && cfg.semanticStyles);
  });
  clearTimeout(flashLegend.t);
  flashLegend.t = setTimeout(() => document.querySelectorAll('.legend-row').forEach((r) => r.classList.remove('legend-row-hit')), 420);
}

// ── 键盘输入
//
// 监听绑在 document 上，而不是预览 div：真实产品用 uiohook 做全局捕获，
// 页面任意处打字都该触发。绑在 div 上时，只要点过滑块或预设卡焦点就跑了，
// 之后打字毫无反应且没有任何提示。表单控件里的输入需要排除。
//
// **拦按键默认行为的范围曾经把整页的键盘操作拆掉了。** 原先这里对
// Tab / Enter / Space / 四个方向键 / Backspace 一律 `preventDefault()`，
// 只要焦点不在表单控件里就拦。实测（在按钮上派发后读 defaultPrevented）：
// Tab、Enter、Space 全部 true。后果是
//   · Tab 焦点根本不动 —— 整页没有任何一个控件能用键盘到达
//   · Enter / Space 在按钮上被吞 —— 预设卡、分段控件、折叠头、四条入场边全都点不动
//   · 滑块自己有方向键处理，但你没办法把焦点移上去
// 也就是说：**这一页叫「键盘动效」，而它自己完全不能用键盘操作**，
// 走查者也没法用键盘验收这一稿。
//
// 更要紧的是这稿是重构依据。真实产品的全局捕获在主进程（uiohook），
// 渲染层压根不需要 preventDefault；照抄这段就会把缺陷实现进产品。
//
// 现在的范围收到最小：Tab / Enter **永不拦**（拦了就没有键盘可达性），
// 只有会滚动页面的键（Space / 方向键 / Backspace）才拦，且仅当焦点不在
// 任何交互控件上时——焦点落在按钮上时空格是「激活」、落在滑块上时方向键是「调值」，
// 拦下来就是又一个「按了没反应」。
/*
  ── 屏幕预览是一个「按键捕获面」，必须和外壳约定归属 ──

  这一页的提示语原文写着「试试 ⌘K、⇧、⏎ 看语义分层」，而 ⌘K 是外壳的命令面板：
  实测按下去面板展开、焦点被抢进 #cmdkInput、defaultPrevented=true。
  **用户照着页面的提示做，得到的是一个完全无关的界面。**
  外壳还占着 ⌘Z / ⌘⇧Z / ⌘1–5 / ⌘N / ⌘J——在一个演示按键的面里，
  这些恰好都是用户会去按的键，冲突面是 10 个。

  所以不是「换一个示例快捷键」，是**声明归属**：预览聚焦即进入捕获模式，
  外壳整体让位（只留 Esc），并且有可见徽标说明当前处于这个模式——
  一个悄悄改变了所有快捷键含义的模式，比冲突本身更糟。
*/
(() => {
  const screen = $('screen');
  const enter = () => window.setCaptureMode?.(true, '屏幕预览正在捕获按键');
  const exit = () => window.setCaptureMode?.(false);
  screen.addEventListener('focus', enter);
  screen.addEventListener('pointerdown', () => { screen.focus(); enter(); });
  screen.addEventListener('blur', exit);
  screen.addEventListener('keydown', (e) => { if (e.key === 'Escape') { exit(); screen.blur(); } });
})();

const SCROLL_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace']);
const INTERACTIVE_SEL = 'button, [role="slider"], [role="switch"], [data-trigger], a[href]';
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const onControl = t && typeof t.closest === 'function' ? t.closest(INTERACTIVE_SEL) : null;
  if (SCROLL_KEYS.has(e.code) && !onControl) e.preventDefault();
  if (!cfg.enabled) return;
  $('typeHint').classList.add('hidden');
  const now = performance.now();
  if (now - (lastKeyAt[e.code] || 0) < cfg.cooldownMs) return;
  lastKeyAt[e.code] = now;
  if (liveCount() >= cfg.maxSimultaneous) { syncCount(); return; }
  const label = displayLabel(e);
  if (label === null) return;
  const kind = semanticKind(e);
  let level = 0;
  // 自动重复（按住一个键不放）**不计入节奏**。
  // 这一节写着「打字越快，效果越强」，而按住不放并不是打得快——
  // 实测按住 A 六次自动重复就把档位刷满到 5 级，等于给了一个作弊入口，
  // 也让「节奏」这个词名不副实。
  //
  // 判据用 KeyboardEvent.repeat，不用时间阈值：真实的双字母（hello 里的 ll）
  // 间隔常常也很短，靠 30~60ms 这种阈值区分会把正常打字误判成按住。
  // 原生侧 uiohook 没有 repeat 字段，但「同一 keycode 期间没有夹 keyup」是等价判据。
  const isAutoRepeat = e.repeat === true;
  if (cfg.typingCombo && kind === 'character' && !isAutoRepeat) {
    combo.count = now - combo.at <= 260 ? Math.min(combo.count + 1, 8) : 1;
    combo.at = now;
    level = Math.max(0, combo.count - 1);
  } else if (isAutoRepeat) {
    // 保持当前档位、不推进也不清零：按住不放不该把已经攒起来的节奏抹掉
    level = Math.max(0, combo.count - 1);
  } else { combo = { count: 0, at: 0 }; }
  syncCombo(Math.min(level, 5));
  flashLegend(kind);
  render(label, e.code, derive(cfg, kind, level), kind, level);
});
setInterval(() => { if (performance.now() - combo.at > 500 && combo.count) { combo = { count: 0, at: 0 }; syncCombo(0); } }, 300);
$('screen').addEventListener('click', () => $('screen').focus());

// ── 停留位置手柄
function handlePos() {
  const screen = $('screen'), W = screen.clientWidth;
  const A = anchorBox(cfg);
  const H = A.h;
  const edge = effectiveEdge(cfg);
  const typer = cfg.originMapping === 'typewriter';
  const rain = cfg.animationStyle === 'raindrop';
  if (edge === 'bottom' || edge === 'top') {
    // 打字机档把手柄放在**行首**（4% 处），而不是键位档那样放中线：
    // 这一档的横向锚是一行的起点，手柄指向中间会让人以为字符从中间开始排。
    const x = A.x + (typer ? A.w * 0.04 : xIsAuto(cfg) ? A.w * 0.5 : A.w * cfg.globalOffsetX);
    const d = rain ? 0 : cfg.bounceHeight * (W / SCREEN_REF_W) + H * cfg.globalOffsetY;
    return { x, y: A.y + (edge === 'bottom' ? H - d : d) };
  }
  // 横向入场：键位映射是**横向**位置映射，对纵轴没有语义，所以这里回落到
  // globalOffsetY（= center 行为），而不是钉在屏幕中线。
  // 这与运行时 key-feedback.ts 的修法一致——那边原先硬编码 screenH * 0.5，
  // 导致 globalOffsetY 被静默忽略、控件点了没反应。稿子必须与之同步，
  // 否则重构时会照着稿子把那个缺陷重新实现一遍。
  const y = A.y + H * cfg.globalOffsetY;
  const d = rain ? 0 : cfg.bounceHeight * (W / SCREEN_REF_W) + A.w * cfg.globalOffsetX;
  return { x: A.x + (edge === 'left' ? d : A.w - d), y };
}

/** 打字机基线：把「字符会排在哪条线上」画出来，作用等同于键位档的散开带。 */
function syncTypeLine() {
  const line = $('typeLine');
  const vertical = effectiveEdge(cfg) === 'bottom' || effectiveEdge(cfg) === 'top';
  const show = cfg.originMapping === 'typewriter' && vertical && cfg.anchor !== 'caret';
  line.classList.toggle('hidden', !show);
  if (!show) return;
  const A = anchorBox(cfg), p = handlePos();
  const S = $('screen').clientWidth / SCREEN_REF_W;
  const fs = cfg.fontSize * S;
  line.style.left = (A.x + A.w * 0.04) + 'px';
  line.style.width = (A.w * 0.88) + 'px';
  line.style.top = (p.y + fs * 0.62) + 'px';
  $('typeLineSamples').innerHTML = ['a','b','c'].map((ch, i) =>
    `<span style="position:absolute;left:${i * fs * 0.62}px;bottom:2px;font-size:${fs}px;line-height:1;color:${cfg.color};opacity:.22;font-weight:700">${ch}</span>`).join('');
}
function syncHandle() {
  // 预览收起时 #screen 的 clientWidth 是 0，handlePos 会算出 NaN 并写进 style。
  // 不会报错、也看不出来，但展开前那一刻的几何全是垃圾值——直接跳过，
  // 展开时 previewToggle 会重跑一次 syncAll。
  if (!$('screen').clientWidth) return;
  const p = handlePos(), h = $('restHandle');
  h.style.left = p.x + 'px'; h.style.top = p.y + 'px';
  const rain = cfg.animationStyle === 'raindrop';
  const layout = cfg.originMapping === 'keyboardLayout';
  const caret = cfg.anchor === 'caret';
  const word = rain ? '起始位置' : '停留位置';
  // 只有纵向入场时键位才决定横向；横向入场时它完全不起作用，
  // 再挂这句会让人以为键位仍在生效，然后反复去调一个空操作。
  // 插入点锚点同理——那一档横向由插入点决定，键位映射也是空操作。
  const verticalEntry = effectiveEdge(cfg) === 'bottom' || effectiveEdge(cfg) === 'top';
  const typer = cfg.originMapping === 'typewriter';
  $('restLabel').textContent = word
    + (verticalEntry && !caret ? (typer ? '（行首）' : layout ? '（键位决定横向）' : '') : '');
  // 插入点锚点下位置不可拖：位置是插入点给的，留一个能拖但拖了没用的手柄
  // 就是又一个「点了没反应的死控件」。
  // 雨滴 + 任一自动横向档（键位/打字机）同理——那种组合下 x 和 y 都不由拖拽决定。
  h.classList.toggle('hidden', (rain && xIsAuto(cfg)) || caret);
  // 键位散开带
  const band = $('spreadBand'), screen = $('screen');
  const vertical = effectiveEdge(cfg) === 'bottom' || effectiveEdge(cfg) === 'top';
  const show = layout && vertical && !caret;
  band.classList.toggle('hidden', !show);
  if (show) {
    const A2 = anchorBox(cfg);
    const W = screen.clientWidth, S = W / SCREEN_REF_W;
    const fs = cfg.fontSize * S;
    // 散开带跟着锚点框走：窗口锚点下键位是在**窗口宽度**里铺开的，
    // 仍然按整屏画会让预览和实际落点不一致。
    band.style.left = A2.x + 'px'; band.style.width = A2.w + 'px';
    band.style.height = (fs * 1.6) + 'px';
    // 雨滴贯穿整屏、没有停留点，把散开带贴在入场边内侧显示，
    // 否则 p.y 会落在锚点框的上/下沿上、字样一半跑到框外。
    const bandCenter = cfg.animationStyle === 'raindrop'
      ? (cfg.originEdge === 'top' ? A2.y + fs * 1.2 : A2.y + A2.h - fs * 1.2)
      : p.y;
    band.style.top = (bandCenter - fs * 0.8) + 'px';
    // 标签默认挂在散开带**上方**（-top-5 = -20px）。顶部入场时带子本身就贴着屏幕顶，
    // 上方没有 20px 可用，于是标签被 #screen 的 overflow-hidden 整个裁掉——
    // 实测 ②雨滴 态下它的 top 是 -13px、完全不可见，那条虚线框就成了一个没有任何
    // 说明的方框。和本轮修的其他几处同类：**元素在标记里，但在某个可达状态下从不出现。**
    // 上方放不下就翻到下方。
    const flip = (parseFloat(band.style.top) || 0) < 22;
    $('bandLabel').classList.toggle('-top-5', !flip);
    $('bandLabel').classList.toggle('top-full', flip);
    $('bandLabel').classList.toggle('mt-1', flip);
    $('bandSamples').innerHTML = ['KeyQ','KeyE','KeyT','KeyU','KeyO','KeyP'].map((code, i) => {
      const label = ['q','e','t','u','o','p'][i];
      return `<span style="position:absolute;left:${LAYOUT_X[code] * 100}%;top:50%;transform:translate(-50%,-50%);font-size:${fs}px;line-height:1;color:${cfg.color};opacity:.22;font-weight:700">${label}</span>`;
    }).join('');
  }
}

/**
 * 舞台下面那句操作提示。
 *
 * 只说**此刻真的可用**的那几件事：四条入场边在插入点锚点下是 disabled，
 * 圆点手柄在「雨滴 + 按键位散开」和插入点锚点下是 hidden。
 * 原先这句是恒定文案，于是那两种状态下它都在指挥用户去点／去拖不存在的控件。
 *
 * 一件都不可用时不留空句，改成指向真正能改这些值的地方（右栏「位置」），
 * 否则用户会以为提示丢了。
 */
function syncStageHint() {
  const caret = cfg.anchor === 'caret';
  /*
    组字提示只在**插入点锚点**下出现，不常驻。

    理由是落差在这一档才真的会误判成"参数没生效"：插入点锚点意味着字符跟着光标走，
    而中文组字期间插入点一直在动、却什么都不出。其余锚点（键位 / 屏幕 / 窗口）
    没有这层暗示，常驻一条深色提示只是噪声。
  */
  $('imeNote').classList.toggle('hidden', !caret);
  $('imeNote').classList.toggle('flex', caret);
  const rain = cfg.animationStyle === 'raindrop';
  const edgesUsable = !caret;
  // 与 syncHandle 里 h.classList.toggle('hidden', …) 用**同一个判据**。
  // 两处写成不同表达式，就是又一次「提示说能拖，而手柄不在」——
  // 本轮已经修过一次，这里不重犯：都走 xIsAuto()。
  const handleUsable = !((rain && xIsAuto(cfg)) || caret);
  const word = rain ? '起始位置' : '停留位置';
  const parts = [];
  if (edgesUsable) parts.push('点四周的「上／下／左／右」选择字符从哪条边飞入');
  if (handleUsable) parts.push(`拖动圆点调整${word}`);
  $('stageHint').textContent = parts.length
    ? parts.join('；') + '。'
    : (caret
      ? '插入点锚点下位置由插入点决定，这里只作预览；距离在右栏「位置」里调。'
      : '这套组合下位置由键位和重力决定，参数在右栏「位置」里调。');
}

let dragging = false;
// 拖拽前存一份快照，松手时才作为一条撤销记录提交。
// 原先拖拽只 commit 文案、不带 before，于是**位置是这一页唯一撤销不了的改动**——
// 而没有保存按钮时撤销是唯一的后悔手段。按住不动到松手不产生记录（没真改过）。
let dragBefore = null;
$('restHandle').addEventListener('mousedown', (e) => { dragging = true; dragBefore = { ...cfg }; e.preventDefault(); });
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  const moved = dragBefore && (dragBefore.globalOffsetX !== cfg.globalOffsetX || dragBefore.globalOffsetY !== cfg.globalOffsetY);
  commit('已更新位置', moved ? dragBefore : undefined);
  dragBefore = null;
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const screen = $('screen'), r = screen.getBoundingClientRect();
  const S = screen.clientWidth / SCREEN_REF_W;
  // 拖拽要换算回**锚点框内**的归一化偏移，不是屏幕内的。
  // 用屏幕算的话，窗口锚点下拖到窗口中央会存成 0.5，而 0.5 是相对窗口的——
  // 换个窗口大小位置就全跑了。归一化的参照系必须和读取时一致。
  const A = anchorBox(cfg);
  if (A.w <= 0 || A.h <= 0) return;
  const x = Math.max(A.x, Math.min(A.x + A.w, e.clientX - r.left)) - A.x;
  const y = Math.max(A.y, Math.min(A.y + A.h, e.clientY - r.top)) - A.y;
  const edge = effectiveEdge(cfg), layout = cfg.originMapping === 'keyboardLayout';
  if (edge === 'bottom' || edge === 'top') {
    if (!layout) cfg.globalOffsetX = x / A.w;
    const d = edge === 'bottom' ? A.h - y : y;
    cfg.globalOffsetY = Math.max(0, (d - cfg.bounceHeight * S) / A.h);
  } else {
    if (!layout) cfg.globalOffsetY = y / A.h;
    const d = edge === 'left' ? x : A.w - x;
    cfg.globalOffsetX = Math.max(0, (d - cfg.bounceHeight * S) / A.w);
  }
  syncHandle();
});

// ── 控件装配
/*
  预设网格。前四个常显，其余四个收在「更多预设」后面。

  为什么要分：这一格是 2 列，每张卡约 82px，八张平铺是 4 行 ≈ 340px，
  会把「外观」重新顶回 640px 上下——正好抵消掉上一批把折叠头顶进首屏的成果。
  预设一旦超过 6 个就必须换容器，这里选「常用先行 + 其余收起」，
  与本页其他四处折叠同一个范式（决策 #2），而不是引入横向滚动
  （横向滚动会把后面的卡片藏在一个没有提示的方向上，发现成本更高）。
*/
function presetTile(p) {
  return `
    <button data-preset="${p.id}" role="radio" aria-checked="false" class="preset-tile">
      <span class="preset-stage"><span class="preset-glyph">A</span></span>
      <span class="preset-meta">
        <span class="preset-name">${p.name}</span>
        <span class="preset-desc">${p.desc}</span>
      </span>
    </button>`;
}
function buildPresets() {
  $('presetGrid').innerHTML = PRESETS.filter((p) => !p.more).map(presetTile).join('');
  $('presetMoreGrid').innerHTML = PRESETS.filter((p) => p.more).map(presetTile).join('');
  $('presetMoreCount').textContent = PRESETS.filter((p) => p.more).length;
  document.querySelectorAll('[data-preset]').forEach((btn) => btn.addEventListener('click', () => {
    const p = PRESETS.find((x) => x.id === btn.dataset.preset);
    const before = { ...cfg };
    cfg = { ...cfg, ...p.patch };
    syncAll(); commit(`已套用「${p.name}」`, before);
  }));
  animatePresetTiles();
}
function animatePresetTiles() {
  document.querySelectorAll('[data-preset]').forEach((btn, i) => {
    const glyph = btn.querySelector('.preset-glyph');
    const p = PRESETS[i];
    const run = () => {
      const rain = p.patch.animationStyle === 'raindrop';
      const from = p.patch.originEdge;
      const vec = { bottom: [0, 22], top: [0, -22], left: [-22, 0], right: [22, 0] }[from] || [0, 22];
      glyph.style.color = p.patch.color;
      const frames = rain
        ? [{ opacity: 0, transform: `translate(${vec[0]}px,${vec[1]}px)` }, { opacity: 1, transform: 'translate(0,0)', offset: .35 }, { opacity: 0, transform: `translate(${-vec[0]}px,${-vec[1]}px)` }]
        : [{ opacity: 0, transform: `translate(${vec[0]}px,${vec[1]}px) scale(.5)` }, { opacity: 1, transform: 'translate(0,0) scale(1.12)', offset: .45 }, { opacity: 1, transform: 'translate(0,0) scale(1)', offset: .7 }, { opacity: 0, transform: 'translate(0,0) scale(1)' }];
      glyph.animate(frames, { duration: p.patch.duration || 900, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
    };
    run();
    setInterval(run, 1900 + i * 130);
  });
}
function swatchRow(host, values, attr) {
  $(host).innerHTML = values.map((c) => `
    <button data-${attr}="${c}" role="radio" aria-checked="false" class="color-swatch" style="background:${c}" aria-label="颜色 ${c}"></button>`).join('');
}
function buildColors() {
  swatchRow('colorRow', COLORS, 'color');
  // 末尾补「自定义」：斜向棋盘格底，和 02 用棋盘格表示透明是同一套视觉惯例。
  $('colorRow').insertAdjacentHTML('beforeend', `
    <button id="customSwatch" role="radio" aria-checked="false" class="color-swatch grid place-items-center text-slate-500"
      style="background-image:linear-gradient(45deg,#e2e8f0 25%,transparent 25%,transparent 75%,#e2e8f0 75%),linear-gradient(45deg,#e2e8f0 25%,transparent 25%,transparent 75%,#e2e8f0 75%);background-size:8px 8px;background-position:0 0,4px 4px"
      aria-label="自定义颜色" title="自定义颜色">
      <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>`);
  document.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', () => {
    const before = { ...cfg };
    cfg.color = b.dataset.color;
    cfg._hexOpen = false;   // 选了色板就把输入行收回去
    syncAll(); commit('已更新颜色', before);
  }));
  $('customSwatch').addEventListener('click', () => {
    cfg._hexOpen = !cfg._hexOpen;
    syncAll();
    if (cfg._hexOpen) { $('hexInput').value = cfg.color.replace('#', ''); $('hexInput').focus(); $('hexInput').select(); }
  });
  swatchRow('gradientToRow', COLORS, 'gradto');
  document.querySelectorAll('[data-gradto]').forEach((b) => b.addEventListener('click', () => {
    const before = { ...cfg }; cfg.gradientTo = b.dataset.gradto; syncAll(); commit('已更新止色', before);
  }));
}

/*
  hex 输入。三件事必须做对，否则它就是个假控件：

  1. **边输边预览，但只在合法时才写进 cfg**。输到 `#F5` 时不能把颜色变成黑色，
     也不能什么反馈都没有——所以非法时给一句提示、右边的预览块保持上一个合法值。
  2. **不吞掉页面的按键效果**。document 上的 keydown 监听会跳过 INPUT，
     所以在这里打字不会往屏幕上喷字符，这一条本来就成立（`t.tagName === 'INPUT'`）。
  3. **一次改动只进一条撤销记录**。逐字符 commit 会把撤销栈灌满 6 条无意义记录，
     所以在 change/blur 时才提交，输入过程只更新预览。
*/
function normalizeHex(raw) {
  const v = (raw || '').trim().replace(/^#/, '');
  if (/^[\da-f]{3}$/i.test(v)) return '#' + v.split('').map((ch) => ch + ch).join('').toUpperCase();
  if (/^[\da-f]{6}$/i.test(v)) return '#' + v.toUpperCase();
  return null;
}
function bindHexInput() {
  const input = $('hexInput');
  let pending = null;
  const paint = () => {
    const hex = normalizeHex(input.value);
    pending = hex;
    $('hexPreview').style.background = hex || cfg.color;
    $('hexError').classList.toggle('hidden', !!hex || !input.value.trim());
    $('hexError').textContent = hex ? '' : '需要 3 位或 6 位十六进制，比如 F59E0B 或 FA0。';
  };
  input.addEventListener('input', paint);
  const applyHex = () => {
    if (!pending || pending === cfg.color) return;
    const before = { ...cfg };
    cfg.color = pending;
    syncAll();
    commit('已更新颜色', before);
  };
  input.addEventListener('change', applyHex);
  input.addEventListener('blur', applyHex);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); applyHex(); }
    if (e.key === 'Escape') { e.preventDefault(); input.value = cfg.color.replace('#', ''); paint(); input.blur(); }
  });
}

// 色相驱动四档用 mode-card（与锚点同一套单选卡）：每一档都需要一句说明，
// 分段控件塞不下，而「按键位」和「按语义」的区别不解释是猜不出来的。
function buildHueDrivers() {
  $('hueDriverGroup').innerHTML = HUE_DRIVERS.map(([id, name]) => `

function buildEdges() {

// 语义分层四行由 SEMANTIC 表生成：样张、说明、强度档都从同一处来。
// 「字符」是基准，没有强度档——给它一个档等于问「基准相对基准偏多少」。
function buildLegend() {
  // 名称与说明摊成一行（原先是上下两层，把行高撑到 54px）。
  // 说明是四组系数算出来的、会随强度实时变，所以它必须留着——
  // 但它是次要信息，让它 truncate 而不是让名称换行。
  $('legendGrid').innerHTML = SEMANTIC.map((s) => `

    </div>`).join('');
  SEMANTIC.filter((s) => !s.baseline).forEach((s) => {
    LEG[s.kind] = Ctl.select($(`legSel-${s.kind}`), {
      options: SEMANTIC_TIERS.map(([label]) => ({ label })),

        syncAll();
        commit(`已更新「${s.name}」强度`, before);
      },
    });
  });
}
// 锚点用 mode-card（03「默认行为」同一套单选卡），而不是分段控件：
// 每一档要带自己的可达性徽标和一句说明，分段控件塞不下，
// 而且分段控件只有选中后才能看到那一档的状态——「待系统能力」必须**选之前**就看得见。
function buildAnchors() {
  $('anchorGroup').innerHTML = ANCHORS.map((a) => `
    <button data-anchor="${a.id}" role="radio" aria-checked="false" class="mode-card w-full">
      <span class="mode-dot"></span>
      <span class="min-w-0 flex-1">
        <span class="flex items-center gap-1.5">
          <span class="block text-xs font-medium text-slate-900">${a.name}</span>
          <span data-reach="${a.id}"></span>
        </span>
        <span class="hint-sub">${a.desc}</span>
      </span>
    </button>`).join('');
  document.querySelectorAll('[data-anchor]').forEach((b) => b.addEventListener('click', () => {
    const before = { ...cfg };
    cfg.anchor = b.dataset.anchor;
    syncAll();
    commit(`已切到「${ANCHORS.find((a) => a.id === cfg.anchor).name}」锚点`, before);
  }));
}
function setEdge(edge) {
  // 单一漏斗上的守卫。入场边有两个入口（右栏 chip + 舞台四周按钮），
  // 而 `pointer-events-none` 只挡鼠标——按钮仍在 tab 序里，键盘用户 Enter 一下照旧改得动。
  // 光靠 CSS 禁用会留下一个「界面说不适用、键盘却能改」的洞，
  // 所以真值判断放在这里，将来新增入口也不会漏。视觉禁用与 disabled 属性在 syncAll 里。
  if (cfg.anchor === 'caret') return;
  const before = { ...cfg };
  cfg.originEdge = edge;
  syncAll(); commit('已更新入场边', before);
}
document.querySelectorAll('[data-edge]').forEach((b) => b.addEventListener('click', () => setEdge(b.dataset.edge)));
document.querySelectorAll('[data-spread]').forEach((b) => b.addEventListener('click', () => {
  const before = { ...cfg }; cfg.originMapping = b.dataset.spread; syncAll(); commit('已更新水平分布', before);
}));
document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
  const before = { ...cfg }; cfg.keyDisplayMode = b.dataset.mode; syncAll(); commit('已更新显示模式', before);
}));
document.querySelectorAll('[data-wall]').forEach((b) => b.addEventListener('click', () => { cfg._wall = b.dataset.wall; syncAll(); }));
document.querySelectorAll('[data-flag]').forEach((b) => b.addEventListener('click', () => {
  const before = { ...cfg };
  const key = { modifiers: 'showModifierKeys', uppercase: 'uppercase' }[b.dataset.flag];

}));
$('comboToggle').addEventListener('click', () => {

document.querySelectorAll('[data-mod]').forEach((b) => b.addEventListener('click', () => {

$('glowToggle').addEventListener('click', () => { const before = { ...cfg }; cfg.glow = !cfg.glow; syncAll(); commit('已更新发光', before); $('glowToggle').setAttribute('aria-checked', String(cfg.glow)); });
//
// **这个开关原先会把整份配置清空。** 它调的是 `onProtoState(cfg.enabled ? 'bounce' : 'off')`，
// 而 onProtoState 的 'bounce' 分支第一行就是 `cfg = { ...DEFAULTS, _wall: 'light' }`。
// 实测：选「中央闪现」+ 紫色 + 深色桌面（76px / #F43F5E / dark）→ 点关 → 点开
// → 全部变回 键帽弹跳 / 48px / #F59E0B / 浅色桌面，且没有任何提示。
//
// ⌘Z 能救回来（before 快照是对的），但**用户没有理由知道自己需要撤销**——
// 一个写着「启用动效」的开关不该是破坏性操作。这是全页最贵的一个缺陷：
// 它伤的是用户已经投进去的工作，而不只是一次误操作。
//
// 现在开关只翻 enabled 这一个字段，其余一律不碰。
// 原型态切换仍然走 onProtoState（那是走查用的「换一份配置」，语义本就不同）。
$('enableToggle').addEventListener('click', () => {

/*
  预览折叠。收起后要顺手把「屏幕预览」自己的说明改掉——展开时那句讲的是

  留着原句就是又一处描述不存在东西的文案（本轮已经修过两处同类）。

  展开时必须重算几何：折叠期间 #screen 的 clientWidth 是 0，

$('advToggle').addEventListener('click', () => {

/*
  常驻界面只保留四个决策层。原有能力没有删除，而是按任务重新归组：
  锚点+位置、内容+语义、上色+字形+节奏+精调。这样低频能力仍然可达，
  但不会用七张同权卡片挤占首屏。
*/
function compactKeyboardLayout() {
  const aside = $('appearanceCard').parentElement;
  let cursor = $('appearanceCard');
  const groups = [
    { key: 'placement', title: '出现位置', desc: '锚点、入场方向与停留位置', cards: ['anchorCard', 'positionDetailCard'] },
    { key: 'meaning', title: '内容与语义', desc: '显示什么，以及不同按键如何区分', cards: ['contentCard', 'semanticCard'] },
    { key: 'advanced', title: '高级动效', desc: '字形、上色、节奏与动画细节', cards: ['paintCard', 'glyphCard', 'comboCard', 'precisionCard'] },
  ];
  groups.forEach((group, index) => {
    const section = document.createElement('section');
    section.className = 'overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm';
    section.style.order = String(index + 3);
    section.innerHTML = `
      <button data-sec-toggle="${group.key}" class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left transition-colors hover:bg-slate-50" aria-expanded="false">
        <span class="min-w-0"><span class="block text-sm font-medium text-slate-900">${group.title}</span><span class="mt-0.5 block text-xs text-slate-500">${group.desc}</span></span>
        <span class="flex shrink-0 items-center gap-2"><span data-sec-sum="${group.key}" class="text-xs text-slate-500"></span><svg data-sec-chevron="${group.key}" class="size-4 shrink-0 text-slate-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>
      </button>
      <div data-sec-body="${group.key}" class="compact-group hidden grid gap-1.5 border-t border-slate-100 bg-slate-50/70 p-2"></div>`;
    cursor.insertAdjacentElement('afterend', section);
    const body = section.querySelector(`[data-sec-body="${group.key}"]`);
    group.cards.forEach((id) => {
      const card = $(id);
      card.style.order = 'initial';
      body.appendChild(card);
    });
    cursor = section;
  });
}
compactKeyboardLayout();

/**
 * 锚点 / 位置 / 显示内容 三个区块的折叠。
 *
 * **折叠态必须留摘要**——这是 README 为 01 的时间轴抽屉定下的规矩
 * （「折叠后标题行保留 N 条轨道 · N 条已链接 · 播放头 xxx ms，否则收起来就失去上下文」）。
 * 这里同理：收起「位置」却不告诉当前入场边是哪条，用户就得展开才能确认，
 * 折叠反而变成负担。摘要读的是真实状态，不是写死的文案。
 */
const SEC_SUMMARY = {
  // 字段名照真实 cfg：anchor / originEdge / originMapping / uppercase / modifiers。
  // 猜字段名会让摘要静默变成空字符串——看起来像「折叠态没写摘要」，其实是读错了 key。
  // 可达性要带进摘要：锚点说明现在跟着 body 一起收起了（原先它挂在折叠区外面，
  // 让这张卡收起时仍有 134px、比同类高一倍）。收起后仍必须能看出这一档此刻能不能用，
  // 否则「前台窗口」在无权限下会安静地什么都不做。
  anchor: () => {
    const a = ANCHORS.find((x) => x.id === cfg.anchor) || {};
    const reach = reachOf(a.id ? a : ANCHORS[0]);
    return (a.name || cfg.anchor) + (reach === 'perm' ? ' · 需权限' : reach === 'cap' ? ' · 待能力' : '');
  },
  pos: () => {
    // 光标锚点下没有「入场边」这个概念（effectiveEdge 会忽略它），摘要不能照抄一个不生效的值
    if (cfg.anchor === 'caret') return '跟随光标';
    // 摘要要短到不换行：2xs 提到 11px 之后「下方入场 · 按键位散开」在 300px 右栏里
    // 折成两行，把这张折叠卡顶到 80px，而同列另外四张都是 64px。
    // 折叠卡的价值就在于高度一致、扫一眼能读完，摘要写长了就自己抵消掉了。
    const edge = { top: '上', bottom: '下', left: '左', right: '右' }[effectiveEdge(cfg)] || effectiveEdge(cfg);
    const spread = { keyboardLayout: '键位', center: '固定', typewriter: '打字机' }[cfg.originMapping] || '固定';
    return `${edge}方 · ${spread}`;
  },
  // `cfg.modifiers` 是个**不存在的字段**（真实字段叫 showModifierKeys），
  // 于是这条摘要恒为「仅字符」——开着「显示单独修饰键」也照样这么写。
  // 正是上面那句注释警告的失效方式，而它就发生在同一张表里：
  // 读错 key 不会报错，只会安静地一直给同一个答案。
  content: () => [cfg.uppercase ? '大写' : '原样', cfg.showModifierKeys ? '含修饰键' : '仅字符'].join(' · '),
  // 收起时要能看出「它到底在不在跑」，所以开关态和强度都进摘要。
  combo: () => (cfg.typingCombo ? `开 · ${cfg.comboGain}%` : '已关闭'),
  // 发光和拖尾进摘要：它们是这一节里会明显改变画面的开关，收起时不该看不出开没开。
  glyph: () => [cfg.fontWeight, cfg.glow ? '发光' : null, cfg.trail ? `拖尾 ${cfg.trailLength}` : null].filter(Boolean).join(' · '),
  // 上色摘要要能一眼看出「颜色会不会变」。单色且无渐变时说「单色」，
  // 否则列出正在生效的两件事。
  paint: () => {
    const name = (HUE_DRIVERS.find(([id]) => id === (cfg.colorMode || 'solid')) || HUE_DRIVERS[0])[1];
    return [name, cfg.gradient ? '渐变' : null].filter(Boolean).join(' · ');
  },
  placement: () => {
    const a = ANCHORS.find((x) => x.id === cfg.anchor) || ANCHORS[0];
    const edge = { top: '上方', bottom: '下方', left: '左侧', right: '右侧' }[effectiveEdge(cfg)] || '';
    return `${a.name} · ${edge}`;
  },
  meaning: () => cfg.semanticStyles ? '已开启 · 4 类' : '已关闭',
  advanced: () => cfg.typingCombo ? '节奏调制已开启' : '使用基础效果',
};
function syncSecSummaries() {
  Object.entries(SEC_SUMMARY).forEach(([k, fn]) => {
    const el = document.querySelector(`[data-sec-sum="${k}"]`);
    const body = document.querySelector(`[data-sec-body="${k}"]`);
    if (!el || !body) return;
    // 展开时不显示摘要：内容就在下面，重复即噪音
    el.textContent = body.classList.contains('hidden') ? (fn() || '') : '';
  });
}
document.querySelectorAll('[data-sec-toggle]').forEach((btn) => btn.addEventListener('click', () => {
  const k = btn.dataset.secToggle;
  const open = document.querySelector(`[data-sec-body="${k}"]`).classList.toggle('hidden') === false;
  document.querySelector(`[data-sec-chevron="${k}"]`).classList.toggle('rotate-180', open);
  btn.setAttribute('aria-expanded', String(open));
  syncSecSummaries();
}));

// 滑块与下拉统一走共享控件实现（Ctl），不再各页手写原生控件

const WEIGHTS = ['标准', '中等', '半粗', '加粗'];
/* 字体与缓动的选项都来自 controls.js，本页不再自带拷贝。
   过冲百分比也不再手写：这里原先写「弹性 · 过冲 1.8%」，
   而按 [.22,1,.36,1.18] 实算峰值是 1.062（6.2%）——手写的数字漂了。 */
const SEL = {};

  options: Ctl.easingOptions(),
  value: cfg.easing,
  onChange: (v) => { cfg.easing = v; syncAll(); },
});
// 消散方式：每档带一句说明。四个词（淡出/缩小/上浮/模糊）单看也大致猜得到，
// 但「上浮」和「适合搭配底部入场」这种搭配关系猜不到，得写出来。
SEL.exit = Ctl.select($('exitSel'), {

// ── 反馈 + 撤销
//
// 这里原先有一套**页内 toast**，签名是 `toast(text, before)`，撤销只是 toast 上那颗按钮。
// 它同名覆盖了 shell.js 的全局 `toast(text, undo)`，后果是这一页：
//   · 工具栏「撤销 / 重做」永远是禁用态（改了 3 次仍写「没有可撤销的改动」）
//   · ⌘Z 完全没反应
//   · 「已保存」指示器从不闪「保存中」（页内 toast 不调 shell 的 touch()）
// 也就是决策 #1「自动保存 + 撤销，全站统一，⌘Z 有历史栈」在这一页整条失效——
// 而自动保存把「保存 / 丢弃」这个后悔手段拿掉了，撤销栈是它唯一的替代品。
//
// 这正是 README 教训 #0 的又一次复发：**迁到共享外壳后页面残留自有实现**。
// 当时扫了 02 和 03，漏了 04。07 / 08 / 09 也有本地 toast，但那三页刻意不加载 shell.js，
// 属于正确情形。全稿扫过：04 是唯一一个装了外壳还留着本地 toast 的工作区页。
//
// 现在改为委托给外壳。外壳要的是 undo **函数**且约定「撤销函数返回重做函数，两者成对」，
// 而本页所有改动都是整份 cfg 快照，所以用 snap() 做适配。
function snap(before) {
  if (!before) return undefined;
  return () => {
    const redoTo = { ...cfg };
    cfg = { ...before };
    syncAll();
    return () => { cfg = { ...redoTo }; syncAll(); };
  };
}
/** 提交一次改动：走外壳的 toast + 历史栈 + 自动保存指示器。 */
function commit(text, before) {
  toast(text, snap(before));
}

// ── 同步 UI
function syncAll() {
  // 开关相关的外观也从这里走，而不是只在翻开关时同步。
  // 原先它挂在 onProtoState 里，于是「恢复默认」这条路径（cfg = {...DEFAULTS}，
  // enabled 被带回 true）改了值却不刷外观：在关闭态点「恢复默认」，
  // enabled 已经是 true 了，蒙层却还盖着、页头描述还写着「动效已关闭」。
  syncEnabledChrome();
  syncSecSummaries();   // 折叠态摘要读的是 cfg，配置一变它就得跟着变
  const rain = cfg.animationStyle === 'raindrop';
  const vertical = cfg.originEdge === 'bottom' || cfg.originEdge === 'top';

  document.querySelectorAll('[data-preset]').forEach((b) => {
    const p = PRESETS.find((x) => x.id === b.dataset.preset);
    const on = Object.entries(p.patch).every(([k, v]) => cfg[k] === v);
    b.classList.toggle('preset-tile-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  document.querySelectorAll('[data-color]').forEach((b) => {
    const on = b.dataset.color === cfg.color;
    b.classList.toggle('color-swatch-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  $('colorReadout').textContent = cfg.color;
  // 当前色不在 7 个色板里时，「自定义」格显示成选中并直接涂上那个颜色——
  // 否则用自定义色之后整行看不出任何选中态，像是没生效。
  const custom = !COLORS.includes(cfg.color);
  const cs = $('customSwatch');
  cs.classList.toggle('color-swatch-on', custom);
  cs.setAttribute('aria-checked', String(custom));
  cs.style.backgroundImage = custom ? 'none' : cs.style.backgroundImage;
  if (custom) cs.style.background = cfg.color;
  else {
    cs.style.background = '';
    cs.style.backgroundImage = 'linear-gradient(45deg,#e2e8f0 25%,transparent 25%,transparent 75%,#e2e8f0 75%),linear-gradient(45deg,#e2e8f0 25%,transparent 25%,transparent 75%,#e2e8f0 75%)';
    cs.style.backgroundSize = '8px 8px';
    cs.style.backgroundPosition = '0 0,4px 4px';
  }
  // hex 输入行：选了自定义色时也保持展开，方便继续微调
  const hexOpen = Boolean(cfg._hexOpen) || custom;
  $('hexRow').classList.toggle('hidden', !hexOpen);
  $('hexRow').classList.toggle('flex', hexOpen);
  if (hexOpen && document.activeElement !== $('hexInput')) $('hexInput').value = cfg.color.replace('#', '');
  if (hexOpen) $('hexPreview').style.background = cfg.color;
  if (!hexOpen) $('hexError').classList.add('hidden');

  // ── 上色
  const mode = cfg.colorMode || 'solid';
  document.querySelectorAll('[data-hue]').forEach((b) => {
    const on = b.dataset.hue === mode;
    b.classList.toggle('mode-card-on', on);
    b.setAttribute('aria-checked', String(on));
    b.querySelector('.mode-dot').classList.toggle('mode-dot-on', on);
  });
  const driver = HUE_DRIVERS.find(([id]) => id === mode) || HUE_DRIVERS[0];
  // 灰阶推不动色相——这是色彩空间的事实，不是缺陷，但必须当场说出来：
  // 选了白色再去调「按键位」会一点变化都没有，而用户只会以为功能坏了。
  // 这与本页既有的「三项都关掉了」「不透明度已经是 100%」是同一类提示。
  const flatReason = hueShiftReason(cfg.color);
  $('hueDriverNote').textContent = mode === 'solid' || !flatReason
    ? driver[2]
    : `当前基准色 ${cfg.color} ${flatReason}——这一档不会有任何变化。换一个中等亮度的彩色才看得出来。`;
  $('hueDriverNote').className = 'mt-1.5 text-2xs leading-relaxed '
    + (mode !== 'solid' && flatReason ? 'text-amber-700' : 'text-slate-500');
  $('hueSpreadField').classList.toggle('hidden', mode === 'solid');
  // 色带：把「跨度」这个抽象的度数画出来。左右两端就是这一档能取到的极值色。
  if (mode !== 'solid') {
    const stops = [0, 0.25, 0.5, 0.75, 1]
      .map((t) => shiftHue(cfg.color, (t - (mode === 'byRhythm' ? 0 : 0.5)) * cfg.hueSpread));
    $('hueRamp').style.background = `linear-gradient(90deg, ${stops.join(', ')})`;
  }
  $('gradientKnob').className = 'switch-knob' + (cfg.gradient ? ' switch-on' : '');
  $('gradientToggle').setAttribute('aria-checked', String(cfg.gradient));
  $('gradientFields').classList.toggle('hidden', !cfg.gradient);
  $('gradientToReadout').textContent = cfg.gradientTo;
  document.querySelectorAll('[data-gradto]').forEach((b) => b.classList.toggle('color-swatch-on', b.dataset.gradto === cfg.gradientTo));

  // ── 拖尾
  $('trailKnob').className = 'switch-knob' + (cfg.trail ? ' switch-on' : '');
  $('trailToggle').setAttribute('aria-checked', String(cfg.trail));
  $('trailFields').classList.toggle('hidden', !cfg.trail);
  document.querySelectorAll('[data-edge2]').forEach((b) => {
    const on = b.dataset.edge2 === cfg.originEdge;
    b.classList.toggle('edge-chip-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  document.querySelectorAll('[data-edge]').forEach((b) => {
    const on = b.dataset.edge === cfg.originEdge;
    b.classList.toggle('edge-btn-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  document.querySelectorAll('[data-spread]').forEach((b) => {
    const on = b.dataset.spread === cfg.originMapping;
    b.classList.toggle('seg-item-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  document.querySelectorAll('[data-mode]').forEach((b) => {
    const on = b.dataset.mode === cfg.keyDisplayMode;
    b.classList.toggle('seg-item-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  document.querySelectorAll('[data-wall]').forEach((b) => {
    const on = (cfg._wall || 'light') === b.dataset.wall;
    b.classList.toggle('seg-item-on', on);
    b.setAttribute('aria-checked', String(on));
  });

  // ── 锚点：三档的联动
  const caret = cfg.anchor === 'caret';
  const anchorMeta = ANCHORS.find((a) => a.id === cfg.anchor) || ANCHORS[0];
  document.querySelectorAll('[data-anchor]').forEach((b) => {
    const on = b.dataset.anchor === cfg.anchor;
    b.classList.toggle('mode-card-on', on);
    b.setAttribute('aria-checked', String(on));
    b.querySelector('.mode-dot').classList.toggle('mode-dot-on', on);
    // 徽标每次同步都重算：可达性依赖权限态，不能在 buildAnchors 里定死
    const meta = ANCHORS.find((a) => a.id === b.dataset.anchor);
    b.querySelector(`[data-reach="${b.dataset.anchor}"]`).innerHTML = REACH_BADGE[reachOf(meta)];
  });
  $('anchorNote').textContent = reachOf(anchorMeta) === 'perm'
    ? '这一档需要辅助功能权限才能取到窗口／插入点位置。授权前会回落到屏幕锚点。'
    : anchorMeta.note;
  // 「快捷键覆盖锚点」这条规则由 semanticDesc() 一并生成（见下面图例那段），
  // 不再在这里维护第二份文案——原先这里抄了一遍「放大 18%」，是第四份真值。
  // 前台窗口框只在 window / caret 两档点亮；插入点那一行只在 caret 档出现。
  // caret 档也显示窗口框，是因为插入点必然在某个窗口里——只画一根竖线会让人
  // 看不出它属于谁，而「属于哪个窗口」正是这一档要表达的内容关系。
  $('fgWin').classList.toggle('hidden', cfg.anchor === 'screen');
  $('caretRow').classList.toggle('hidden', !caret);
  $('caretRow').classList.toggle('flex', caret);
  // 原先插入点档下把这句提示减淡到 opacity-50 —— 那是在给一句**内容已经错了**的
  // 文案打补丁（它仍写着点四条边、拖圆点，而两者都已不可用）。
  // 现在文案由 syncStageHint 按实际可用控件生成，就不需要也不应该再减淡。

  // 入场边：插入点是一个点，没有边可选，如实禁用而不是留一个点了没反应的控件。
  //
  // 入场边有**两个**入口：右栏这一组 chip，和舞台四周那四个 edge-btn。
  // 只禁用右栏的话，舞台上那四个照旧能点、还真能改 originEdge，
  // 于是出现「控件是灰的但结果跟着另一个入口变」——比不禁用更难查。
  // 同一个值的所有入口必须一起禁用。
  $('edgeField').classList.toggle('opacity-50', caret);
  $('edgeField').classList.toggle('pointer-events-none', caret);
  $('edgeNote').textContent = caret ? '插入点锚点下不适用' : '';
  // disabled 而不是只靠 pointer-events：前者会同时把按钮移出 tab 序，
  // 后者只挡鼠标。两个入口都要设。
  document.querySelectorAll('[data-edge]').forEach((b) => {
    b.classList.toggle('opacity-50', caret);
    b.disabled = caret;
  });
  document.querySelectorAll('[data-edge2]').forEach((b) => { b.disabled = caret; });

  // 键位散开只在上／下入场时生效——运行时对左／右入场忽略键位映射，这里如实禁用。
  // 插入点锚点下横向由插入点决定，键位映射同样是空操作。
  const spreadOk = vertical && !caret;
  $('spreadSeg').classList.toggle('opacity-50', !spreadOk);
  $('spreadSeg').classList.toggle('pointer-events-none', !spreadOk);
  // 同上：分段控件的两个按钮也要真 disabled，不能只靠父级 pointer-events
  document.querySelectorAll('[data-spread]').forEach((b) => { b.disabled = !spreadOk; });
  $('spreadNote').textContent = caret ? '由插入点决定' : (spreadOk ? '' : '仅上／下入场可用');
  // 三档各有自己的说明。原先这里只写死了键位那一档的解释，
  // 加了「打字机」之后不分档就会出现「选了打字机、说明讲的是键位」——
  // 本轮修过好几处同类（提示描述的是另一个状态下的行为）。
  const SPREAD_HINT = {
    keyboardLayout: '按 QWERTY 键位把字符横向铺开：按 Q 出现在左边，按 P 出现在右边。',
    center: '所有字符落在同一个横向位置，由「停留距离」和拖动圆点决定。',
    typewriter: '字符接着上一个往右排，像在屏幕上打字。停手 1.2 秒或排到右边界后回到行首。',
  };
  $('spreadHint').textContent = caret
    ? '字符的横向位置就是插入点所在的位置，这一组不生效。'
    : (spreadOk
      ? (SPREAD_HINT[cfg.originMapping] || SPREAD_HINT.keyboardLayout)
      : '左／右入场时字符固定在垂直中线附近，这一组不生效。');

  // 「离锚点多远」在三档下是同一个数，但说法必须跟着锚点改。
  // 插入点 + 雨滴时它是**坠落距离**（零尺寸框没有可贯穿的高度，行程由这个数给出），
  // 所以这个组合下 restField 不能跟着 raindrop 一起藏起来，否则没有任何距离控件。
  $('restFieldLabel').textContent = caret ? (rain ? '坠落距离' : '离插入点距离') : '停留距离';
  $('restFieldHint').textContent = caret
    ? (rain
      ? '字符从插入点往下坠落多远后消失。'
      : '字符从插入点冒出后停在多远的位置，0 就是原地浮现。')
    : (cfg.anchor === 'window'
      ? '字符飞入后停在距窗口边多远的位置。'
      : '字符飞入后停在距入场边多远的位置。');

  // ── 调制
  // 开关从标题栏挪进折叠区，样式跟着换成 .switch-knob（与「作用于」三行、
  // 「显示内容」两行同一套），不再用标题栏那种 pill 旋钮。
  $('comboKnob').className = 'switch-knob' + (cfg.typingCombo ? ' switch-on' : '');
  $('comboToggle').setAttribute('aria-checked', String(cfg.typingCombo));
  $('comboBody').classList.toggle('hidden', !cfg.typingCombo);
  document.querySelectorAll('[data-mod]').forEach((b) => {
    const key = { scale: 'comboScale', opacity: 'comboOpacity', glow: 'comboGlow' }[b.dataset.mod];
    b.setAttribute('aria-checked', String(!!cfg[key]));
    b.querySelector('.switch-knob').classList.toggle('switch-on', !!cfg[key]);
  });
  // 三个目标全关 = 开关开着但什么都不会发生。这种「开了等于没开」的状态
  // 必须当场说出来，否则用户会以为是坏的（走查里同一类问题已经出现过：白名单下的「关闭」）。
  const noTarget = !cfg.comboScale && !cfg.comboOpacity && !cfg.comboGlow;
  // 不透明度这一档会**在高基准下静默失效**：算式是 min(100, opacity + 2×级)，
  // 基准已经是 100 时怎么加都还是 100，开关却照旧亮着。
  // 默认 90 也只能爬到 100（五级共 +10），是三个通道里最弱的一个——
  // 相比之下字号是 48 → 56.4px（+17.5%）、发光从 3 级起点亮（半径 12→16），都看得很清。
  // 这类「开了但算式吃不动」的状态必须当场说出来，否则用户会以为是坏的。
  const opacityDead = cfg.comboOpacity && cfg.opacity >= 100;
  const opacityWeak = cfg.comboOpacity && cfg.opacity >= 96;
  $('modTargetNote').textContent = noTarget
    ? '三项都关掉了——调制开着但不会有任何变化。'
    : cfg.comboGain === 0 ? '强度为 0——目标已选，但当前没有加成。'
    : opacityDead ? '不透明度已经是 100%，这一档加不上去——想看出层次可以调低基准，或改用字号／发光。'
    : opacityWeak ? `不透明度基准 ${cfg.opacity}%，最多只能加到 100%，变化会很轻微。`
    : '';

  $('restField').classList.toggle('hidden', rain && !caret);
  $('rainFields').classList.toggle('hidden', !rain);
  $('gravityReadout').textContent = cfg.gravity.toFixed(1);
  $('windReadout').textContent = cfg.wind.toFixed(1);
  SL.gravityRange?.set(Math.round(cfg.gravity * 10));
  SL.windRange?.set(Math.round(cfg.wind * 10));

  const put = (id, out, v) => { SL[id]?.set(v); if (out) $(out).textContent = v; };
  put('sizeRange', 'sizeReadout', Math.round(cfg.fontSize));
  put('opacityRange', 'opacityReadout', cfg.opacity);
  put('bounceRange', 'bounceReadout', cfg.bounceHeight);
  put('durRange', 'durReadout', cfg.duration);
  put('coolRange', 'coolReadout', cfg.cooldownMs);
  put('maxRange', 'maxReadout', cfg.maxSimultaneous);
  put('glowRange', 'glowReadout', cfg.glowRadius);
  put('gainRange', 'gainReadout', cfg.comboGain);
  SEL.weight?.set(cfg.fontWeight); SEL.family?.set(cfg.fontFamily); SEL.easing?.set(cfg.easing);
  const exitSpec = EXITS.find(([id]) => id === cfg.exitStyle) || EXITS[0];
  SEL.exit?.set(exitSpec[1]);
  // 「上浮」在顶部入场（雨滴）下是逆着运动方向的，会看起来像卡了一下——
  // 这类「选项本身没坏、但和另一处配置打架」的组合必须当场说，不能让人自己撞。
  $('exitNote').textContent = (cfg.exitStyle === 'rise' && effectiveEdge(cfg) === 'top')
    ? '当前是顶部入场，「上浮」会和下落方向相反，末尾看起来像顿了一下。'
    : exitSpec[2];
  $('exitNote').className = 'text-2xs leading-relaxed '
    + ((cfg.exitStyle === 'rise' && effectiveEdge(cfg) === 'top') ? 'text-amber-700' : 'text-slate-500');

  $('glowFields').classList.toggle('hidden', !cfg.glow);
  knob($('glowKnob'), cfg.glow);
  knob($('semanticKnob'), cfg.semanticStyles);
  knob($('enableKnob'), cfg.enabled);
  $('semanticToggle').lastElementChild.textContent = cfg.semanticStyles ? '已开启' : '已关闭';
  document.querySelectorAll('[data-flag]').forEach((b) => {
    const key = { modifiers: 'showModifierKeys', uppercase: 'uppercase' }[b.dataset.flag];
    b.setAttribute('aria-checked', String(!!cfg[key]));
    b.querySelector('.switch-knob').classList.toggle('switch-on', !!cfg[key]);
  });
  $('modeHint').innerHTML = cfg.keyDisplayMode === 'typed'
    ? '⇧+1 显示为 <span class="font-medium text-slate-600">!</span>，和你实际打出的字一致。'
    : '⇧+1 显示为 <span class="font-medium text-slate-600">1</span>，保留物理键名，适合演示快捷键。';

  // 语义分层：样张大小、不透明度、说明文案、强度档全部从 SEMANTIC 表算，
  // 不再各留一份常量（原先 rel 表和写死的 .62 就是两份，而 .62 已经与 derive 的 .65 漂开了）。
  document.querySelectorAll('.legend-row').forEach((row) => {
    const k = row.dataset.kind;
    const sample = row.querySelector('.legend-sample');
    const fx = semanticFactors(k, cfg);
    const on = cfg.semanticStyles;
    sample.style.fontSize = (13 * (on ? fx.size : 1)) + 'px';
    sample.style.color = cfg.color;
    // 样张不透明度用与 derive 同一条算式，基准取当前的整体不透明度
    const opa = on && fx.opa
      ? (fx.opa.op === 'add'
        ? Math.min(100, cfg.opacity + fx.opa.v)
        : Math.max(fx.opa.min, Math.round(cfg.opacity * fx.opa.v))) / 100
      : 1;
    sample.style.opacity = String(Math.min(1, opa));
    const desc = on ? semanticDesc(k, cfg) : '语义分层已关闭，四类按键一视同仁';
    const descEl = row.querySelector('[data-desc]');
    descEl.textContent = desc;
    // 说明现在是单行 truncate，窄列下会被省略——补 title，鼠标停上去能看全。
    // 这几个数字是这一节唯一的量化信息，不能因为压行高就变得读不到。
    descEl.title = desc;
    row.classList.toggle('opacity-60', !on);
    if (LEG[k]) {
      LEG[k].set((SEMANTIC_TIERS.find(([, v]) => v === cfg[fx.spec.key]) || SEMANTIC_TIERS[2])[0]);
      $(`legSel-${k}`).classList.toggle('pointer-events-none', !on);
      $(`legSel-${k}`).querySelector('[data-trigger]').disabled = !on;
    }
  });

  // 桌面底图：几何来自 WALL 的 style，深浅只换配色 token。
  // #fgWin 套同一份 style，两者不可能再错开。
  const dark = (cfg._wall || 'light') === 'dark';
  $('screen').classList.toggle('bg-slate-100', !dark);
  $('screen').classList.toggle('bg-slate-800', dark);
  $('wallpaper').innerHTML = WALL
    .map((w) => `<div class="absolute overflow-hidden ${dark ? w.dark : w.light}" style="${w.style}">`
      + (w.bar ? `<div class="absolute inset-x-0 top-0 h-3 border-b ${dark ? WALL_BAR.dark : WALL_BAR.light}"></div>` : '')
      + '</div>')
    .join('');
  $('fgWin').setAttribute('style', FG_WIN_STYLE);

  // 实测缩放比，替掉原先写死的「50%」
  $('previewScale').textContent = Math.round(($('screen').clientWidth / SCREEN_REF_W) * 100);

  syncCount(); syncHandle(); syncTypeLine(); syncStageHint();
  // 「当前档位」要跟着开关和目标变化立刻更新，不能等下一次按键——
  // 关掉调制后那行还写着「4 级 · 字号 +14%」就是在说谎。
  syncCombo(Math.min(Math.max(0, combo.count - 1), 5));
}
/*
  旋钮的外观**只有一处定义**：`_src.css` 的 `.switch-knob` / `.switch-on`（含 ::after 那个小白点）。
  原先这里把那串类连小白点的位移一起手抄了一遍，于是深色令牌层的 dark: 变体
  在这个开关上完全不生效——而它是全页最显眼的那个开关。
*/
function knob(el, on) {
  el.classList.toggle('switch-on', on);
  const host = el.closest('button');
  if (host) host.setAttribute('aria-checked', String(on));
}

/**
 * 只跟 enabled 有关的那部分外观。
 *
 * 从 onProtoState 里拆出来，是为了让「翻开关」和「换一份配置」变成两件事——
 * 它们混在一个函数里，正是主开关会清空配置的直接原因。
 *
 * 关闭态原先是 `mainGrid` 加 `opacity-60`，而 `pointer-events` 仍是 `auto`：
 * 实测在关闭状态下点色板，配置真的改了，但预览盖着全屏的「动效已关闭」蒙层，
 * 你在调一个完全看不到反馈的东西；而本来就只有 2.36:1 的说明文字再乘 0.6，
 * 等于彻底不可读。**减淡在这里传达的是「已禁用」，而它并没有被禁用——
 * 这个不一致比两种做法中的任何一种都糟。**
 *
 * 取的是「不禁用、也不减淡」：关掉动效只意味着桌面上不出效果，
 * 配置面板照常可用（先调好再开是正常用法）。这一点由蒙层文案说清，
 * 不靠视觉上的半死不活去暗示。
 */
function syncEnabledChrome() {
  const compactOff = !cfg.enabled && !editWhileOff;
  $('offBadge').classList.toggle('hidden', cfg.enabled);
  $('offBadge').classList.toggle('grid', !cfg.enabled);
  $('typeHint').classList.toggle('hidden', !cfg.enabled);
  $('offSummary').classList.toggle('hidden', !compactOff);
  $('mainGrid').classList.toggle('hidden', compactOff);
  $('enableToggle').setAttribute('aria-checked', String(cfg.enabled));
}

// ── 原型状态
function onProtoState(s) {
  editWhileOff = false;
  if (s === 'bounce') cfg = { ...DEFAULTS, _wall: 'light' };
  if (s === 'rain') cfg = { ...DEFAULTS, ...PRESETS[1].patch, _wall: 'dark' };
  if (s === 'off') cfg = { ...cfg, enabled: false };
  // 缺权限态刻意**选中「前台窗口」锚点**：这一档在无权限下取不到窗口，
  // 正好演示徽标从「现在生效」转成「需要权限」。原先四个原型态没有一个会选到
  // 屏幕以外的锚点，于是走查者点完四个态永远看不到这两档，
  // 也看不到回落说明——和 README 记过的「03 的『此刻命中』徽标从没被演示过」是同一类漏洞。
  if (s === 'denied') cfg = { ...DEFAULTS, _wall: cfg._wall || 'light', enabled: true, authorized: false, anchor: 'window' };
  syncEnabledChrome();
  syncAll();
}

$('presetMoreToggle').addEventListener('click', () => {
  const grid = $('presetMoreGrid');
  const open = grid.classList.toggle('hidden') === false;
  grid.classList.toggle('grid', open);
  $('presetMoreChevron').classList.toggle('rotate-180', open);
  $('presetMoreToggle').setAttribute('aria-expanded', String(open));
  $('presetMoreText').innerHTML = open ? '收起' : `更多预设（<span id="presetMoreCount">${PRESETS.filter((p) => p.more).length}</span>）`;
  // 展开时补一次缩略图动画：这四张卡刚从 display:none 出来，
  // animatePresetTiles 在 buildPresets 里跑那次它们还没有布局。
  if (open) animatePresetTiles();
});
$('gradientToggle').addEventListener('click', () => {
  const before = { ...cfg }; cfg.gradient = !cfg.gradient; syncAll(); commit('已更新渐变', before);
});
$('trailToggle').addEventListener('click', () => {
  const before = { ...cfg }; cfg.trail = !cfg.trail; syncAll(); commit('已更新拖尾', before);
});

buildPresets(); buildColors(); buildEdges(); buildAnchors(); buildLegend();
buildHueDrivers(); bindHexInput();
/*
  首屏必须自己同步一次，**不能依赖外壳那个 setTimeout**。

  shell.js 的 mountShell 末尾是 `setTimeout(() => setProto(...), 0)`，
  而 setProto → onProtoState → syncAll 才是第一次把 cfg 画到 DOM 上。
  在这之前，页面处于「模板刚克隆出来」的状态。

  以前这不明显，因为 #wallpaper 的四个 div 是写在模板里的静态标记；
  改成由 WALL 表生成之后，桌面底图、手柄位置、缩放读数在那一个宏任务里全是空的。
  实测抓到了：**后台标签页的定时器被节流到 ~1s**，于是首屏有整整一秒
  的空预览 + 手柄糊在左上角。前台标签页里它只闪一帧，人眼看不见——
  这正是最容易被漏掉、又一定会在别人机器上被看到的那类缺陷。

  这里补一次同步，让页面的初始状态只依赖自己的脚本跑完，不依赖外壳的调度时机。
*/
syncAll();

/*
  舞台上的圆点手柄、键位散开带、前台窗口框、缩放读数全都是**实测几何**
  （anchorBox / handlePos 都走 getBoundingClientRect，这是 README 定的规则：
  不写死常量，否则改布局就偏——时间轴播放头当年就是这么偏了 5px）。

  实测的代价是：**换了尺寸就必须重算**。shell.js 切窗口档时已经派发了
  `resize` 和 `viewportchange`，注释里也写明「凡是按实测几何定位的东西都必须重算」，
  但本页原先谁都没听。后果实测得到：从默认档切到大屏，圆点还停在旧像素位置，
  刚补的缩放读数也留着上一档的 37%（真实值 45%）。

  需要合并：拖动真实浏览器窗口时 resize 会连发几十次，而 syncAll 会重建
  底图、图例和三处 innerHTML，逐次跑没有必要。

  合并**不能用 requestAnimationFrame**。第一版写的是
  `if (geoRaf) return; geoRaf = requestAnimationFrame(...)`，实测直接坏掉：
  页面不在前台绘制时（document.visibilityState === 'hidden'，走查工具里的预览窗格
  正是这种状态）rAF 根本不回调，于是 geoRaf **永久латch 在 1**——
  第一次 resize 之后，这个函数余生都在第一行 return，几何再也不会重算。
  这比它要修的那个 bug 更糟：不报错、不留痕，只是安静地失效。

  改用 setTimeout：后台标签页里它只是被节流到 1s，不会不执行。
  syncAll 是幂等的，所以「取消上一个、只跑最后一个」是安全的合并方式。
*/
let geoTimer = 0;
function recomputeGeometry() {
  clearTimeout(geoTimer);
  geoTimer = setTimeout(syncAll, 0);
}
['resize', 'viewportchange'].forEach((ev) => window.addEventListener(ev, recomputeGeometry));
</script>
</body>
</html>
