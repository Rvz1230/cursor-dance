<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>应用规则 · UX 原型</title>
<link rel="stylesheet" href="../mockup.css" />
<style>
  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
</style>
</head>
<body class="bg-slate-200 p-6 text-slate-900">

<div id="proto"></div>
<div id="app"></div>

<template id="page">
      <div class="min-h-0 flex-1 overflow-y-auto px-3 py-3">
        <div class="mx-auto max-w-[920px]">

          <!-- 页头 -->
          <div class="mb-2.5 flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
            <div class="min-w-0">
              <h1 class="text-base font-semibold text-slate-900 text-balance">应用规则</h1>
              <p class="mt-1 max-w-2xl text-xs leading-relaxed text-slate-500 text-pretty">
                指定某些应用关闭效果，或在其中换用另一套主题。改动自动保存。
              </p>
            </div>
            <div class="relative shrink-0">
              <button id="addAppBtn" class="btn-default h-8 px-3 text-xs">
                <svg class="mr-1.5 size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                添加应用
                <svg class="ml-1.5 size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              </button>

              <!-- ════ 添加应用浮层 ════ -->
              <div id="picker" class="absolute right-0 top-10 z-50 hidden w-[440px] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg">
                <div class="border-b border-slate-100 p-3">
                  <div class="relative">
                    <svg class="pointer-events-none absolute left-2.5 top-1/2 size-3.5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input placeholder="搜索应用名称" class="h-9 w-full rounded-xl border border-slate-200 bg-white pl-8 pr-2 text-sm text-slate-700 shadow-sm placeholder:text-slate-400" />
                  </div>
                  <div class="mt-2.5 inline-flex items-center gap-1 rounded-xl border border-slate-200 bg-slate-50 p-1">
                    <button data-tab="recent" class="ptab h-7 rounded-lg px-2.5 text-2xs font-medium">最近使用</button>
                    <button data-tab="installed" class="ptab h-7 rounded-lg px-2.5 text-2xs font-medium">已安装</button>
                    <button data-tab="pick" class="ptab h-7 rounded-lg px-2.5 text-2xs font-medium">点选</button>
                  </div>
                </div>

                <!-- 最近使用 -->
                <div data-ptab="recent" class="max-h-[320px] overflow-y-auto p-1.5">
                  <p class="px-2 pb-1 pt-1.5 text-2xs text-slate-400">前台监听自动记录，已排除 CursorDance 自身</p>
                  <button class="pick-row"><span class="app-icon bg-slate-900">F</span><span class="pick-body"><span class="pick-name">Figma</span><span class="pick-meta">com.figma.Desktop · 刚刚</span></span><span class="pick-added">已添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-sky-600">T</span><span class="pick-body"><span class="pick-name">Terminal</span><span class="pick-meta">com.apple.Terminal · 2 分钟前</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-emerald-600">K</span><span class="pick-body"><span class="pick-name">Keynote</span><span class="pick-meta">com.apple.iWork.Keynote · 12 分钟前</span></span><span class="pick-added">已添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-amber-600">P</span><span class="pick-body"><span class="pick-name">Preview</span><span class="pick-meta">com.apple.Preview · 26 分钟前</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-rose-600">M</span><span class="pick-body"><span class="pick-name">Music</span><span class="pick-meta">com.apple.Music · 1 小时前</span></span><span class="pick-cta">添加</span></button>
                </div>

                <!-- 已安装 -->
                <div data-ptab="installed" class="hidden max-h-[320px] overflow-y-auto p-1.5">
                  <p class="px-2 pb-1 pt-1.5 text-2xs text-slate-400">扫描 /Applications、/System/Applications 与 ~/Applications</p>
                  <button class="pick-row"><span class="app-icon bg-slate-700">A</span><span class="pick-body"><span class="pick-name">Arc</span><span class="pick-meta">company.thebrowser.Browser</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-indigo-600">C</span><span class="pick-body"><span class="pick-name">Visual Studio Code</span><span class="pick-meta">com.microsoft.VSCode</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-slate-900">F</span><span class="pick-body"><span class="pick-name">Figma</span><span class="pick-meta">com.figma.Desktop</span></span><span class="pick-added">已添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-emerald-600">K</span><span class="pick-body"><span class="pick-name">Keynote</span><span class="pick-meta">com.apple.iWork.Keynote</span></span><span class="pick-added">已添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-teal-600">N</span><span class="pick-body"><span class="pick-name">Notion</span><span class="pick-meta">notion.id</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-sky-600">S</span><span class="pick-body"><span class="pick-name">Safari</span><span class="pick-meta">com.apple.Safari</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-violet-600">S</span><span class="pick-body"><span class="pick-name">Slack</span><span class="pick-meta">com.tinyspeck.slackmacgap</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-slate-600">T</span><span class="pick-body"><span class="pick-name">Terminal</span><span class="pick-meta">com.apple.Terminal</span></span><span class="pick-cta">添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-green-600">W</span><span class="pick-body"><span class="pick-name">微信</span><span class="pick-meta">com.tencent.xinWeChat</span></span><span class="pick-added">已添加</span></button>
                  <button class="pick-row"><span class="app-icon bg-blue-600">Z</span><span class="pick-body"><span class="pick-name">zoom.us</span><span class="pick-meta">us.zoom.xos</span></span><span class="pick-cta">添加</span></button>
                </div>

                <!-- 点选 -->
                <div data-ptab="pick" class="hidden p-4">
                  <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-3">
                    <div class="flex items-start gap-2.5">
                      <span class="mt-0.5 grid size-8 shrink-0 place-items-center rounded-xl bg-white text-slate-500 shadow-sm ring-1 ring-slate-200">
                        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="3"/></svg>
                      </span>
                      <div class="min-w-0">
                        <div class="text-xs font-medium text-slate-700">点选屏幕上的任意窗口</div>
                        <p class="mt-1 text-2xs leading-relaxed text-slate-500">
                          开始后工作台会退到后台。点击目标应用的窗口，它就会被自动填入——适合不在应用目录里的程序、辅助进程和游戏。
                        </p>
                      </div>
                    </div>
                    <button class="btn-default mt-3 h-8 w-full px-3 text-xs">开始点选</button>
                  </div>
                  <p class="mt-2.5 text-2xs leading-relaxed text-slate-400">按 Esc 可取消点选。</p>
                </div>

                <div class="flex items-center justify-between border-t border-slate-100 bg-slate-50 px-3 py-2">
                  <span class="text-2xs text-slate-400">按 bundle id 记录，改名或换语言都不会失配</span>
                  <button id="pickerClose" class="text-2xs font-medium text-slate-500 transition-colors hover:text-slate-900">关闭</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 缺少权限 -->
          <div data-show="denied" class="mb-2.5 flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
            <svg class="mt-0.5 size-4 shrink-0 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
            <div class="min-w-0">
              <div class="text-xs font-medium text-amber-900">需要辅助功能权限才能识别当前应用</div>
              <p class="mt-1 text-2xs leading-relaxed text-amber-800">
                授权后即可用「最近使用」和「点选」添加应用；在此之前只能手写匹配规则。
              </p>
              <button class="mt-2 inline-flex items-center gap-1 text-2xs font-medium text-amber-900 underline underline-offset-2 transition-colors hover:text-amber-700">
                打开系统设置 → 隐私与安全 → 辅助功能
                <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
              </button>
            </div>
          </div>

          <!-- ════ 默认行为 ════ -->
          <section class="mb-2.5 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="border-b border-slate-100 px-4 py-3">
              <h3 class="text-sm font-medium text-slate-900">默认行为</h3>
              <div class="mt-0.5 text-xs text-slate-500">没有单独设置的应用一律按这里处理</div>
            </div>
            <div class="grid gap-2 px-4 py-3 sm:grid-cols-2">
              <button data-mode="all" class="mode-card">
                <span class="mode-dot"></span>
                <span class="min-w-0">
                  <span class="block text-xs font-medium text-slate-900">在所有应用中启用</span>
                  <span class="mt-1 block text-2xs leading-relaxed text-slate-500">下方列出的应用按各自设置处理。适合大多数人。</span>
                </span>
              </button>
              <button data-mode="only" class="mode-card">
                <span class="mode-dot"></span>
                <span class="min-w-0">
                  <span class="block text-xs font-medium text-slate-900">仅在指定应用中启用</span>
                  <span class="mt-1 block text-2xs leading-relaxed text-slate-500">没列出的应用一律不生效。适合只想在少数几个应用里用。</span>
                </span>
              </button>
            </div>
          </section>

          <div id="whiteNote" class="mb-2.5 hidden flex items-start gap-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5">
            <svg class="mt-0.5 size-3.5 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
            <div class="min-w-0 flex-1">
              <p class="text-2xs leading-relaxed text-slate-600">
                白名单模式下未列出的应用本来就不生效，所以设成「关闭」的行是空配置。
              </p>
              <button id="pruneWhite" class="mt-1.5 text-2xs font-medium text-slate-900 underline underline-offset-2">移除这些空配置</button>
            </div>
          </div>

          <!-- ════ 例外应用 ════ -->
          <section class="mb-2.5 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-4 py-3">
              <div class="min-w-0">
                <h3 class="text-sm font-medium text-slate-900">例外应用 <span data-show="normal picker" class="tabular-nums text-slate-400">3</span></h3>
                <div class="mt-0.5 text-xs text-slate-500">一个应用一条记录，互不覆盖，没有优先级</div>
              </div>
              <button data-show="normal picker denied" class="btn-outline h-7 px-2.5 text-2xs">
                <svg class="mr-1 size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                添加
              </button>
            </div>

            <!-- 已有例外 -->
            <div data-show="normal picker denied" class="divide-y divide-slate-100">
              <div data-exrow class="flex items-center gap-3 px-4 py-2.5">
                <span class="app-icon bg-emerald-600">K</span>
                <div class="min-w-0 flex-1">
                  <div class="truncate text-sm font-medium text-slate-900">Keynote</div>
                  <div class="truncate text-2xs text-slate-400">com.apple.iWork.Keynote</div>
                </div>
                <div class="row-controls">
                  <div class="seg-group">
                    <button class="seg-item" data-act="enable">启用</button>
                    <button class="seg-item seg-item-on" data-act="disable">关闭</button>
                  </div>
                  <button class="theme-pick invisible">跟随全局<svg class="ml-1 size-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button>
                </div>
                <span data-invalid="Keynote" class="hidden shrink-0 rounded-full bg-slate-100 px-1.5 py-0.5 text-2xs font-medium text-slate-500" title="白名单模式下未列出的应用本来就不生效，「关闭」是空操作">白名单下无效</span>
                <button class="row-del" aria-label="移除 Keynote">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                </button>
              </div>

              <div data-exrow class="flex items-center gap-3 bg-slate-50 px-4 py-2.5">
                <span class="app-icon bg-slate-900">F</span>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2">
                    <span class="truncate text-sm font-medium text-slate-900">Figma</span>
                    <span data-show="normal picker" class="inline-flex shrink-0 items-center gap-1 rounded-full bg-white px-1.5 py-0.5 text-2xs font-medium text-slate-600 ring-1 ring-slate-200">
                      <span class="size-1.5 rounded-full bg-sky-500"></span> 正在前台
                    </span>
                  </div>
                  <div class="truncate text-2xs text-slate-400">com.figma.Desktop</div>
                </div>
                <div class="row-controls">
                  <div class="seg-group">
                    <button class="seg-item" data-act="enable">启用</button>
                    <button class="seg-item seg-item-on" data-act="disable">关闭</button>
                  </div>
                  <button class="theme-pick invisible">跟随全局<svg class="ml-1 size-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button>
                </div>
                <span data-invalid="Figma" class="hidden shrink-0 rounded-full bg-slate-100 px-1.5 py-0.5 text-2xs font-medium text-slate-500" title="白名单模式下未列出的应用本来就不生效，「关闭」是空操作">白名单下无效</span>
                <button class="row-del" aria-label="移除 Figma">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                </button>
              </div>

              <div data-exrow class="flex items-center gap-3 px-4 py-2.5">
                <span class="app-icon bg-green-600">W</span>
                <div class="min-w-0 flex-1">
                  <div class="truncate text-sm font-medium text-slate-900">微信</div>
                  <div class="truncate text-2xs text-slate-400">com.tencent.xinWeChat</div>
                </div>
                <div class="row-controls">
                  <div class="seg-group">
                    <button class="seg-item seg-item-on" data-act="enable">启用</button>
                    <button class="seg-item" data-act="disable">关闭</button>
                  </div>
                  <button class="theme-pick">夕霞<svg class="ml-1 size-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button>
                </div>
                <span data-invalid="微信" class="hidden shrink-0 rounded-full bg-slate-100 px-1.5 py-0.5 text-2xs font-medium text-slate-500" title="白名单模式下未列出的应用本来就不生效，「关闭」是空操作">白名单下无效</span>
                <button class="row-del" aria-label="移除 微信">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                </button>
              </div>
            </div>

            <!-- 首次进入：空状态直接是最近使用挑选器 -->
            <div data-show="first" class="px-4 py-3">
              <div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-3">
                <div class="flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-xs font-medium text-slate-700">从最近用过的应用里选一个</div>
                    <p class="mt-1 text-2xs leading-relaxed text-slate-500">不用输入任何东西。点一下就会加进例外列表，默认「关闭效果」。</p>
                  </div>
                  <button class="btn-outline h-7 shrink-0 px-2.5 text-2xs">查看全部应用</button>
                </div>
                <div class="mt-3 grid gap-1.5 sm:grid-cols-2">
                  <button class="first-pick"><span class="app-icon bg-slate-900">F</span><span class="min-w-0 flex-1 text-left"><span class="block truncate text-xs font-medium text-slate-800">Figma</span><span class="block truncate text-2xs text-slate-400">刚刚 · 正在前台</span></span><span class="first-add">+ 关闭效果</span></button>
                  <button class="first-pick"><span class="app-icon bg-sky-600">T</span><span class="min-w-0 flex-1 text-left"><span class="block truncate text-xs font-medium text-slate-800">Terminal</span><span class="block truncate text-2xs text-slate-400">2 分钟前</span></span><span class="first-add">+ 关闭效果</span></button>
                  <button class="first-pick"><span class="app-icon bg-emerald-600">K</span><span class="min-w-0 flex-1 text-left"><span class="block truncate text-xs font-medium text-slate-800">Keynote</span><span class="block truncate text-2xs text-slate-400">12 分钟前</span></span><span class="first-add">+ 关闭效果</span></button>
                  <button class="first-pick"><span class="app-icon bg-amber-600">P</span><span class="min-w-0 flex-1 text-left"><span class="block truncate text-xs font-medium text-slate-800">Preview</span><span class="block truncate text-2xs text-slate-400">26 分钟前</span></span><span class="first-add">+ 关闭效果</span></button>
                </div>
              </div>
            </div>
          </section>

          <!-- ════ 高级匹配规则 ════ -->
          <section class="mb-2.5 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <button id="advToggle" class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left transition-colors hover:bg-slate-50">
              <div class="min-w-0">
                <h3 class="flex items-center gap-2 text-sm font-medium text-slate-900">
                  高级匹配规则
                  <span class="inline-flex items-center rounded-full bg-slate-100 px-1.5 py-0.5 text-2xs font-medium tabular-nums text-slate-600">1</span>
                </h3>
                <div class="mt-0.5 text-xs text-slate-500">按进程名或窗口标题做模式匹配，<span class="font-medium text-slate-600">这里的规则有顺序</span></div>
              </div>
              <svg id="advChevron" class="size-4 shrink-0 rotate-180 text-slate-400 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <!-- 有规则就默认展开：已存在的配置不该藏起来。计数为 0 时才折叠。 -->
            <div id="advBody" class="border-t border-slate-100 px-4 py-3">
              <div class="mb-2.5 flex items-start gap-2 rounded-xl bg-slate-50 px-3 py-2">
                <svg class="mt-0.5 size-3.5 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
                <p class="text-2xs leading-relaxed text-slate-500">
                  裁决顺序：<span class="font-semibold text-slate-700">例外应用</span> → <span class="font-semibold text-slate-700">高级规则（自上而下第一条命中）</span> → <span class="font-semibold text-slate-700">默认行为</span>。
                  只有同一个应用需要按窗口标题分情况处理时才需要用到这里。
                </p>
              </div>

              <div class="space-y-1.5">
                <div class="flex items-center gap-2 rounded-xl border border-slate-950 bg-white px-3 py-2.5 shadow-sm">
                  <button class="cursor-grab text-slate-300 transition-colors hover:text-slate-500" aria-label="拖拽排序">
                    <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
                  </button>
                  <span class="shrink-0 text-2xs font-medium text-slate-400">窗口标题 · 通配符</span>
                  <code class="rounded-md bg-slate-100 px-1.5 py-0.5 text-2xs font-medium text-slate-700">*演示模式*</code>
                  <span class="inline-flex items-center rounded-full bg-amber-50 px-1.5 py-0.5 text-2xs font-medium text-amber-800">关闭</span>
                  <span id="advHit" class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-1.5 py-0.5 text-2xs font-medium text-emerald-800">
                    <span class="size-1.5 rounded-full bg-emerald-500"></span> 此刻命中
                  </span>
                  <span id="advShadowed" class="inline-flex items-center gap-1 rounded-full bg-slate-100 px-1.5 py-0.5 text-2xs font-medium text-slate-500" title="裁决顺序：例外应用先于高级规则">
                    <svg class="size-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    被例外「Figma」覆盖
                  </span>
                  <div class="ml-auto flex shrink-0 items-center gap-1">
                    <button class="rounded-lg px-2 py-1 text-2xs font-medium text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700">编辑</button>
                    <button class="row-del" aria-label="删除规则">
                      <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                    </button>
                  </div>
                </div>
              </div>

              <button class="btn-outline mt-2.5 h-8 px-3 text-xs">
                <svg class="mr-1.5 size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                添加匹配规则
              </button>
            </div>
          </section>

        </div>
      </div>

      <!-- ════ 底部常驻裁决条 ════ -->
      <div class="shrink-0 border-t border-slate-200 bg-white px-3 py-2.5">
        <div class="mx-auto flex max-w-[920px] flex-wrap items-center gap-2">
          <div data-show="normal picker first" class="flex min-w-0 flex-wrap items-center gap-2">
            <span class="app-icon-sm bg-slate-900">F</span>
            <span class="text-xs text-slate-500">当前前台</span>
            <span class="truncate text-xs font-medium text-slate-900">Figma</span>
            <svg class="size-3 shrink-0 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <span data-show="normal picker" class="inline-flex items-center gap-1.5 rounded-lg bg-amber-50 px-2 py-1 text-2xs font-semibold text-amber-800">
              效果已关闭
              <span class="font-normal">来自例外应用「Figma」</span>
            </span>
            <span data-show="first" class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-50 px-2 py-1 text-2xs font-semibold text-emerald-800">
              效果已启用
              <span class="font-normal">来自默认行为</span>
            </span>
          </div>
          <div data-show="denied" class="flex min-w-0 items-center gap-2">
            <span class="grid size-5 place-items-center rounded-full bg-slate-100 text-slate-400">
              <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
            </span>
            <span class="text-xs text-slate-500">无法识别当前前台应用，规则暂不生效</span>
          </div>
          <span class="ml-auto shrink-0 text-2xs text-slate-400">实时反映规则引擎的裁决结果</span>
        </div>

<script src="../controls.js"></script>
<script src="../shell.js"></script>
<script>
mountShell({ active: 'app-rules', mainClass: 'flex min-w-0 flex-1 flex-col overflow-hidden bg-slate-50',
  proto: [['normal', '① 常规（已有例外）'], ['picker', '② 添加应用面板'], ['first', '③ 首次进入'], ['denied', '④ 缺少辅助功能权限']],
  hint: '分段控件、默认行为、高级规则折叠都可点击',
  onProto: (id) => onProtoState(id) });
</script>
<script>
const $ = (id) => document.getElementById(id);

// 原型状态
function onProtoState(s) {
  $('picker').classList.toggle('hidden', s !== 'picker');
}

// 添加应用浮层
$('addAppBtn').addEventListener('click', () => $('picker').classList.toggle('hidden'));
$('pickerClose').addEventListener('click', () => $('picker').classList.add('hidden'));
document.querySelectorAll('.ptab').forEach((tab) => tab.addEventListener('click', () => {
  document.querySelectorAll('.ptab').forEach((t) => {
    const on = t === tab;
    t.className = 'ptab h-7 rounded-lg px-2.5 text-2xs font-medium ' + (on ? 'bg-slate-950 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900');
  });
  document.querySelectorAll('[data-ptab]').forEach((p) => p.classList.toggle('hidden', p.dataset.ptab !== tab.dataset.tab));
}));

// 默认行为单选
let ruleMode = 'all';
function setMode(mode) {
  ruleMode = mode;
  document.querySelectorAll('[data-mode]').forEach((card) => {
    const on = card.dataset.mode === mode;
    card.className = 'mode-card' + (on ? ' mode-card-on' : '');
    card.querySelector('.mode-dot').className = 'mode-dot' + (on ? ' mode-dot-on' : '');
  });
  syncRuleMode();
}

/**
 * 白名单模式下「关闭」是空操作——未列出的应用本来就不生效。
 * 原来切了模式只改单选卡外观，列表纹丝不动，于是出现自相矛盾的行。
 */
function syncRuleMode() {
  const white = ruleMode === 'only';
  document.querySelectorAll('[data-exrow]').forEach((row) => {
    const off = row.querySelector('[data-act="disable"]');
    const badge = row.querySelector('[data-invalid]');
    if (!off) return;
    const isOff = off.classList.contains('seg-item-on');
    off.classList.toggle('hidden', white);
    if (badge) badge.classList.toggle('hidden', !(white && isOff));
    row.classList.toggle('opacity-60', white && isOff);
  });
  // 白名单下「关闭」行是无效配置，顶部给出可执行的收尾动作
  const note = document.getElementById('whiteNote');
  if (note) note.classList.toggle('hidden', !white || !document.querySelector('[data-invalid]:not(.hidden)'));
  // 高级规则被例外覆盖：仅在黑名单模式且 Figma 例外为「关闭」时成立
  const figmaOff = [...document.querySelectorAll('[data-exrow]')].some((r) => r.textContent.includes('Figma') && r.querySelector('[data-act="disable"]')?.classList.contains('seg-item-on'));
  const shadowed = !white && figmaOff;
  document.getElementById('advShadowed')?.classList.toggle('hidden', !shadowed);
  document.getElementById('advHit')?.classList.toggle('hidden', shadowed);
}
document.querySelectorAll('[data-mode]').forEach((c) => c.addEventListener('click', () => setMode(c.dataset.mode)));
document.getElementById('pruneWhite')?.addEventListener('click', () => {
  const rows = [...document.querySelectorAll('[data-exrow]')].filter((r) => r.querySelector('[data-invalid]:not(.hidden)'));
  rows.forEach((r) => r.classList.add('hidden'));
  syncRuleMode();
  toast(`已移除 ${rows.length} 条空配置`, () => { rows.forEach((r) => r.classList.remove('hidden')); syncRuleMode(); });
});

// 反馈统一走外壳的 toast（README 决策 7）。
// 这里原先自带一套页内 toast，迁到共享外壳后它的 DOM 不在了，
// $('toastUndo') 变成 null 直接抛错——从那一行起本页脚本全部没执行。
const showToast = (title, desc, undo) => toast(desc ? `${title} · ${desc}` : title, undo);

// 每行控件：启用 / 关闭 二选一；选「启用」才出现主题选择器（不选就跟随全局）
document.querySelectorAll('.row-controls').forEach((controls) => {
  const themePick = controls.querySelector('.theme-pick');
  const apply = (act) => {
    controls.querySelectorAll('.seg-item').forEach((i) => {
      i.className = 'seg-item' + (i.dataset.act === act ? ' seg-item-on' : '');
    });
    // invisible 而不是 hidden：保留槽位，各行的分段控件才对齐成一列
    themePick.classList.toggle('invisible', act !== 'enable');
    syncRuleMode();   // 行内改动会影响白名单空配置提示与高级规则的覆盖标记
  };
  controls.querySelectorAll('.seg-item').forEach((item) => item.addEventListener('click', () => {
    const before = controls.querySelector('.seg-item-on')?.dataset.act;
    if (before === item.dataset.act) return;
    apply(item.dataset.act);
    const appName = controls.closest('div.flex.items-center.gap-3')?.querySelector('.truncate')?.textContent.trim();
    showToast(
      item.dataset.act === 'disable' ? '已关闭该应用的效果' : '已启用该应用的效果',
      appName || '',
      () => apply(before),
    );
  }));
});

// 高级规则折叠
$('advToggle').addEventListener('click', () => {
  const open = $('advBody').classList.toggle('hidden') === false;
  $('advChevron').classList.toggle('rotate-180', open);
});

// 浮层内的挑选行反馈
document.querySelectorAll('.pick-row').forEach((row) => row.addEventListener('click', () => {
  const cta = row.querySelector('.pick-cta');
  if (!cta) return;
  cta.className = 'pick-added';
  cta.textContent = '已添加';
}));

setMode('all');
document.querySelector('.ptab').click();
</script>
</body>
</html>
