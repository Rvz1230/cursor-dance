<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>托盘面板 · UI 规范</title>
<link rel="stylesheet" href="../mockup.css" />
<style>
  body { font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
  /* 菜单栏底图：只为交代 popup 的出现位置 */
  .menubar { background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); }
</style>
</head>
<body class="bg-slate-300 p-6 text-slate-900">

<div id="proto" class="mx-auto mb-4 flex max-w-[980px] flex-wrap items-center gap-2 rounded-xl bg-slate-900 px-3 py-2"></div>

<!-- 桌面 + 菜单栏，popup 从托盘图标下方展开 -->
<div class="mx-auto max-w-[980px] overflow-hidden rounded-xl border border-slate-400/40 bg-slate-200 shadow-lg">
  <div class="menubar flex h-6 items-center gap-3 border-b border-slate-300 px-3">
    <span class="text-2xs font-semibold text-slate-600">Finder</span>
    <span class="text-2xs text-slate-500">文件</span>
    <span class="text-2xs text-slate-500">编辑</span>
    <div class="min-w-0 flex-1"></div>
    <span class="grid size-4 place-items-center rounded-full bg-slate-900 text-[8px] font-bold text-white" title="CursorDance">C</span>
    <span class="text-xs tabular-nums text-slate-500">13:47</span>
  </div>

  <!-- 舞台高度必须放得下面板本身（top-2 + 526px）——原先 520px 会把「退出 ⌘Q」整行裁掉。 -->
  <div class="relative h-[600px] px-4 py-4">
    <!--
      ── 降级成原生托盘菜单（DECISIONS.md 裁决 9）──

      稿子原先把这里画成一个 320px 的**自绘面板**，并称它是「最高频入口」。
      而 PROGRESS.md:75 的 R1-6 已经**取消桌面 Popup** 并标记完成：
      「删除孤立 renderer、HTML 和构建入口，托盘继续提供快速开关和打开工作台」。

      留着一个设计上核心、工程上已取消的半成品形态，是最坏的一种不一致——
      它会让重构的人以为要把删掉的 renderer 再建回来。所以这一页改画成
      **原生菜单**的样子：role=menu、菜单项、分隔线、勾选态、右侧快捷键。

      保留的问题（登记在裁决 9 里，不在本轮解决）：桌面工具的日常循环
      （暂停 / 换场景 / 在这个应用里关掉）确实比「进工作台调参」高频得多。
      要重建控制中心需要一次独立的产品决策，并连带推翻 R1-6。
    -->
    <p class="max-w-[380px] text-xs leading-relaxed text-slate-500 text-pretty">
      托盘走 <strong class="font-semibold text-slate-700">原生菜单</strong>：启用/暂停、临时暂停、切场景、打开工作台。
      这是 R1-6 已经落地的形态，不是自绘面板。
    </p>

    <!-- popup 320 宽，锚在托盘图标下 -->
    <div role="menu" data-native-menu aria-label="CursorDance 托盘菜单" class="absolute right-6 top-2 w-[248px] overflow-hidden rounded-lg border border-slate-200 bg-white p-1 shadow-lg">

      <!-- 头部：全局开关 + 状态 -->
      <div class="px-2 pb-1 pt-1.5">
        <div id="statusLine" class="truncate text-xs"></div>
      </div>
      <button id="mainToggle" role="menuitemcheckbox" aria-checked="true" class="menu-item" aria-label="启用 CursorDance">
        <span id="mainCheck" class="w-3 shrink-0 text-center text-slate-900">✓</span>
        <span class="min-w-0 flex-1 text-left">启用</span>
        <span class="kbd">⌥⌘E</span>
      </button>
      <div class="menu-sep"></div>

      <!-- 缺权限 -->
      <div data-show="denied" class="border-b border-amber-100 bg-amber-50 px-3.5 py-2.5">
        <p class="text-xs font-medium text-amber-900">未授权辅助功能</p>
        <p class="mt-1 hint-warn">效果不会出现在桌面上。</p>
        <button class="btn-outline mt-2 h-7 w-full px-2.5 text-xs">打开系统设置</button>
      </div>

      <!-- 暂停倒计时 -->
      <div data-show="paused" class="border-b border-slate-100 bg-slate-50 px-3.5 py-2.5">
        <div class="flex items-center gap-2">
          <svg class="size-3.5 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 9v6M14 9v6"/><circle cx="12" cy="12" r="9"/></svg>
          <span class="min-w-0 flex-1 text-xs font-medium text-slate-700">已暂停 · 剩余 <span id="countdown" class="tabular-nums">19:42</span></span>
          <button id="resumeBtn" class="shrink-0 text-xs font-semibold text-slate-900 underline underline-offset-2">立即恢复</button>
        </div>
      </div>

      <!--
        临时暂停：原生菜单里这是一组带勾选的菜单项，不是三个 chip。
        「演示时最常用」这句作为分组标签保留——它解释的是为什么这一组排在最上面。
      -->
      <div class="menu-label">临时暂停 · 演示时最常用</div>
      <button data-pause="20" role="menuitemradio" aria-checked="false" class="menu-item"><span class="w-3 shrink-0"></span><span class="min-w-0 flex-1 text-left">20 分钟</span></button>
      <button data-pause="60" role="menuitemradio" aria-checked="false" class="menu-item"><span class="w-3 shrink-0"></span><span class="min-w-0 flex-1 text-left">1 小时</span></button>
      <button data-pause="0" role="menuitemradio" aria-checked="false" class="menu-item"><span class="w-3 shrink-0"></span><span class="min-w-0 flex-1 text-left">直到重启</span></button>
      <div class="menu-sep"></div>

      <!-- 场景（原「主题」）：菜单里用勾选表示当前项，不用色块网格 -->
      <div class="menu-label">场景</div>
      <div id="themeRow"></div>
      <div class="menu-sep"></div>

      <!-- 刚才使用的应用（措辞见裁决 6：工作台置前时「当前前台」就是 CursorDance 自己） -->
      <div class="menu-label">刚才使用的应用</div>
      <div id="appRow" class="px-1 pb-1"></div>
      <div class="menu-sep"></div>

      <!-- 底部 -->
      <div>
        <a href="01-workbench.html" role="menuitem" class="menu-item"><svg class="size-3.5 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg><span class="min-w-0 flex-1">打开工作台</span><span class="kbd">⌥⌘O</span></a>
        <a href="05-diagnostics.html" role="menuitem" class="menu-item"><svg class="size-3.5 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span class="min-w-0 flex-1">诊断面板</span><span id="diagBadge" class="rounded-full bg-amber-50 px-1.5 py-0.5 text-2xs font-semibold text-amber-800"></span></a>
        <a href="07-settings.html" role="menuitem" class="menu-item"><svg class="size-3.5 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="min-w-0 flex-1">设置</span><span class="kbd">⌘,</span></a>
        <button role="menuitem" class="menu-item text-slate-500"><svg class="size-3.5 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="min-w-0 flex-1">退出</span><span class="kbd">⌘Q</span></button>
      </div>
    </div>
  </div>
</div>

<div id="toastHost" class="pointer-events-none fixed left-1/2 top-4 z-50 flex -translate-x-1/2 flex-col gap-2"></div>

<script>
const $ = (id) => document.getElementById(id);
const THEMES = [
  { id: 'mono', name: '几何', color: '#0f172a' },
  { id: 'drift', name: '流光', color: '#0d9488' },
  { id: 'molten', name: '熔金', color: '#f59e0b' },
  { id: 'sunset', name: '夕霞', color: '#f43f5e' },
];
let enabled = true, paused = false, granted = true, themeId = 'mono';
let appRule = null;   // null | 'disabled' | 'theme'
// 规则钉住的主题与「当前全局主题」是两个独立的值——这正是规则存在的意义，
// 所以它有自己的 id，而不是跟着 themeId 走；但名字仍从 THEMES 读，不写字面量。
const APP_RULE_THEME_ID = 'sunset';
const themeName = (id) => THEMES.find((t) => t.id === id).name;

function renderStatus() {
  const el = $('statusLine');
  if (!granted) { el.className = 'truncate text-xs font-medium text-amber-700'; el.textContent = '需要授权才能生效'; }
  else if (paused) { el.className = 'truncate text-xs font-medium text-slate-500'; el.textContent = '已暂停'; }
  else if (!enabled) { el.className = 'truncate text-xs font-medium text-slate-500'; el.textContent = '已关闭'; }
  // 主题名必须读当前值：原先写死「几何」，切到「流光」后 chip 移过去了、
  // 状态行却还写着「运行中 · 几何」——同一块面板上两处显示同一个值而互相矛盾，
  // 和 01 的「时间有两个编辑面」是同一类会说谎的失效。
  else { el.className = 'truncate text-xs font-medium text-emerald-700'; el.textContent = `运行中 · ${themeName(themeId)}`; }
  // 菜单项用勾选表示开合，不用开关拨片——原生菜单里没有拨片。
  // aria-checked 与那个 ✓ 必须成对（只改一个就是「读屏器听不出来」）。
  const on = enabled && !paused;
  $('mainToggle').setAttribute('aria-checked', String(on));
  $('mainCheck').textContent = on ? '✓' : '';
  $('diagBadge').textContent = granted ? '' : '1';
  $('diagBadge').classList.toggle('hidden', granted);
}
function renderThemes() {
  // 菜单语义：menuitemradio + 勾选列。色点保留一个 6px 的圆——
  // 场景之间要能一眼分辨（DESIGN.md 的内容色/分类色那一类），但不铺成色块网格。
  $('themeRow').innerHTML = THEMES.map((t) => `
    <button data-theme="${t.id}" role="menuitemradio" aria-checked="${t.id === themeId}" class="menu-item">
      <span class="w-3 shrink-0 text-center text-slate-900">${t.id === themeId ? '✓' : ''}</span>
      <span class="size-1.5 shrink-0 rounded-full" style="background:${t.color}"></span>
      <span class="min-w-0 flex-1 text-left">${t.name}</span>
    </button>`).join('');
  $('themeRow').querySelectorAll('[data-theme]').forEach((b) => b.addEventListener('click', () => {
    themeId = b.dataset.theme; renderThemes(); renderStatus();
    toast(`已切到「${THEMES.find((t) => t.id === themeId).name}」`);
  }));
}
function renderApp() {
  const label = appRule === 'disabled' ? '此应用中已关闭' : appRule === 'theme' ? `此应用使用「${themeName(APP_RULE_THEME_ID)}」` : '按全局设置';
  $('appRow').innerHTML = `
    <div class="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-2.5 py-2 shadow-sm">
      <span class="grid size-7 shrink-0 place-items-center rounded-lg bg-slate-900 glyph-badge text-white">F</span>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-xs font-medium text-slate-900">Figma</span>
        <span class="block truncate text-xs ${appRule ? 'text-slate-700' : 'text-slate-500'}">${label}</span>
      </span>
    </div>
    <div class="mt-1.5 grid grid-cols-2 gap-1.5">
      <button data-app="disabled" aria-pressed="${appRule === 'disabled'}" class="preset-chip justify-center${appRule === 'disabled' ? ' preset-chip-on' : ''}">在此应用关闭</button>
      <button data-app="theme" aria-pressed="${appRule === 'theme'}" class="preset-chip justify-center${appRule === 'theme' ? ' preset-chip-on' : ''}">换主题…</button>
    </div>`;
  $('appRow').querySelectorAll('[data-app]').forEach((b) => b.addEventListener('click', () => {
    const next = b.dataset.app;
    const before = appRule;
    appRule = appRule === next ? null : next;
    renderApp();
    toast(appRule ? `已为 Figma 添加规则` : '已移除 Figma 的规则', () => { appRule = before; renderApp(); });
  }));
}

let timer = null;
function startPause(minutes) {
  paused = true;
  renderStatus(); setProtoUi('paused');
  // clearInterval 必须在任何 return 之前：原先它写在「直到重启」的早退之后，
  // 于是「暂停 20 分钟 → 改成直到重启」时旧倒计时还在跑，
  // 实测 1.3 秒后文案就从「直到重启」被覆写成 19:59，20 分钟后更会把 paused 置回 false
  // 并弹「暂停结束，已恢复」——**「直到重启」会自己解除**，这是最糟的一种：静默失效。
  clearInterval(timer);
  if (!minutes) { $('countdown').textContent = '直到重启'; return; }
  let left = minutes * 60;
  timer = setInterval(() => {
    left -= 1;
    if (left <= 0) { clearInterval(timer); paused = false; renderStatus(); setProtoUi('normal'); toast('暂停结束，已恢复'); return; }
    $('countdown').textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
  }, 1000);
  $('countdown').textContent = `${String(minutes).padStart(2, '0')}:00`;
}
document.querySelectorAll('[data-pause]').forEach((b) => b.addEventListener('click', () => {
  startPause(Number(b.dataset.pause));
  toast(b.dataset.pause === '0' ? '已暂停，直到重启' : `已暂停 ${b.dataset.pause} 分钟`);
}));
$('resumeBtn').addEventListener('click', () => { clearInterval(timer); paused = false; renderStatus(); setProtoUi('normal'); toast('已恢复'); });
$('mainToggle').addEventListener('click', () => {
  if (paused) { clearInterval(timer); paused = false; setProtoUi('normal'); }
  else enabled = !enabled;
  renderStatus();
});

function toast(text, undo) {
  const el = document.createElement('div');
  el.className = 'pointer-events-auto flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-3 py-2 shadow-lg';
  el.innerHTML = `<span class="text-xs font-medium text-slate-600">${text}</span>`;
  if (undo) {
    const b = document.createElement('button');
    b.className = 'text-xs font-semibold text-slate-900 underline underline-offset-2';
    b.textContent = '撤销';
    b.addEventListener('click', () => { undo(); el.remove(); });
    el.appendChild(b);
  }
  $('toastHost').appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

const PROTO = [['normal', '① 常规'], ['paused', '② 已暂停（倒计时）'], ['denied', '③ 未授权']];
function setProtoUi(id) {
  $('proto').querySelectorAll('.proto-btn').forEach((b) => {
    const on = b.dataset.proto === id;
    b.classList.toggle('proto-btn-on', on);
    b.setAttribute('aria-checked', String(on));
  });
  document.querySelectorAll('[data-show]').forEach((el) => el.classList.toggle('hidden', !el.dataset.show.split(' ').includes(id)));
}
$('proto').innerHTML = '<span class="proto-label">原型状态</span>'
  + PROTO.map(([id, l]) => `<button data-proto="${id}" role="radio" aria-checked="false" class="proto-btn">${l}</button>`).join('')
  + '<span class="proto-note">「临时暂停」是走查里指出的缺口 · 倒计时会真的走</span>';
$('proto').querySelectorAll('[data-proto]').forEach((b) => b.addEventListener('click', () => {
  const id = b.dataset.proto;
  clearInterval(timer);
  granted = id !== 'denied';
  paused = id === 'paused';
  enabled = true;
  if (paused) startPause(20); else { renderStatus(); setProtoUi(id); }
}));

renderThemes(); renderApp(); renderStatus(); setProtoUi('normal');
</script>
</body>
</html>
