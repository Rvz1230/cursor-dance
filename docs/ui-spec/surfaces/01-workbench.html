<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主题工作台 · UX 原型</title>
<link rel="stylesheet" href="../mockup.css" />
<style>
  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .fx { position: absolute; pointer-events: none; user-select: none; }
  .checker {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #eef2f6 25%, transparent 25%, transparent 75%, #eef2f6 75%),
      linear-gradient(45deg, #eef2f6 25%, transparent 25%, transparent 75%, #eef2f6 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  /*
    真实上下文底图。

    原先舞台只有 浅 / 深 / 格 三档，而它们都验证不了这个产品**真正要回答**的问题：
    「这个效果放在我平时看的东西上面，看得清吗、碍事吗」。
    白底上很漂亮的浅色粒子，压在一段正文上就是一团糊。

    用 CSS 渐变模拟而不是引图片：稿子不该有外部资源依赖（离线打开也要成立），
    而这三档要表达的只是**明度分布与文字密度**这两件事，渐变足够了。
  */
  .ctx-finder {
    background-color: #f6f7f9;
    background-image:
      linear-gradient(180deg, #ffffff 0 26px, transparent 26px),
      repeating-linear-gradient(180deg, transparent 0 34px, #e8ebef 34px 35px),
      linear-gradient(90deg, #eceff3 0 128px, transparent 128px);
  }
  .ctx-browser {
    background-color: #ffffff;
    background-image:
      linear-gradient(180deg, #f1f3f6 0 30px, transparent 30px),
      repeating-linear-gradient(180deg, transparent 0 12px, #e6e9ee 12px 14px);
    background-size: 100% 100%, 62% 100%;
    background-position: 0 0, 19% 44px;
    background-repeat: no-repeat, no-repeat;
  }
  .ctx-deck {
    background-color: #0f172a;
    background-image:
      linear-gradient(120deg, #1e293b 0%, #0f172a 60%),
      linear-gradient(90deg, #334155 0 46%, transparent 46%);
    background-size: 100% 100%, 60% 10px;
    background-position: 0 0, 20% 34%;
    background-repeat: no-repeat, no-repeat;
  }
</style>
</head>
<body class="bg-slate-200 p-6 text-slate-900">

<div id="proto"></div>
<div id="app"></div>

<template id="page">

      <!-- 动作标签：带已启用效果数 -->
      <div class="shrink-0 px-3 pt-3">
        <div class="rounded-xl border border-slate-200 bg-white px-2.5 py-2.5 shadow-sm">
          <div id="actionTabs" role="tablist" aria-label="动作" class="-mx-1 flex gap-2 overflow-x-auto px-1"></div>
        </div>
      </div>

      <!--
          role="tabpanel"：#actionTabs 是真的 tablist——它切的就是这一整块
          （配置列 + 预览 + 时间轴都跟着动作换）。补上面板声明之后 tab 语义才成立；
          门禁 tab-without-tabpanel 盯的正是「有页签、没有面板」这种半成品。
          aria-labelledby 指向当前页签，由 renderActions 同步。
        -->
        <div id="cols" role="tabpanel" aria-labelledby="actionTab-leftClick" class="motion-layout grid min-h-0 flex-1 gap-1.5 px-3 pt-2.5" style="grid-template-columns: minmax(0,1.05fr) 4px minmax(0,1.25fr)">

        <!--
          ── 配置列：八张效果卡直接铺开 ──

          这里曾经有一层「整体手感」宏观旋钮（强度/速度/存在感/色相），
          八张效果卡收进「高级编辑」折叠。**已按裁决 12 的推翻记录回退**
          （2026-08-05，理由见 DECISIONS.md：多一层间接、且把主任务推到折叠后面）。

          回退时一并去掉的还有：字段值上的旋钮乘子（`effectiveFieldValue`）、
          色相偏移（`knobColor`）、以及「速度 100% 的时间基线」那第三份时间快照
          （`chBase` / `applySpeedFromBase` / `rebaseTimes`）。
          现在**字段本身就是唯一真值**，时间只有时间轴一个编辑面——
          这比旋钮层在时的模型少一次投影。

          裁决 12 提出的那个问题仍然存在（从「选一套」到「调一个字段」中间没有过渡层），
          只是旋钮不是它的答案。真要再解，预设先行（决策 #2）和 `06` 的 AI 都是候选。
        -->
        <div class="min-h-0 space-y-2 overflow-y-auto pr-1" id="cardCol"></div>

        <!--
          列宽分隔条。真实代码 useWorkbenchColumnLayout 早就有 startResizeColumns，
          稿子原先只画了三个布局预设按钮、没有分隔条——按稿子重构会把这个已工作的
          功能删掉。预设保留为快捷入口，拖拽是自由档。
          4px 宽与真实代码 getWorkbenchGridTemplate 里的 "4px" 轨道一致。
        -->
        <div
          id="colSplit"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整配置列与预览列的宽度"
          tabindex="0"
          class="group relative -mx-1 w-1.5 cursor-col-resize self-stretch rounded-full focus-visible:outline-none"
        >
          <span class="pointer-events-none absolute inset-y-0 left-1/2 w-px -translate-x-1/2 bg-slate-200 transition-colors group-hover:bg-slate-400 group-focus-visible:bg-slate-500"></span>
        </div>

        <!-- 预览列：舞台占满全高 -->
        <div class="flex min-h-0 flex-col">
          <section class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <!--
              页头压成单行：原先它占 97px，而它要服务的舞台只有 143px。
              说明文字（点击舞台触发 · 拖播放头定格）与舞台内的 stageHint 说的是同一件事，
              重复占掉的正是舞台最缺的垂直空间。标题旁留一句极短的提示即可。
            -->
            <div class="flex items-center justify-between gap-2 border-b border-slate-100 px-4 py-2">
              <!--
                「点一下即触发」这句已删除。它和舞台里的 stageHint（「在这里单击试试」）
                说的是同一件事，而在真实默认宽度下它被 truncate 压成**一个字**——
                一个字的提示不传递任何信息，只制造视觉噪音。
                这条也正是上一轮压缩页头时给出的理由（重复占掉的正是舞台最缺的空间），
                当时只删了两行说明里的一行，留下的这半句在 960px 下才露出问题。
              -->
              <div class="flex min-w-0 items-baseline gap-2">
                <h3 class="shrink-0 text-sm font-medium text-slate-900">实时预览</h3>
              </div>
              <div class="flex shrink-0 items-center gap-1.5">
                <div class="seg-group">
                  <button data-bg="light" role="radio" aria-checked="true" class="seg-item seg-item-on">浅</button>
                  <button data-bg="dark" role="radio" aria-checked="false" class="seg-item">深</button>
                  <button data-bg="checker" role="radio" aria-checked="false" class="seg-item">格</button>
                  <button data-bg="finder" role="radio" aria-checked="false" class="seg-item" title="文件管理器：浅底 + 密集行">访达</button>
                  <button data-bg="browser" role="radio" aria-checked="false" class="seg-item" title="浏览器正文：白底 + 文字块">网页</button>
                  <button data-bg="deck" role="radio" aria-checked="false" class="seg-item" title="演示稿：深底大留白">演示</button>
                </div>
                <!--
                  「连打」是唯一能验证节流 / 连击窗 / 错峰 / 预算水位有收益的场景。
                  单次事件下这四个值互不相干，也就看不出调它们有什么用——
                  而真实使用是连点、拖动、滚轮的连续流，手感恰恰是它们互相打出来的。
                -->
                <button id="burstBtn" class="btn-outline h-7 px-2.5 text-xs" title="按固定脚本连点，看节流与连击窗互相作用">连打</button>
                <button id="onionBtn" class="btn-outline h-7 px-2.5 text-xs" title="洋葱皮：叠加多帧看运动路径">轨迹</button>
                <button id="abBtn" class="btn-outline h-7 px-2.5 text-xs" title="按住：把「这一轮动手之前」叠在同一帧上对比">A/B</button>
              </div>
            </div>

            <div class="flex min-h-0 flex-1 flex-col px-4 pt-3">
              <div id="stage" class="relative min-h-0 flex-1 overflow-hidden rounded-xl border border-slate-200 bg-white">
                <div id="stageHint" class="pointer-events-none absolute inset-0 grid place-items-center text-center">
                  <div>
                    <div class="text-xs font-medium text-slate-500">在这里<span id="hintGesture">单击</span>试试</div>
                    <div class="mt-1 text-2xs text-slate-500">或拖下面的播放头逐帧检视</div>
                  </div>
                </div>
                <div id="onionHost" class="pointer-events-none absolute inset-0"></div>
                <div id="fxHost" class="pointer-events-none absolute inset-0"></div>
                <!-- 文案跟着语义改：现在是叠放而不是切换，所以说的是「灰的那层是改之前」 -->
                <div id="abBadge" class="pointer-events-none absolute right-3 top-3 hidden rounded-lg bg-slate-900 px-2 py-1 text-xs font-medium text-white">灰色叠层 = 你这一轮动手之前</div>
                <!--
                  被触发区域拦下时的就近说明。「静默不出效果」是这类功能最差的失败方式：
                  用户会以为是效果坏了，去改粒子参数——而真正拦下它的是「触发区域」那个下拉。
                  这条与 05 诊断面板的「不在触发区域内 11」是同一件事的两端。
                -->
                <!-- 预算水位：只在连打时出现。同显数超上限时多出来的效果被丢掉而不是排队
                     （排队会让手感变黏），被丢的次数在 05 诊断面板里看得到。 -->
                <div id="budgetHud" class="pointer-events-none absolute left-3 top-3 hidden rounded-lg bg-slate-900/85 px-2 py-1 text-xs font-medium tabular-nums text-white">
                  同显 <span id="budgetNow">0</span>/<span id="budgetMax">48</span> · 节流丢弃 <span id="budgetDrop">0</span>
                </div>
                <div id="zoneMiss" class="pointer-events-none absolute inset-x-3 bottom-3 hidden rounded-lg bg-amber-50 px-2.5 py-1.5 text-xs text-amber-700 ring-1 ring-amber-200">
                  这一下不在<span class="font-semibold">触发区域</span>内，被过滤了 · 改「触发行为 · 触发区域」可放宽
                </div>
              </div>
            </div>

            <!--
              传输控制：**必须单行**。

              原先是 `flex-wrap`，理由写着「窄列下允许换行（垂直代价可接受）」——
              而实测那个垂直代价一点都不可接受：960×680 下这一行从 58px 折成 **94px**，
              多吃的 36px 正好把纵向预算压穿，于是 `#stage` 带着 min-height:240 溢出去
              **把这一整行 9 个按钮全盖住**（elementFromPoint 全部返回 #stage）。
              「换行 = 还能读」这句只在横向成立，纵向它是在偷别人的高度。

              改成三段瘦身，档位由 #mockWindow[data-w] 决定（不是浏览器视口——
              22 处视口断点全部失效那一课）：
                lg  ：全文字标签，最舒展
                md/sm：倍速三档 → 一个紧凑下拉；循环区间 / 自动重播 → 图标按钮
                       （`aria-label` + `title` 保留可读性，DESIGN.md 要求图标按钮必须有名）
              实测 md 档单行 34px，纵向预算 593 ≤ 596，三者第一次真的同时装得下。
            -->
            <!--
              `sticky bottom-0`：兜底纵滚生效时（720×480 这种低于可用下限的档），
              舞台会比预览列高，滚动会把这一行推出视口。实测滚到底之后仍有 7 个按钮
              `elementFromPoint` 命中不到——**「能滚」也要真的滚得到才算数**。
              钉住之后舞台在它下面滚过去，传输控件永远在原位。
              非滚动档位上 sticky 是空操作，所以不需要按档位开关。
            -->
            <div class="sticky bottom-0 z-10 flex items-center gap-2 border-t border-slate-100 bg-white px-4 py-2 [&>*]:shrink-0">
              <div class="flex items-center gap-0.5 rounded-xl border border-slate-200 bg-white p-1 shadow-sm">
                <button id="playBtn" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="播放/暂停">
                  <svg id="playIcon" class="size-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="stepBack" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="后退一帧">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6 9 12l6 6M8 6v12"/></svg>
                </button>
                <button id="stepFwd" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="前进一帧">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6M16 6v12"/></svg>
                </button>
                <button id="replayBtn" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="重播">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
                </button>
              </div>
              <!-- lg：三档摆开；md/sm：收成一个下拉（同一份 data-speed 语义，两处不会不一致） -->
              <div class="seg-group hidden group-data-[w=lg]/win:flex" role="radiogroup" aria-label="播放倍速">
                <button data-speed="1" role="radio" aria-checked="true" class="seg-item seg-item-on">1×</button>
                <button data-speed="0.5" role="radio" aria-checked="false" class="seg-item">0.5×</button>
                <button data-speed="0.25" role="radio" aria-checked="false" class="seg-item">0.25×</button>
              </div>
              <div id="speedSel" class="w-[72px] group-data-[w=lg]/win:hidden"></div>
              <button id="loopBtn" class="btn-outline h-7 px-2.5 text-xs" title="只循环标尺上选中的区间" aria-pressed="false" aria-label="循环区间">
                <svg class="size-3.5 group-data-[w=lg]/win:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                <span class="hidden group-data-[w=lg]/win:inline">循环区间</span>
              </button>
              <!--
                自动重播与「循环区间」是两回事，所以是两个控件：
                循环区间 = 反复播标尺上选中的那一段，段与段之间不留空隙；
                自动重播 = 整条播完后隔一段时间再来一次，模拟「用户隔一会儿点一下」。
                调手感时需要的是后者——效果之间要有间隔才看得出单次的样子。
                间隔档位（2400/1200/600ms）与真实代码 INTERVAL_PRESETS 对齐。
              -->
              <button id="autoBtn" class="btn-outline h-7 px-2.5 text-xs" title="整条播完后自动再来一次" aria-pressed="false" aria-label="自动重播">
                <svg class="size-3.5 group-data-[w=lg]/win:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
                <span class="hidden group-data-[w=lg]/win:inline">自动重播</span>
              </button>
              <div id="autoIntervalGroup" class="seg-group hidden" role="radiogroup" aria-label="自动重播间隔">
                <button data-interval="2400" role="radio" aria-checked="false" class="seg-item">慢</button>
                <button data-interval="1200" role="radio" aria-checked="true" class="seg-item seg-item-on">标准</button>
                <button data-interval="600" role="radio" aria-checked="false" class="seg-item">快</button>
              </div>
              <span class="ml-auto inline-flex h-7 items-center gap-1 rounded-xl bg-slate-50 px-2.5 text-xs font-semibold tabular-nums text-slate-700 ring-1 ring-slate-200">
                <span id="timeNow">0</span><span class="text-slate-500">/</span><span id="timeTotal">960</span><span class="font-normal text-slate-500">ms</span>
              </span>
            </div>

            <!--
              这一行在 960×680 下曾经**竖排成一列单字**（本/次/输/出）：
              容器实测只有 32px 宽，`flex-wrap` 于是按字换行。
              竖排单字是「窄到没有任何可读性」的信号，任何时候都不该出现，
              所以这里禁掉换行、标签给 nowrap，装不下就横向滚动——
              横滚需要一个动作才能看全，竖排单字连读都读不了。
            -->
            <div id="outputRow" class="flex items-center gap-1.5 border-t border-slate-100 px-4 py-2">
              <span class="shrink-0 whitespace-nowrap text-xs font-medium text-slate-500">本次输出</span>
              <div id="outputTags" class="flex min-w-0 flex-1 gap-1.5 overflow-x-auto whitespace-nowrap"></div>
            </div>
          </section>
        </div>
      </div>

      <!-- ══ 底部抽屉：时间轴需要的是水平空间，所以横跨两列 ══ -->
      <div id="drawer" class="shrink-0 border-t border-slate-200 bg-white">
        <div id="drawerGrip" class="group flex h-2.5 cursor-row-resize items-center justify-center" title="拖动调整高度">
          <span class="h-0.5 w-10 rounded-full bg-slate-200 transition-colors group-hover:bg-slate-400"></span>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 px-3 pb-2">
          <div class="flex min-w-0 items-center gap-2">
            <button id="drawerToggle" class="grid size-5 place-items-center rounded text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700" aria-label="折叠时间轴">
              <svg id="drawerChevron" class="size-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <span class="text-xs font-medium text-slate-700">时间轴</span>
            <span class="rounded-md bg-slate-100 px-1.5 py-0.5 text-xs font-medium tabular-nums text-slate-500">总长 <span id="totalLabel">960</span>ms</span>
            <span id="drawerSummary" class="truncate text-xs text-slate-500"></span>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            <div class="seg-group" role="radiogroup" aria-label="标尺吸附">
                    <button data-snap="20" role="radio" aria-checked="true" class="seg-item seg-item-on">20</button>
                    <button data-snap="10" role="radio" aria-checked="false" class="seg-item">10</button>
                    <button data-snap="0" role="radio" aria-checked="false" class="seg-item">关</button>
                  </div>
                  <div class="seg-group" role="radiogroup" aria-label="时间轴缩放">
                    <button data-zoom="1" role="radio" aria-checked="true" class="seg-item seg-item-on">适配</button>
                    <button data-zoom="2" role="radio" aria-checked="false" class="seg-item">2×</button>
                    <button data-zoom="4" role="radio" aria-checked="false" class="seg-item">4×</button>
                  </div>
            <button id="copyRhythm" class="text-xs font-medium text-slate-500 transition-colors hover:text-slate-700" title="把这套时间关系套用到其他动作">复制节奏</button>
          </div>
        </div>
        <div id="drawerBody" class="motion-layout grid gap-2.5 px-3 pb-3" style="grid-template-columns: minmax(0,1fr) 296px; height: 236px">
          <div id="tlScroll" class="min-h-0 overflow-auto rounded-xl border border-slate-200 bg-white px-3 py-2">
            <!--
              轨道最小宽 320px（132 标签 + 10 gap + 320 轨道 + 8 内边距 = 470）。
              原先只有 `min-w-full`，于是 `.tl-row` 的 `132px + 1fr` 里**轨道是唯一有弹性的轨**，
              窗口变窄时全部收缩由它承担、标签列到死都保着 132px：
              实测 1200px 窗口下轨道还有 444px，880px 只剩 124px，720px（桌面最小）就是 2px。
              2px 的色块既拖不动块体也拖不动边缘——看得见、够不着。
              现在装不下就让 #tlScroll 横向滚动（DAW 的通行做法），标签列 sticky 钉住。
            -->
            <div id="tlInner" class="motion-layout min-w-[470px]">
              <!--
                标尺的栅格必须和 .tl-row **严格一致**（132px + minmax(320px,1fr) + gap-2.5 + px-1）。

<script>
mountShell({ active: 'workbench', mainClass: 'flex min-w-0 flex-1 flex-col overflow-hidden bg-slate-50',
  // ① 是**默认态**，而默认态现在是侧栏收起的。原先 ① 硬调 setSidebar(false)、
  // ② 才是折叠——那是「默认展开」时代的分法。改默认值之后这里必须跟着反转，
  // 否则页面一加载就被原型状态把外壳默认值覆盖掉（实测 sidebarClosed 被写回 false、
  // 侧栏仍是 248px），而看起来像是「默认收起没生效」。
  // **原型状态是页面级的最后一道写入，它会盖住外壳的默认值** —— 改默认值时必须连它一起查。
  proto: [['normal', '① 常规（侧栏收起）'], ['expanded', '② 侧栏展开'], ['cmdk', '③ 命令面板 ⌘K']],
  hint: '舞台可点击触发 · 拖播放头定格 · 拖色块到锚点建立链接 · 预设 chip 可点 · ⌘Z 撤销',
  onProto: (id) => {
    if (id === 'expanded') { setSidebar(false); toggleCmdk(false); }
    else if (id === 'cmdk') { setSidebar(true); toggleCmdk(true); }
    else { setSidebar(true); toggleCmdk(false); }
  } });
// 布局预设 + 自由拖拽：外壳出按钮，页面出实现（列宽是页面自己的事）
//
// 权重与夹取区间照 useWorkbenchColumnLayout.ts 的模型来：预设只是权重的三个档位，
// 拖分隔条是连续档。拖过之后不再高亮任何预设——当前比例已经不是那三档里的任何一个，
// 继续亮着会谎报状态。
const LAYOUTS = { config: [1.6, 1], split: [1, 1], preview: [0.8, 1.7] };
const COL_MIN = 0.62, COL_MAX = 1.9;
const clampCol = (v) => Math.min(COL_MAX, Math.max(COL_MIN, v));
/**
 * 初始布局改成 `split`（1 : 1），不再是 `config`（1.6 : 1）。
 *
 * 1.6 : 1 是在 1440px 基准 + 侧栏展开的年代定的。放到今天的默认组合
 * （960px 窗口 + 侧栏收起 → 主区 898px）上算：配置列 550、预览列 344。
 * 配置列 550px 远超它需要的宽度（一张效果卡的字段行 340px 就够），
 * 而预览列要同时装舞台（min 240）+ 传输控件 + 输出行，344px 一直在临界点上——
 * 之前「本次输出」被压成竖排单字、工具条散落成两行，根子都在这个初始比例。
 * 1 : 1 给出 447 / 447：配置列仍宽裕，预览列多出 100px，工具条能排一行。
 *
 * 三个预设都留着——它们是「我这一刻在干什么」的快捷档（改参数 / 看效果），
 * 只是**默认不该落在最偏的那一档**。
 */
let weights = [...LAYOUTS.split];
let layout = 'split';

/**
 * 权重是比例，而比例在窄窗口下会把某一列压到不可用——**必须再按像素下限夹一道**。
 *
 * 实测：默认预设「配置优先」是 1.6 : 1。在 1440px 下预览列还有约 458px、够用；
 * 换到真实默认的 960px 窗口后只剩 **258px**，而舞台的 min-width 就占 240，
 * 只剩 18px 余量——于是「本次预览」工具条和「本次输出」行被挤爆，
 * 输出行的容器实测只有 **32px 宽，文字竖排成一列单字**。
 *
 * 所以这里把比例换算成像素后夹取：预览列 ≥ 舞台最小宽 + 72（留给工具条与滚动条），
 * 配置列 ≥ 340（一张效果卡的字段行 + 数值读数装得下的下限）。
 * 两者都满足不了时按可用宽度等分，并让 shouldStackCols() 决定是否改成上下堆叠。
 */
const CONFIG_COL_MIN = 340;
const previewColMin = () => stageMin().w + 72;
// 两列都塞不进去就不要硬塞——横向并排不是目的，同时看到配置与预览才是。
// 装不下时改成上下堆叠，各自拿满宽度。
function shouldStackCols() {
  const total = document.getElementById('cols').clientWidth || 0;
  return total > 0 && total - 4 < CONFIG_COL_MIN + previewColMin();
}
function applyCols() {
  const cols = document.getElementById('cols');
  const total = cols.clientWidth || 0;
  const split = document.getElementById('colSplit');
  if (shouldStackCols()) {
    // 单列堆叠：配置在上、预览在下。分隔条此时无意义（没有左右可分），必须真的移出
    // 可达性树而不是只做视觉隐藏——留一个键盘能聚焦、按了却什么也不做的 separator
    // 就是决策 #4「操作不得只在某一种到达方式下可用」的反面：一个骗人的控件。
    cols.style.gridTemplateColumns = 'minmax(0,1fr)';
    cols.dataset.stacked = '1';
    if (split) { split.hidden = true; split.tabIndex = -1; }
    return;
  }
  delete cols.dataset.stacked;
  if (split) { split.hidden = false; split.tabIndex = 0; }
  let [a, b] = weights;
  if (total > 0) {
    const avail = total - 4;
    const pxB = (avail * b) / (a + b);
    const minB = previewColMin();
    // 预览列不够 → 从配置列借，但不能让配置列低于它自己的下限
    if (pxB < minB) {
      const wantB = Math.min(minB, Math.max(0, avail - CONFIG_COL_MIN));
      const wantA = Math.max(0, avail - wantB);
      if (wantA > 0 && wantB > 0) { a = wantA; b = wantB; }
    }
  }
  cols.style.gridTemplateColumns = `minmax(0,${a}fr) 4px minmax(0,${b}fr)`;
}
function syncLayout() {
  applyCols();
  document.querySelectorAll('[data-shell-layout]').forEach((b) => {
    const on = b.dataset.shellLayout === layout;
    b.classList.toggle('layout-btn-on', on);
    b.setAttribute('aria-pressed', String(on));
  });
}
document.querySelectorAll('[data-shell-layout]').forEach((b) => b.addEventListener('click', () => {
  layout = b.dataset.shellLayout;
  weights = [...LAYOUTS[layout]];
  syncLayout();
}));

// 拖分隔条：按像素位移换算权重增量，与真实代码一致地用「总权重守恒」的方式挪，
// 这样另一列不会被挤没。
function startColDrag(startX) {
  const total = weights[0] + weights[1];
  const gridW = document.getElementById('cols').clientWidth || 1;
  const start = [...weights];
  // 同抽屉：拖列宽时停掉 L2 过渡，否则列边缘会追不上分隔条
  document.getElementById('cols').classList.add('motion-none');
  const onMove = (e) => {
    const deltaWeight = ((e.clientX ?? startX) - startX) / gridW * total;
    const left = clampCol(start[0] + deltaWeight);
    weights = [left, clampCol(total - left)];
    layout = '';            // 已是自定义比例，不再谎称命中某个预设
    applyCols();
    document.querySelectorAll('[data-shell-layout]').forEach((b) => { b.classList.remove('layout-btn-on'); b.setAttribute('aria-pressed', 'false'); });
  };
  const onUp = () => {
    document.getElementById('cols').classList.remove('motion-none');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    // 撤销走过渡：这一步是**程序改尺寸**，用户没有在拖，因果需要动效来表达
    toast('已调整列宽', () => { weights = [...start]; applyCols(); });
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
document.getElementById('colSplit').addEventListener('pointerdown', (e) => { e.preventDefault(); startColDrag(e.clientX); });
// 键盘可达：分隔条不能只能用鼠标拖（决策 #4 同源——操作不得只有一种到达方式）
document.getElementById('colSplit').addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.12 : 0.04;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const total = weights[0] + weights[1];
  const left = clampCol(weights[0] + (e.key === 'ArrowRight' ? step : -step));
  weights = [left, clampCol(total - left)];
  layout = '';
  applyCols();
  document.querySelectorAll('[data-shell-layout]').forEach((b) => { b.classList.remove('layout-btn-on'); b.setAttribute('aria-pressed', 'false'); });
});
</script>

          <div class="mb-2 flex items-center gap-1.5">
            <span class="field-label">预设</span>
            <span class="text-2xs text-slate-500">点一下填一组参数，再微调</span>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${(() => {
              const changed = (c.fields || []).some((f) => f.src === 'custom' || f.src === 'ai');
              return c.presets.map((p) => {
                const on = p === c.preset;
                // 套了预设又手改过，chip 不能继续假装「就是这个预设」
                return `<button data-preset="${c.key}|${p}" role="radio" aria-checked="${on}" class="preset-chip${on ? ' preset-chip-on' : ''}">${presetSample(c.key, p)}${p}${on && changed ? '<span class="ml-1 font-normal opacity-70">·已改</span>' : ''}</button>`;
              }).join('') + (changed ? `<button data-represet="${c.key}" role="radio" aria-checked="false" class="preset-chip border-dashed">回到「${c.preset}」</button>` : '');
            })()}
          </div>
        </div>
        ${fields ? `<div class="space-y-2.5 border-t border-slate-100 pt-3">${fields}</div>` : ''}
        ${c.total > shown ? `
          <div class="border-t border-slate-100 pt-2.5">
            <button data-more="${c.key}" aria-expanded="${!!c.more}" class="flex w-full items-center gap-1.5 text-xs font-medium text-slate-500 transition-colors hover:text-slate-900">
              <svg class="size-3 transition-transform ${c.more ? 'rotate-90' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
              其余 ${c.total - shown} 项
              <span class="ml-auto inline-flex items-center gap-1 text-2xs font-normal text-slate-500">按 <span class="kbd">⌘K</span> 可直接搜字段</span>
            </button>
            ${c.more && c.groups ? `<div class="mt-2 space-y-2">
              ${c.groups.map(([g, labels]) => {
                const rows = labels
                  .map((label) => c.fields.find((f) => f.label === label && f.group === g))
                  .filter(Boolean)
                  .map((f) => renderField(c.key, f, c.fields.indexOf(f)))
                  .join('');
                return `<div class="rounded-lg bg-slate-50/70 px-2.5 py-2 ring-1 ring-slate-200/70">
                  <div class="text-xs font-medium text-slate-600">${g} <span class="font-normal text-slate-500">${labels.length}</span></div>
                  <div class="mt-2 space-y-2.5">${rows}</div>
                </div>`;
              }).join('')}
            </div>` : ''}
          </div>` : ''}
      </div>
    </div>`;
  }).join('');
  bindCardEvents();
  bindCardChrome();
}

/*
  ── 「配置变了」的单一漏斗 ──

  一次字段改动要同时影响四处：卡片本身、「本次输出」行、舞台的**最小尺寸**
  （`stageMin()` 由波纹最大半径 / 粒子扩散半径 / 飘字上浮距离算出）、以及舞台画面。
  散着调很容易漏掉第三处，表现成「把扩散半径拉到 320，粒子飞出舞台边界被裁掉」。

  拖动**过程中**不能走这个漏斗：`renderCards()` 会重建 DOM，把正在拖的那个滑块拆掉。
  所以拖动期间只 `paintStage()`，松手 commit 才走漏斗。
*/
function afterConfigChange() {
  renderCards();
  renderOutputs();
  syncDrawer();      // 重算舞台最小尺寸 + 抽屉可用高度（内部会 renderTimeline）
  paintStage();
}

// 折叠与重置。两者都是「卡级」操作，与效果开关分开：
// 折叠只影响视觉密度（配置仍然生效），关闭才是不出效果。把它们混成一个控件
// 会让「我只是想少占点地方」变成「我把效果关了」。
function bindCardChrome() {
  document.querySelectorAll('[data-jumptrack]').forEach((b) => b.addEventListener('click', () => revealTrack(b.dataset.jumptrack)));
  document.querySelectorAll('[data-cardfold]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.cardfold);
    c.folded = !c.folded;
    renderCards();
  }));
  document.querySelectorAll('[data-cardreset]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.cardreset);
    const before = c.fields.map((f) => ({ value: f.value, src: f.src }));
    const n = before.filter((s) => s.src === 'custom' || s.src === 'ai').length;
    c.fields.forEach((f) => {
      if (f.src !== 'custom' && f.src !== 'ai') return;
      if (f.presetValue !== undefined) f.value = f.presetValue;
      f.src = 'preset';
    });
    renderCards(); renderOutputs(); renderTimeline();
    toast(`已重置「${c.name}」· ${n} 项回到「${c.preset}」`, () => {
      c.fields.forEach((f, i) => { f.value = before[i].value; f.src = before[i].src; });
      renderCards(); renderOutputs(); renderTimeline();
    });
  }));
}

const SRC = {
  preset:  ['bg-slate-300', '来自预设'],
  ai:      ['bg-sky-400', 'AI 建议'],
  custom:  ['bg-slate-900', '你改过'],
};
function srcDot(cardKey, f) {
  const meta = SRC[f.src];
  if (!meta) return '';
  const revert = f.presetValue !== undefined ? ` · 双击回到预设值 ${f.presetValue}` : '';
  return `<span data-revert="${cardKey}|${f.label}" class="size-1.5 shrink-0 rounded-full ${meta[0]}" title="${meta[1]}${revert}"></span>`;
}
function renderField(cardKey, f, i) {
  const id = `f-${cardKey}-${i}`;
  if (f.type === 'num') {
    // 共享滑块 + 可编辑读数：标签可 scrub、拖柄出气泡、双击回默认
    return `<div class="ctl-row" data-fieldrow="${cardKey}|${f.label}">
      <span class="field-label ctl-label-scrub" data-scrub="${id}">${f.label}${srcDot(cardKey, f)}</span>
      <div id="${id}" data-slider data-min="${f.min}" data-max="${f.max}" data-value="${f.value}"
           data-default="${f.presetValue ?? f.value}" data-field="${cardKey}|${f.label}"></div>
      <span class="ctl-value"><span data-out="${id}">${f.value}</span>${f.unit ? ` ${f.unit}` : ''}</span>
    </div>`;
  }
  if (f.type === 'select') {
    return `<div class="ctl-row-wide" data-fieldrow="${cardKey}|${f.label}">
      <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
      <div id="${id}" data-select="${cardKey}|${f.label}"></div>
    </div>`;
  }
  if (f.type === 'toggle') {
    // 开关字段（渐变开关 / 启用拖尾）。`role="switch"` + `aria-checked` 是必须的：
    // 只靠 class 表达开合，读屏器听不出来（DESIGN.md 可访问性节）。
    return `<div class="grid grid-cols-[104px_minmax(0,1fr)] items-center gap-2.5" data-fieldrow="${cardKey}|${f.label}">
      <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
      <span>
        <button role="switch" aria-checked="${!!f.value}" data-fieldtoggle="${cardKey}|${f.label}" aria-label="${f.label}"
                class="relative h-5 w-9 shrink-0 rounded-full transition-colors ${f.value ? 'bg-slate-900' : 'bg-slate-200'}">
          <span class="absolute top-0.5 size-4 rounded-full bg-white shadow-sm transition-[left] ${f.value ? 'left-[18px]' : 'left-0.5'}"></span>
        </button>
      </span>
    </div>`;
  }
  if (f.type === 'color') {
    /* 色板走共享的 `Ctl.colorField`（compact 档：只有色板，尺寸 size-6）。
       这一页原先手写的那份**语义是对的**（role=radiogroup + aria-checked），
       比控件库那份还正确——于是「库页是参照实现」这句话当时是反的。
       现在两边同一份实现，而调色板取 `Ctl.CONTENT_PALETTE`：
       用户内容色**不受外壳调色板约束**（DESIGN.md 色彩节第 3 类 · 裁决 11），
       所以里面有 violet 是对的，它不是外壳色。 */
    return `<div class="grid grid-cols-[104px_minmax(0,1fr)] items-center gap-2.5" data-fieldrow="${cardKey}|${f.label}">
      <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
      <div id="${id}" data-colorfield="${cardKey}|${f.label}" data-label="${f.label}"></div>
    </div>`;
  }
  // 文本字段。原先是一个**裸 `<input>`、没有任何监听**——于是「文案」是死控件，
  // 舞台永远画写死的 `Nice!`。提交语义与 Ctl.number 对齐：change（失焦或 Enter）才落，
  // Esc 放弃，空串视为放弃而不是静默清空。
  return `<div class="grid grid-cols-[104px_minmax(0,1fr)] items-center gap-2.5" data-fieldrow="${cardKey}|${f.label}">
    <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
    <input value="${esc(f.value)}" data-text="${cardKey}|${f.label}" aria-label="${f.label}"
           class="h-8 rounded-xl border border-slate-200 bg-white px-2 text-xs text-slate-700 shadow-sm" />
  </div>`;
}

function mountCardControls() {
  // 形状类字段画出图形，其余给纯文字选项——都走同一个下拉实现
  document.querySelectorAll('[data-select]').forEach((el) => {
    if (el.dataset.mounted) return;
    el.dataset.mounted = '1';
    const [key, label] = el.dataset.select.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    const isShape = label === '形状';
    Ctl.select(el, {
      options: f.options.map((o) => ({ label: o, thumb: isShape ? Ctl.shapeThumb(o) : undefined })),
      value: f.value,
      onChange: (v) => {
        const before = f.value;
        f.value = v; f.src = 'custom';
        afterConfigChange();
        const undo = () => { f.value = before; afterConfigChange(); return () => { f.value = v; afterConfigChange(); return undo; }; };
        toast(`「${c.name} · ${label}」已改为 ${v}`, undo);
      },
    });
  });
  /*
    这里原先带着 `:not([data-knob])`——宏观旋钮（裁决 12）也用 `data-slider`，
    而这个循环先跑、会给命中的元素打上 `data-mounted`，于是旋钮会被**字段处理器**
    悄悄认领，症状是「读数动了、别处全不动」。

    旋钮层已按用户判断回退（见 DECISIONS.md 裁决 12 的推翻记录），所以那个排除项
    随它一起去掉。**教训本身留着**：一个共享选择器悄悄认领别人的元素，
    是这份稿子最常见的那类缺陷——下次再往 `data-slider` 上加第二类消费者时，
    先想清楚谁先跑、谁打标记。
  */
  document.querySelectorAll('[data-slider]:not([data-mounted])').forEach((el) => {
    el.dataset.mounted = '1';
    const out = document.querySelector(`[data-out="${el.id}"]`);
    const [key, label] = (el.dataset.field || '').split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c?.fields.find((x) => x.label === label);
    Ctl.slider(el, {
      // 拖动过程中就重画舞台：这就是「预览面是可交互沙盒」（决策 #8）该有的手感——
      // 调一个参数要手动去舞台点一下才看到结果，对 ~390 个字段等于 390 次多余点击。
      // paintStage 是「一帧 = 时间的纯函数」，所以定格在当前播放头上重画是安全的。
      onChange: (v) => {
        if (out) out.textContent = v;
        if (!f) return;
        /*
          「改之前的值」必须在这里定格，不能等到 onCommit——那时 f.value 早就是新值了，
          再读「改之前」读到的是改之后。（这一条与已回退的旋钮层踩的是同一个坑，
          当时的注释一起留了下来。）定格在**字段对象上**而不是一个模块变量上：
          共用一个变量的话，A 滑块挂载时定格了 A 的值，接着拖 B，B 的撤销会把 A 的值写进 B。
        */
        if (f._from === undefined) f._from = f.value;
        f.value = v;
        paintStage();
      },
      onCommit: (v) => {
        if (!f) return;
        if (f.presetValue === undefined) f.presetValue = v;
        /*
          ── 这一条原先只调 `touch()`，于是数值字段改动**既不进撤销栈、也不标脏** ──

          `touch()` 只负责让页头那枚「草稿已存」转一下圈；真正做两件事的是 `toast()`
          （`markDraftDirty()` + 压撤销栈，见 shell.js）。所以实测：拖任意一个数值滑块，
          值变了、舞台跟着变了，而作用域条**一直停在「已应用到桌面」**、「应用到桌面」
          按钮不出现、⌘Z 也撤不回来。

          而同一个文件里 select 字段那条路径是 `toast(…, undo)` ——**页面自己的约定是对的，
          只有滑块这一条漏了**。而滑块恰好是全应用最高频的那类改动：
          裁决 1 的第 2 层（草稿 → 运行时需要一次显式动作）对它整个失效。
        */
        const before = f._from === undefined ? f.value : f._from;
        delete f._from;
        f.src = 'custom';
        afterConfigChange();
        if (before === v) return;   // 按下又原样放回：不产生记录
        const undo = () => { f.value = before; afterConfigChange(); return () => { f.value = v; afterConfigChange(); return undo; }; };
        toast(`「${c.name} · ${label}」已改为 ${v}`, undo);
      },
    });
  });
}

function bindCardEvents() {
  mountCardControls();
  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.toggle);
    const before = { on: !!c.on, links: CH.map((x) => ({ id: x.id, ref: x.ref, off: x.off })) };
    // 必须在翻转开关**之前**固化链接：之后再算 startOf 会走「目标已关闭」的降级
    // 路径，固化下来的是 off 而不是原本的绝对位置，色块会跳到时间轴开头。
    const broken = c.on ? breakLinksTo(c.key) : [];
    c.on = !c.on;
    const act = ACTIONS.find((a) => a.id === actionId);
    act.enabled = CARDS.filter((x) => !x.always && x.on).length;
    renderCards(); renderActions(); renderOutputs(); renderTimeline();
    const after = { on: c.on, links: CH.map((x) => ({ id: x.id, ref: x.ref, off: x.off })) };
    const apply = (snap) => {
      c.on = snap.on;
      snap.links.forEach((l) => { const ch = CH.find((x) => x.id === l.id); if (ch) { ch.ref = l.ref; ch.off = l.off; } });
      act.enabled = CARDS.filter((x) => !x.always && x.on).length;
      renderCards(); renderActions(); renderOutputs(); renderTimeline();
    };
    // 撤销函数返回重做函数，⌘⇧Z 才有东西可用
    const restore = () => { apply(before); return () => { apply(after); return restore; }; };
    toast(`${c.on ? '已启用' : '已关闭'}「${c.name}」`
      + (broken.length ? ` · ${broken.join('、')}的链接已固化为绝对时间` : ''), restore);
  }));
  document.querySelectorAll('[data-more]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.more);
    c.more = !c.more;
    renderCards();
  }));
  document.querySelectorAll('[data-represet]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.represet);
    const before = (c.fields || []).map((f) => ({ f, v: f.value, src: f.src }));
    (c.fields || []).forEach((f) => {
      if ((f.src === 'custom' || f.src === 'ai') && f.presetValue !== undefined) { f.value = f.presetValue; f.src = 'preset'; }
    });
    afterConfigChange();
    const undo = () => { before.forEach(({ f, v, src }) => { f.value = v; f.src = src; }); afterConfigChange(); return () => { document.querySelector(`[data-represet="${c.key}"]`)?.click(); return undo; }; };
    toast(`「${c.name}」已回到预设 ${c.preset}`, undo);
  }));
  document.querySelectorAll('[data-revert]').forEach((el) => el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const [key, label] = el.dataset.revert.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    if (f.presetValue === undefined) return;
    const before = { v: f.value, src: f.src };
    f.value = f.presetValue; f.src = 'preset';
    afterConfigChange();
    toast(`「${label}」已回到预设值 ${f.presetValue}`, () => { f.value = before.v; f.src = before.src; afterConfigChange(); });
  }));
  document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
    const [key, p] = b.dataset.preset.split('|');
    const c = CARDS.find((x) => x.key === key);
    const before = c.preset;
    // 撤销要能恢复**值**，不只是标签——所以整份字段快照
    const snap = (c.fields || []).map((f) => ({ f, v: f.value, pv: f.presetValue, src: f.src }));
    c.preset = p;
    applyPreset(c, p);
    afterConfigChange();
    const restore = () => { c.preset = before; snap.forEach(({ f, v, pv, src }) => { f.value = v; f.presetValue = pv; f.src = src; }); afterConfigChange(); };
    const undo = () => { restore(); return () => { c.preset = p; applyPreset(c, p); afterConfigChange(); return undo; }; };
    toast(`「${c.name}」已套用预设 ${p}`, undo);
  }));
  // 按 label 定位，不再按 `type === 'color'` 取第一个：飘字展开「渐变」分组后
  // 会有三个颜色字段，按 type 取会永远改到第一个（「打开一个分组把另一个控件改坏」
  // 这类缺陷完全没有视觉痕迹）。
  // 撤销 / toast / afterConfigChange 仍然留在这一页——共享层只管控件的行为，
  // 「改一个字段等于一次可撤销的事务」是这一页的模型，不是控件的职责。
  document.querySelectorAll('[data-colorfield]:not([data-mounted])').forEach((el) => {
    el.dataset.mounted = '1';
    const [key, label] = el.dataset.colorfield.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c && c.fields.find((x) => x.label === label);
    if (!f) return;
    Ctl.colorField(el, {
      compact: true,
      value: f.value,
      onChange: (color) => {
        if (f.value === color) return;
        const before = f.value; const beforeSrc = f.src;
        f.value = color; f.src = 'custom';
        c.tweaked = true;
        afterConfigChange();
        const undo = () => {
          f.value = before; f.src = beforeSrc; afterConfigChange();
          return () => { f.value = color; f.src = 'custom'; afterConfigChange(); return undo; };
        };
        toast(`「${c.name} · ${label}」已改为 ${color}`, undo);
      },
    });
  });

  document.querySelectorAll('[data-fieldtoggle]').forEach((b) => b.addEventListener('click', () => {
    const [key, label] = b.dataset.fieldtoggle.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    const before = f.value;
    f.value = !f.value; f.src = 'custom'; c.tweaked = true;
    afterConfigChange();
    const undo = () => {
      f.value = before; afterConfigChange();
      return () => { f.value = !before; afterConfigChange(); return undo; };
    };
    toast(`「${c.name} · ${label}」已${f.value ? '开启' : '关闭'}`, undo);
  }));

  // 文本字段的提交语义与 Ctl.number 一致：change 才落、Esc 放弃、空串放弃。
  document.querySelectorAll('[data-text]:not([data-mounted])').forEach((el) => {
    el.dataset.mounted = '1';
    const [key, label] = el.dataset.text.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c && c.fields.find((x) => x.label === label);
    if (!f) return;
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { el.value = f.value; el.blur(); }
      if (e.key === 'Enter') el.blur();
    });
    el.addEventListener('change', () => {
      const v = el.value;
      // 空串视为放弃编辑保持原值——不能静默把文案清空
      // （同 NumberField 那个「全选删掉再改主意」的陷阱）
      if (!v.length) { el.value = f.value; return; }
      if (v === f.value) return;
      const before = f.value; const beforeSrc = f.src;
      f.value = v; f.src = 'custom'; c.tweaked = true;
      afterConfigChange();
      const undo = () => {
        f.value = before; f.src = beforeSrc; afterConfigChange();
        return () => { f.value = v; f.src = 'custom'; afterConfigChange(); return undo; };
      };
      toast(`「${c.name} · ${label}」已改为「${v}」`, undo);
    });
  });
}

// ── 输出标签
/*
  ══ 效果类型的分类色：唯一映射源（DECISIONS.md 裁决 11）══════════════

  为什么必须有：`.tl-bar` 原先全是 `border-slate-300 bg-white`，
  于是时间轴上**五条轨长得完全一样**，通道身份只能靠 132px 的文字标签串行读。
  而时间轴的首要工作恰恰是「一眼看出谁在什么时候出现」——
  整个 97KB 的 `01` 里只有 1 个 `bg-sky-400`、1 个 `bg-amber-50`。

function presetSample(cardKey, presetName) {
  const v = (PRESET_VALUES[cardKey] || {})[presetName];
  if (!v) return '';
  const tone = toneOf(cardKey).dot.replace('bg-', 'text-');   // 与分类色同源
  const box = (inner) => `<svg viewBox="0 0 28 16" class="pointer-events-none mr-1 h-4 w-7 shrink-0 ${tone}" aria-hidden="true">${inner}</svg>`;

  }

    // 数量 → 点数（封顶 9 个）；扩散半径 → 半径；大小 → 点半径；重力 → 整体下坠
    const n = Math.max(3, Math.min(9, Math.round(v.数量 / 3)));

    const r = Math.max(0.6, Math.min(2, v.大小 / 5));
    const dy = (v.重力 / 10) * 2.5;
    return box(Array.from({ length: n }, (_, i) => {
      const a = (Math.PI * 2 * i) / n + 0.3;
      return `<circle cx="${(14 + Math.cos(a) * R).toFixed(1)}" cy="${(8 + Math.sin(a) * R * 0.8 + dy).toFixed(1)}" r="${r.toFixed(1)}" fill="currentColor"/>`;
    }).join(''));

    // 最大半径 → 外环半径；线宽 → 描边粗细；不透明度 → 环的透明度
    const R = 2.5 + (v.最大半径 / 220) * 5;
    return box(`<circle cx="14" cy="8" r="${R.toFixed(1)}" fill="none" stroke="currentColor" stroke-width="${Math.max(0.7, v.线宽 * 0.55).toFixed(1)}" opacity="${(v.不透明度 / 100).toFixed(2)}"/>

/** 生成某个主题的完整编辑状态。桶之间不共享任何对象。 */

  for (const [key, patch] of Object.entries(seed.cards || {})) {
    const c = cards.find((x) => x.key === key);

// ── 舞台：一帧 = 时间的纯函数，所以拖播放头能精确定格

// 而这份稿子开篇承诺的就是「参数与真实运行时对齐」。
// 原先波纹画 *104、粒子画 *88、飘字上浮 *54，卡片上写的却是 120 / 96 / 64，

  文案是用户输入，而 renderFrame 走 innerHTML 拼串。
  不转义的话输入一个 `<` 就会把舞台的 HTML 结构撑坏——表现成「打了个字效果就没了」，

/*
  ══ 连打：让节流 / 连击窗 / 错峰 / 预算水位真的互相打起来 ══════════════

  为什么必须有这一档：单次事件下这四个值**互不相干**，所以调它们看不出任何区别——
  而稿子把「节流 60ms · 连击窗 900ms」摆在触发轨上、还专门为它们补了拖拽入口。
  一个只能演示单次事件的预览，验证不了它们中的任何一个。

  脚本是**固定的**（不是随机）：8 次点击、间隔 90ms，位置沿一条斜线走。
  固定才能对比——改了节流之后再连打一次，两次的丢弃数可以直接比。

  三件事在这里第一次同时可见：
    · 节流：间隔 90ms 而节流 60ms → 都放行；把节流拖到 120ms → 一半被丢
    · 连击窗：900ms 内的点击算同一串，所以 8 次都在窗内
    · 预算：同显数超过上限时多出来的**丢掉而不是排队**（排队会让手感变黏）
  用 setTimeout 而不是 rAF：rAF 在面板不合成时不触发，那条自动路径踩过一次。
*/
// 与 07「舒适度」的粒子密度上限、05 的预算水位是同一个数。
// 声明放在使用它的函数**之前**——这是本轮第三次为声明顺序付代价（教训 #7）。
const BUDGET_MAX = 48;
// 实测（改脚本间隔验的）：间隔 90ms vs 节流 60ms → 丢 0 次；
// 把间隔临时改成 40ms → **8 次里丢 4 次**。所以这一档确实在验证节流，不是装饰。
// 默认留 90ms：它对应「正常连点」，让用户把节流拖宽才看到丢弃，因果更清楚。
const BURST_SCRIPT = Array.from({ length: 8 }, (_, i) => ({ at: i * 90, x: 0.28 + i * 0.055, y: 0.62 - i * 0.03 }));
let burstTimers = [];
let burstDropped = 0;
let burstLastAt = -1e9;

let burstSampler = null;
function stopBurst() {
  // 清理排在任何早退之前（同门禁 interval-cleanup-after-early-return 的要求）
  if (burstSampler) { clearInterval(burstSampler); burstSampler = null; }
  burstTimers.forEach(clearTimeout);
  burstTimers = [];
  $('burstBtn').className = 'btn-outline h-7 px-2.5 text-xs';
  $('budgetHud').classList.add('hidden');
}

function runBurst() {
  // 清理写在函数**第一行**：既是可重入安全（连点两次「连打」不留孤儿定时器），
  // 也满足门禁 interval-cleanup-after-early-return——它按整函数文本扫描
  // 「第一个 return 之前有没有 clearInterval」，不区分嵌套作用域。
  // 规则比必要更严，但这个方向的严是对的：`09` 的「直到重启」正是靠
  // 「清理排在早退之后」自己解除的。
  if (burstSampler) { clearInterval(burstSampler); burstSampler = null; }
  stopBurst();
  burstDropped = 0; burstLastAt = -1e9;
  $('burstBtn').className = 'btn-default h-7 px-2.5 text-xs';
  $('budgetHud').classList.remove('hidden');
  $('stageHint').classList.add('hidden');
  $('budgetMax').textContent = String(BUDGET_MAX);
  /*
    采样器在**进入循环之前**建立、并立刻记进 burstSampler。

    先写的版本把它放在循环之后，于是门禁 interval-cleanup-after-early-return 报了出来：
    循环体里有一条早退（节流丢弃那个 return），清理却排在它后面。
    虽然那个 return 退出的是内层回调而不是 runBurst 本身，但**规则收得比我严是对的**——
    `09` 的「直到重启」正是靠这种「清理排在早退之后」的形态自己解除的。
    提前建立之后，这个函数里不再有任何 return 排在清理之前。
  */
  let peak = 0;
  const sampler = setInterval(() => {
    peak = Math.max(peak, $('fxHost').children.length);
    $('budgetNow').textContent = String(Math.min(BUDGET_MAX, peak));
  }, 40);
  burstSampler = sampler;

  for (const step of BURST_SCRIPT) {
    burstTimers.push(setTimeout(() => {
      // 节流：距上一次放行不足 TRIGGER.throttle 就丢掉。这一条原先无处可验。
      if (step.at - burstLastAt < TRIGGER.throttle) {
        burstDropped += 1;
        $('budgetDrop').textContent = String(burstDropped);
        return;
      }
      burstLastAt = step.at;
      origin = { x: step.x, y: step.y };
      t = 0; setPlaying(true);
    }, step.at));
  }
  /*
    同显数要**采样峰值**，不能在点击那一刻读。

    第一版就是在 setPlaying(true) 之后立刻读 `#fxHost.children.length`——
    那一刻 t=0，一个粒子都还没画出来，于是 HUD 恒显示 1。
    **一个读数写着「同显」而实际测的是别的东西，比没有这个读数更糟**
    （这轮走查删掉的正是这类东西）。

    还要说明这一档的**真实边界**：舞台只有一个播放头，每次点击是重启它而不是
    叠加一个独立实例。所以这里的「同显」= 单次事件在峰值时刻的效果元素数
    （粒子 + 波纹 + 飘字），它对得上 07 的「粒子密度上限」与 05 的预算水位，
    但**不代表多次事件叠加**。多实例叠加需要运行时支持，稿子里不假装有。
  */
  burstTimers.push(setTimeout(() => {
    clearInterval(sampler); burstSampler = null;
    $('budgetNow').textContent = String(Math.min(BUDGET_MAX, peak));
    $('burstBtn').className = 'btn-outline h-7 px-2.5 text-xs';
    toast(`连打 ${BURST_SCRIPT.length} 次 · 峰值同显 ${peak} · 节流丢弃 ${burstDropped} 次（节流 ${TRIGGER.throttle}ms）`);
  }, BURST_SCRIPT[BURST_SCRIPT.length - 1].at + 900));
}
$('burstBtn').addEventListener('click', () => { if (burstTimers.length) stopBurst(); else runBurst(); });
$('abBtn').addEventListener('pointerdown', () => { ab = true; $('abBadge').classList.remove('hidden'); paintStage(); });
// 松手后让下一轮改动重新定格参照：这样 A/B 永远是「和我这一波动手之前比」，
// 而不是和十几轮前的出厂默认比。
window.addEventListener('pointerup', () => { if (ab) { ab = false; S.beforeDirty = false; $('abBadge').classList.add('hidden'); paintStage(); } });
$('copyRhythm').addEventListener('click', () => toast('已把这套时间关系复制到「右键单击」「长按」'));
/*
  触发区域是**桌面语义**的屏幕区域（整屏 / 中心区域 / 边缘），不是 DOM 语义。
  （README 已记：`matchesTriggerZone` 里那六种内容型区域在桌面端 target 恒为
  undefined，四种恒 false、一种恒 true——所以桌面端只能用屏幕区域。）

  它原先是一个纯下拉：选了「中心区域」之后在舞台角落点一下，效果照旧出来。
  一个**门控字段却不门控任何东西**，等于告诉用户这个设置无效。
  现在真的判定，并且拦下时明确说出来——这也正是 `05` 那条「40 次里 11 次
  被区域过滤」的来源，两页对上了同一件事。
*/
// 声明放在使用它的 handler **之前**：教训 #7 那族 TDZ 缺陷全都是
// 「声明写在后面、看起来没事」——症状是页面渲染正常、交互从那一行起全死。
let zoneMissTimer = null;
function inTriggerZone(nx, ny) {
  const zone = cardStr('trigger', '触发区域', '整屏');
  if (zone === '中心区域') return nx > 0.25 && nx < 0.75 && ny > 0.25 && ny < 0.75;
  if (zone === '边缘') return nx < 0.2 || nx > 0.8 || ny < 0.2 || ny > 0.8;
  return true;
}
$('stage').addEventListener('click', (e) => {
  const r = $('stage').getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  if (!inTriggerZone(nx, ny)) {
    // 拦下要给理由。「静默不出效果」是这类功能最差的失败方式。
    $('stageHint').classList.add('hidden');
    $('zoneMiss').classList.remove('hidden');
    clearTimeout(zoneMissTimer);
    zoneMissTimer = setTimeout(() => $('zoneMiss').classList.add('hidden'), 1600);
    return;
  }
  $('zoneMiss').classList.add('hidden');
  origin = { x: nx, y: ny };
  $('stageHint').classList.add('hidden');
  t = loopOn ? loopIn : 0; setPlaying(true);
});
// 底色只切换「底色类」，绝不重建整串 className。
// 舞台的高度来自 min-h-0 flex-1（它就是这样撑到 ~300px 的）；
// 原先这里把 className 重写成含 h-[212px] 的字面量，一点底色就把 flex 尺寸冲掉、
// 舞台缩回 212px 且不可逆——而 212px 正是时间轴改成底部抽屉要消除的那个数。
const STAGE_BGS = {
  light: 'bg-white', dark: 'bg-slate-900', checker: 'checker',
  finder: 'ctx-finder', browser: 'ctx-browser', deck: 'ctx-deck',
};
document.querySelectorAll('[data-bg]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-bg]').forEach((x) => {
    const on = x === b;
    // 只增删状态类，不重建 className：重建会把 role/aria 之外的类一起冲掉，
    // 而这正是门禁 classname-rebuild-with-layout 在防的反模式（本轮已在 setSidebar 撞过一次）
    x.classList.toggle('seg-item-on', on);
    x.setAttribute('aria-checked', String(on));
  });
  const stage = $('stage');
  stage.classList.remove(...Object.values(STAGE_BGS));
  stage.classList.add(STAGE_BGS[b.dataset.bg]);
}));

// ── 时间轴
function laneW() { const l = document.querySelector('[data-lane]'); return l ? l.clientWidth : 360; }
function areaPath(curve, w, h) {
  const f = easeOf(curve);
  const pts = Array.from({ length: 16 }, (_, i) => { const x = i / 15; return `${(x * w).toFixed(2)},${(h - f(x) * h).toFixed(2)}`; });
  return `M0,${h} L${pts.join(' L')} L${w},${h} Z`;
}
// 循环区间必须跟着总长收缩，否则关掉最长的通道后区间会落在总长之外、播放卡死
function clampLoop() {
  const T = totalMs();
  loopOut = Math.min(loopOut, T);
  loopIn = Math.max(0, Math.min(loopIn, loopOut - 40));
  // 兜底只在区间真的塌掉时才把它钉到尾部。**不能**用它来产生初始区间：
  // clampLoop 每次 renderTimeline 都跑，而 loopIn/loopOut 初值都是 0，
  // 于是首次渲染就落进这个分支、把区间钉在 [T-40, T]——一点「循环区间」
  // 看到的是标尺末尾 2.8% 的一条缝（实测 left:97.2% / width:2.78%），像坏了。
  // 有意义的初始区间由 loopBtn 在开启时现算（见 defaultLoopRange）。
  if (loopOut - loopIn < 40) { loopIn = Math.max(0, T - 40); loopOut = T; }
}
/**
 * 开启「循环区间」时的初始区间：优先取当前选中通道的跨度——
 * 用户开循环几乎总是为了反复看**某一个**效果，而不是看整条。
 * 没有选中通道时退回全长。
 */
function defaultLoopRange() {
  const T = totalMs();
  const ch = CH.find((x) => x.id === selCh && cardOn(x.id));
  if (!ch) return [0, T];
  const s = startOf(ch);
  const e = s + ch.dur + (ch.repeat ? cardVal('particle', '数量', ch.repeat.n) * staggerOf(ch) : 0);
  return [Math.max(0, Math.floor(s)), Math.min(T, Math.max(s + 40, Math.ceil(e)))];
}
function renderTimeline() {
  clampPlayhead();   // 总长可能刚变小（关轨、改时长、拖连击窗），别把播放头留在标尺外
  clampLoop();
  const T = totalMs();
  $('totalLabel').textContent = T; $('timeTotal').textContent = T;
  $('tlInner').style.width = zoom === 1 ? '100%' : `${zoom * 100}%`;
  const step = T > 1400 ? 200 : 100;
  const ticks = []; for (let ms = 0; ms <= T; ms += step) ticks.push(ms);

  $('ruler').innerHTML =
    (loopOn ? `<div class="loop-band" style="left:${(loopIn / T) * 100}%;width:${((loopOut - loopIn) / T) * 100}%"></div>
       <div class="loop-h" data-loop="in" style="left:${(loopIn / T) * 100}%"></div>
       <div class="loop-h" data-loop="out" style="left:${(loopOut / T) * 100}%"></div>` : '')
    + ticks.map((ms) => `<div class="absolute bottom-0 flex flex-col items-center" style="left:${(ms / T) * 100}%;transform:translateX(${ms === 0 ? '0' : ms === T ? '-100%' : '-50%'})">
        <span class="h-2.5 w-px bg-slate-400"></span>
        <span class="mt-0.5 text-2xs leading-none tabular-nums text-slate-500">${ms}</span></div>`).join('')
    + ticks.slice(0, -1).map((ms) => `<div class="absolute bottom-0 h-1.5 w-px bg-slate-300/70" style="left:${((ms + step / 2) / T) * 100}%"></div>`).join('');

  const pct = (ms) => (ms / T) * 100;
  // 触发轨：节流窗 / 连击窗 / 事件点，与效果同一把标尺
  let html = `<div class="tl-row group">
      <div class="flex items-center gap-1.5">
        <span class="size-1.5 shrink-0 rounded-full bg-slate-900"></span>
        <span class="truncate text-xs font-semibold text-slate-700">触发</span>
      </div>
      <!--
        触发轨原先是**只读**的：两个窗只是色带、右侧一行静态文字，整条轨 interactive=0。
        而卡片上的「节流间隔」「连击窗口」已按决策 #9 删掉了——于是这两个值哪儿都改不了，
        其中「连击窗口」在真实代码里是个 120–3000ms 的滑块（TextFeedbackCard.tsx）。
        README 说过「方向做反了：时间轴在显示，卡片在编辑」，上一轮只删了卡片那一半。
        现在两个窗的右边缘可拖，兑现「触发的节流窗 / 连击窗和效果放在同一把标尺上」。
      -->
      <!--
        data-lane-id="trigger" 不是可选的：CARD_TO_CHANNEL.trigger 就是 'trigger'，
        而这条轨原先**只有 data-lane 没有 data-lane-id**（只有 CH 循环里的效果轨有）。
        于是触发行为卡上那枚时间 chip 点下去，revealTrack('trigger') 查不到轨，
        回落到兜底的 getElementById('drawer')，把 898×189 的**整个抽屉**高亮一遍。
        而节流 / 连击窗恰好是上一轮刚补上拖拽入口的两个值——卡片指向它们的唯一入口指错了。

        注意：这段注释在 JS 模板字符串内部，所以正文里不能出现反引号——
        我写这段时就踩了一次，反引号当场终止模板字符串、整段脚本语法错误，
        由门禁 inline-script-syntax 拦下（README 教训的同一形态，第 N 次）。
      -->
      <div class="tl-lane" data-lane data-lane-id="trigger">
        <div class="win-combo" style="left:0;width:${pct(TRIGGER.comboWindow)}%">
          <span class="absolute inset-y-0 right-0 w-1.5 cursor-col-resize" data-trigwin="comboWindow" title="拖动改连击窗"></span>
        </div>
        <div class="win-throttle" style="left:0;width:${pct(TRIGGER.throttle)}%">
          <span class="absolute inset-y-0 right-0 w-1.5 cursor-col-resize" data-trigwin="throttle" title="拖动改节流间隔"></span>
        </div>
        <span class="ev-dot" style="left:0"></span>
        <span class="ev-dot opacity-40" style="left:${pct(TRIGGER.secondClick)}%"></span>
        <span class="pointer-events-none absolute right-1.5 top-1/2 -translate-y-1/2 text-xs text-slate-500">节流 ${TRIGGER.throttle}ms · 连击窗 ${TRIGGER.comboWindow}ms<span class="ml-1 text-slate-300">· 拖窗右缘可改</span></span>
      </div>
    </div>`;

  for (const ch of chLanes()) {
    const s = startOf(ch);
    const linked = ch.ref !== 'trigger';
    const sel = selCh === ch.id;
    const soloedAny = CH.some((c) => c.solo && cardOn(c.id));
    const muted = ch.mute || (soloedAny && !ch.solo);
    const dirty = isChDirty(ch);   // 覆盖偏移 / 时长 / 曲线 / 错峰，与「重置为默认」同一份定义
    const wPct = Math.max(1.4, pct(ch.dur));
    html += `<div class="tl-row group" data-row="${ch.id}">
      <div class="flex items-center gap-1">
        <button class="grid size-4 shrink-0 place-items-center rounded text-slate-500 hover:text-slate-700" data-expand="${ch.id}" aria-label="展开属性轨">
          <svg class="size-3 transition-transform ${sel ? 'rotate-90' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <span class="size-1.5 shrink-0 rounded-full ${muted ? 'bg-slate-300' : toneOf(ch.id).dot}" aria-hidden="true"></span>
        <span class="truncate text-xs font-medium ${muted ? 'text-slate-500' : sel ? 'text-slate-900' : 'text-slate-600'}">${ch.label}</span>
        ${linked ? '<span class="shrink-0 text-2xs text-slate-500" title="已链接到锚点">⛓</span>' : ''}
        <span class="ml-auto flex shrink-0 items-center gap-0.5">
          ${dirty ? `<button class="tl-iconbtn" aria-pressed="false" data-reset-ch="${ch.id}" title="重置为默认">×</button>` : ''}
          <button class="tl-iconbtn ${ch.solo ? 'tl-iconbtn-on' : ''}" aria-pressed="${!!ch.solo}" data-solo="${ch.id}" title="独奏：只播这一条">S</button>
          <button class="tl-iconbtn ${ch.mute ? 'tl-iconbtn-on' : ''}" aria-pressed="${!!ch.mute}" data-mute="${ch.id}" title="静音：排除这一条">M</button>
        </span>
      </div>
      <div class="tl-lane" data-lane data-lane-id="${ch.id}">
        ${ticks.map((ms) => `<div class="pointer-events-none absolute inset-y-0 w-px bg-slate-200/60" style="left:${pct(ms)}%"></div>`).join('')}
        ${linked ? `<div class="link-line" style="left:${pct(startOf(CH.find((x) => x.id === ch.ref.split('.')[0])) + CH.find((x) => x.id === ch.ref.split('.')[0]).dur * anchorAt(CH.find((x) => x.id === ch.ref.split('.')[0]), ch.ref.split('.')[1]))}%;width:${Math.max(0, pct(ch.off))}%;top:2px"></div>
             <span class="link-chip" style="left:${pct(s)}%;top:2px">${ch.off === 0 ? '⛓' : (ch.off > 0 ? '+' : '') + ch.off}</span>` : ''}
        <div class="tl-bar ${muted ? 'tl-bar-muted' : toneOf(ch.id).bar} ${sel ? 'tl-bar-on' : ''}" data-bar="${ch.id}" style="left:${pct(s)}%;width:${wPct}%">
          <svg class="pointer-events-none absolute inset-0 size-full" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
            <path d="${areaPath(ch.curves[ch.main] || [0, 0, 1, 1], 100, 20)}" fill="#0f172a" fill-opacity="0.07"/>
          </svg>
          ${ch.repeat ? Array.from({ length: cardVal('particle', '数量', ch.repeat.n) }, (_, i) => {
            const off = (i * ch.repeat.stagger / ch.dur) * 100;
            return off > 98 ? '' : `<span class="pointer-events-none absolute inset-y-0.5 w-px bg-slate-900/15" style="left:${off}%"></span>`;
          }).join('') : ''}
          ${wPct > 16 ? `<span class="pointer-events-none absolute inset-y-0 right-1 flex items-center text-xs font-semibold tabular-nums text-slate-500">${ch.dur}ms</span>` : ''}
          ${ch.anchors.map(([name, at]) => `<span class="anc ${name === 'peak' || name === 'spread' ? 'anc-peak' : ''}" data-anc="${ch.id}.${name}" style="left:${at * 100}%" title="${name}"></span>`).join('')}
          <span class="absolute inset-y-0 left-0 w-1.5 cursor-col-resize" data-edge="l" data-edge-id="${ch.id}"></span>
          <span class="absolute inset-y-0 right-0 w-1.5 cursor-col-resize" data-edge="r" data-edge-id="${ch.id}"></span>
        </div>
      </div>
    </div>`;
  }
  $('lanes').innerHTML = `<div id="playhead" class="pointer-events-none absolute -top-1 bottom-0 z-20 w-px bg-slate-900" style="left:0px">
      <span class="absolute -top-0.5 left-1 rounded bg-slate-900 px-1 py-0.5 text-xs font-semibold tabular-nums text-white">0ms</span></div>` + html;
  bindTimeline();
  renderInspector();
  paintStage();
}

function msFromX(clientX) {
  const l = document.querySelector('[data-lane]');
  const r = l.getBoundingClientRect();
  return Math.max(0, Math.min(totalMs(), ((clientX - r.left) / r.width) * totalMs()));
}
const q = (ms, alt) => (!snap || alt ? Math.round(ms) : Math.round(ms / snap) * snap);

// 拖色块时找最近的「别人的锚点」，命中就建立链接
function nearestAnchor(ch, absStart) {

      main = 动作页签 + #cols + #drawer
      #cols 里预览列 = 预览页头 + 舞台容器 + 传输控件行 + 本次输出行

  所以：drawerBody_max = main − 动作页签 − 抽屉标题行 − 预览列非舞台部分 − stageMin

  每一项都现量。传输控件行折行时它自己会变高，等式跟着变，不需要有人记得改常量。
*/
function chromeH() {
  const H = (el) => (el ? el.getBoundingClientRect().height : 0);
  const st = $('stage');
  const holder = st.parentElement;            // 舞台的外层容器（带 px-4 pt-3）
  const section = holder.parentElement;       // 预览列
  const main = $('main');

  // 动作页签 = #main 里 #cols 之前的兄弟
  let tabs = 0;
  for (const el of main.children) { if (el === $('cols') || el === $('drawer')) break; tabs += H(el); }

  // 预览列里除「舞台容器」以外的部分
  let sideBands = 0;
  for (const el of section.children) { if (el !== holder) sideBands += H(el); }

  const holderPad = Math.max(0, H(holder) - H(st));           // 容器内边距
  const drawerChrome = H($('drawer')) - H($('drawerBody'));   // 抽屉标题行 + grip
  return tabs + sideBands + holderPad + drawerChrome;
}
function drawerMaxH() {
  const avail = $('main').getBoundingClientRect().height;
  return Math.max(120, Math.min(460, avail - chromeH() - stageMin().h));
}
const effectiveDrawerH = () => Math.max(120, Math.min(drawerH, drawerMaxH()));

/*
  兜底不变量：算完之后**真的量一遍**舞台有没有压到传输控件行上。

  为什么需要它：`chromeH()` 是实测的，但它是在**上一帧的布局**上量的——
  改了抽屉高度之后传输控件行可能刚好折行/收行，于是预算又变了。
  一次性算出来的预算永远会有这种一帧滞后。

  判据是最终结果而不是中间量：`stage.bottom <= transportRow.top`。
  不成立就继续压抽屉；压到 120 下限仍不成立，说明这个窗口高度装不下三者，
  改成让预览列整体纵滚——**而不是让 min-height 溢出去盖住兄弟节点**。
  「装不下」要变成「能滚」，不能变成「看不见也点不到」（教训 #16 的另一面）。
*/
function enforceStageInvariant(canSqueezeDrawer = true) {
  const st = $('stage');
  const holder = st.parentElement;
  const section = holder.parentElement;
  /*
    判据是**分给舞台的空间够不够它的最小尺寸**，不是「舞台的 rect 有没有压到控件行的 rect」。

    第一版写的是后者，而传输控件行是 `sticky bottom-0`——贴住之后它的 rect 是
    「视口里的位置」而不是「布局里的位置」，于是只要预览列一滚，rect 判据就恒为
    「有重叠」，把 overflowY 永久钉在 auto 上。**sticky 元素的 rect 不能用来做布局判据。**
    改量 `holder.clientHeight` 与 `stageMin().h` 的差：这就是「舞台被压瘦了多少」本身。
  */
  const deficit = () => Math.ceil(stageMin().h - holder.clientHeight);
  for (let guard = 0; canSqueezeDrawer && guard < 12; guard += 1) {
    const d = deficit();
    if (d <= 0) break;
    const cur = parseFloat($('drawerBody').style.height) || effectiveDrawerH();
    if (cur - d < 120) break;
    $('drawerBody').style.height = (cur - d) + 'px';
  }
  syncPreviewScroll();
}

/*
  ── 纵滚兜底的开关，单独一个函数，由 ResizeObserver 驱动 ────────────────

  抽屉压到下限仍装不下 → 预览列整体纵滚（配合控件行 sticky，滚动时控件不会被推走）。
  用内联样式而不是切 class：`overflow-hidden` 与 `overflow-y-auto` 是同一层工具类，
  同时出现时谁生效取决于 CSS 里的先后而不是我加的顺序（教训 #22 的同型）。

  **为什么必须由 ResizeObserver 驱动，而不是在每个改布局的地方各调一次**：
  这个判据依赖「舞台分到多少高度」，而那个高度会因为好几个互不相干的原因变——
  抽屉开合、窗口尺寸档切换、列宽拖拽、卡片开关改变 stageMin()。
  逐个挂钩子的做法我试过两版，两版都漏：
    · 只在 `drawerOpen` 时调 → 在最窄档展开再折叠，`overflowY` 永久留在 auto
    · 补了 `transitionend` → 只在高度**真的动了**时才补救；
      「抽屉一直关着、只切窗口档」这条路径不产生 height 过渡，于是切回宽档之后
      deficit 已经是 -90（富余 90px）而预览列还在滚
  观察高度本身，这一整类「量早了 / 没人调」就都不存在了。
*/
function syncPreviewScroll() {
  const holder = $('stage').parentElement;
  holder.parentElement.style.overflowY = stageMin().h - holder.clientHeight > 0 ? 'auto' : 'hidden';
}
/*
  ResizeObserver 是**冗余的第二道**，不是唯一那道。

  它是最直接的表达（观察高度本身，不管高度为什么变），在真实窗口里也确实有效；
  但走查环境的浏览器面板会把渲染生命周期节流掉，实测 `observe()` 之后
  连那次必然发生的初始回调都没到（fired=0，而 clientHeight 明明从 330 变成了 102）。
  所以正确性挂在 `recomputeLayout` 的 setTimeout 上，这条只负责兜住
  「高度因为我没想到的原因变了」——两者都只写 overflowY，重复执行无副作用。
*/
if (typeof ResizeObserver === 'function') {
  // 只读高度、只写 overflowY，不改任何参与布局的尺寸——所以不会和自己形成反馈环
  new ResizeObserver(() => syncPreviewScroll()).observe($('stage').parentElement);
}

/**
 * 窄窗口下抽屉默认折叠。
 *
 * 纵向预算算给你看：真实默认窗口 960×680 的主区只有 596px，而
 * 动作页签 56 + 舞台最小 240 + 预览工具条与输出行 ~120 + 抽屉 140 = 556，
 * 只剩 40px 给配置卡列——**三者不可能同时展开**。
 * 折叠抽屉是唯一不牺牲正确性的取舍：README 已经为折叠态设计了标题行摘要
 * （N 条轨道 · N 条已链接 · 播放头 xxx ms），所以收起来不丢上下文；
 * 而用户要调时间时展开它，此时舞台按 drawerMaxH 让出高度。这正是「抽屉」这个形态存在的理由。
 *
 * 只在**首次布局**时决定，之后尊重用户的展开/折叠意图——
 * 否则每次改窗口大小都把用户刚展开的抽屉再收起来，是 README 说的「联动必须双向」的反面。
 */
let drawerAutoDecided = false;
function autoCollapseDrawerIfTight() {
  if (drawerAutoDecided) return;
  const win = $('drawerBody').closest('#mockWindow');
  if (!win || !win.getBoundingClientRect().height) return;
  drawerAutoDecided = true;
  if (drawerMaxH() <= 150) drawerOpen = false;
}
function syncDrawer() {
  autoCollapseDrawerIfTight();
  const body = $('drawerBody');
  body.classList.toggle('hidden', !drawerOpen);
  const st = $('stage');
  const min = stageMin();
  st.style.minHeight = min.h + 'px';
  st.style.minWidth = min.w + 'px';
  /*
    ── 抽屉打开时让出「本次输出」行 ──

    纵向账实测（960×680）：外壳 265 + 舞台最小 240 + 有意义的时间轴 120 = 625，
    而主区只有 596。**差 29px，这不是能靠削像素解决的**——README 已经为 720×480
    得出同类结论（可用下限 ≈ 660px 高），960×680 在「舞台与时间轴同时展开」这个
    场景下同样偏矮，真实下限约 710px。

    所以要让出一整条带，而唯一**有理由**让出的是「本次输出」行：
    抽屉打开时它是**纯冗余**——时间轴的轨道列表本身就是这一次会输出哪几个效果，
    而且比那一行更准（它还告诉你各自什么时候出现）。收起抽屉它就回来。
    这不是取舍，是消除重复。lg 档不缺高度，两者都留着。
  */
  const bucket = $('mockWindow').dataset.w;
  $('outputRow').classList.toggle('hidden', drawerOpen && bucket !== 'lg');

  body.style.height = effectiveDrawerH() + 'px';
  // 预算是上一帧量的，最终结果要再验一次。
  // **折叠态也要跑**：压抽屉那部分只在展开时有意义，但纵滚兜底的**取消**只能在这里做——
  // 原先只在 drawerOpen 时调，于是「在最窄档展开抽屉（纵滚打开）→ 再折叠」
  // 会把 overflowY 永久留在 auto，抽屉都收起来了预览列还在滚。
  enforceStageInvariant(drawerOpen);
  $('drawerChevron').classList.toggle('-rotate-90', !drawerOpen);
  $('drawerToggle').setAttribute('aria-label', drawerOpen ? '折叠时间轴' : '展开时间轴');
  // 折叠时把关键信息提到标题行，否则抽屉收起来就完全失去上下文
  const list = chLanes();
  $('drawerSummary').textContent = drawerOpen
    ? ''
    : `${list.length} 条轨道 · ${list.filter((c) => c.ref !== 'trigger').length} 条已链接 · 播放头 ${Math.round(t)}ms`;
  if (drawerOpen) renderTimeline();
}
/*
  抽屉高度是 L2 布局过渡（`.motion-layout`，200ms），所以 `syncDrawer()` 里那次
  `enforceStageInvariant()` 量到的是**动画中途**的高度——压抽屉那一步会少压一点。
  过渡结束后再压一次；纵滚兜底不用管，它已经由 ResizeObserver 兜住（见 syncPreviewScroll）。

  这是裁决 10（L2 解禁 height 过渡）与 A1（舞台高度不变量）之间的真实耦合，
  上一轮加过渡时没注意到。
*/
$('drawerBody').addEventListener('transitionend', (e) => {
  if (e.target === $('drawerBody') && e.propertyName === 'height' && drawerOpen) enforceStageInvariant(true);
});

// 用户亲手开合过就锁定，窗口尺寸变化不再替他决定（见 autoCollapseDrawerIfTight）
$('drawerToggle').addEventListener('click', () => { drawerAutoDecided = true; drawerOpen = !drawerOpen; syncDrawer(); });
$('drawerGrip').addEventListener('pointerdown', (e) => {
  if (!drawerOpen) return;
  $('drawerGrip').setPointerCapture(e.pointerId);
  const y0 = e.clientY, h0 = drawerH;
  // 拖拽**过程中**停掉 L2 过渡：200ms 的过渡会让抽屉滞后于指针，手感变黏。
  // 松手后恢复，这样「用户主动拖」是直接的、「程序改尺寸」才有因果动效。
  $('drawerBody').classList.add('motion-none');
  // 上限由可用高度算，不再是写死的 460——在 680px 窗口里 460px 抽屉是不合理的上限
  const mv = (ev) => { drawerH = Math.max(120, Math.min(drawerMaxH(), h0 - (ev.clientY - y0))); syncDrawer(); };
  const up = () => {
    $('drawerBody').classList.remove('motion-none');
    $('drawerGrip').removeEventListener('pointermove', mv); $('drawerGrip').removeEventListener('pointerup', up);
  };
  $('drawerGrip').addEventListener('pointermove', mv);
  $('drawerGrip').addEventListener('pointerup', up);
});

// ── 把所有字段注册进 ⌘K：390 个配置决策的可发现性，靠搜索而不是分组
function registerFields() {
  const items = [];
  for (const c of CARDS) {
    // 注册表与界面**同源**：都从 c.fields 走，f.group 决定它在不在「其余项」里。
    // 原先注册表读 `c.groups` 里的字符串、界面读 `c.fields` 里的对象，两份来源——
    // 于是「注册表里有、界面上没有」是必然会发生的，而且没有任何视觉痕迹。
    for (const f of (c.fields || [])) {
      items.push([`${c.name} · ${f.label}`, f.group ? `其余项 · ${f.group}` : '', () => revealField(c.key, f.label, !!f.group)]);
    }
  }
  registerCommands('字段', items);
}
// ════ 时间 chip：卡片与时间轴之间的桥 ════════════════════
//
// 决策 #9：时间轴是时间的**唯一编辑面**，卡片只管外观。
// 但「时间只在别处能改」不等于「卡片上看不到时间」——那样调手感时得先猜。
// 所以卡片上留一枚**只读** chip 显示当前时间关系，点它跳到对应轨。
//
// 为什么不做成双向同步的输入框：同步能修掉「两个面互相说谎」，
// 但修不掉更根本的一条——**关系型时间没法用数字框表达**。
// 「飘字起点 = 波纹峰值 + 40ms」这种锚点链接塞进输入框只能退化成绝对毫秒，
// 而那正是走查里已经踩过的坑（链接目标被关掉后固化成绝对时间）。
const CARD_TO_CHANNEL = { trigger: 'trigger', text: 'text', particle: 'particle', ripple: 'ripple', audio: 'audio' };

function timeChipText(cardKey) {
  if (cardKey === 'trigger') return `节流 ${TRIGGER.throttle}ms · 连击窗 ${TRIGGER.comboWindow}ms`;
  const ch = CH.find((c) => c.id === CARD_TO_CHANNEL[cardKey]);
  if (!ch) return '';
  if (ch.ref === 'trigger') return `${ch.dur}ms · 跟随触发${ch.off ? ` +${ch.off}ms` : ''}`;
  const [refId, refAnchor] = ch.ref.split('.');
  const refCh = CH.find((c) => c.id === refId);
  const anchorName = { emit: '发出', peak: '峰值', spread: '扩散', in: '入场', onset: '起音' }[refAnchor] || refAnchor;
  const sign = ch.off === 0 ? '' : (ch.off > 0 ? ` +${ch.off}ms` : ` ${ch.off}ms`);
  return `${ch.dur}ms · ${refCh ? refCh.label : refId}${anchorName}${sign}`;
}

function timeChip(cardKey) {
  if (!CARD_TO_CHANNEL[cardKey]) return '';
  // chip **可收缩且截断**（不是 shrink-0）：窄配置列下必须有东西让位，
  // 而它是最该让的那个——同一份时间信息在时间轴上还有一份，卡名没有第二份。
  // title 里给出全文，截断后仍可查证。
  return `<button data-jumptrack="${cardKey}" class="inline-flex min-w-0 shrink items-center gap-1 rounded-lg bg-slate-50 px-1.5 py-0.5 text-xs font-medium text-slate-500 ring-1 ring-slate-200 transition-colors hover:bg-slate-100 hover:text-slate-900"
    title="${timeChipText(cardKey)} —— 时间在时间轴上编辑，点这里跳过去">
    <svg class="size-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span class="truncate">${timeChipText(cardKey)}</span>
  </button>`;
}

// 反向跳转：卡片 → 时间轴。与 revealField（⌘K → 卡片）对称。
function revealTrack(cardKey) {
  const chId = CARD_TO_CHANNEL[cardKey];
  if (!chId) return;
  if (!drawerOpen) { drawerOpen = true; syncDrawer(); }   // 抽屉收着就先展开，否则跳过去什么也看不到
  renderTimeline();
  // 轨道行的标识是 data-lane-id（挂在 .tl-lane 上），高亮它的父行更完整
  const lane = document.querySelector(`[data-lane-id="${chId}"]`);
  const target = lane?.parentElement || lane || document.getElementById('drawer');
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('ring-2', 'ring-slate-400', 'rounded-lg');
  setTimeout(() => target.classList.remove('ring-2', 'ring-slate-400', 'rounded-lg'), 1400);
}

/*
  ⌘K → 字段。原先这里有两个独立根因，实测 55 个字段条目里 **51 个落不到字段上**：

  1. `hit?.closest('.ctl-row, .ctl-row-wide, .grid')` —— `#cols` 自己带 `grid` 类，
     于是任何不在 `.ctl-row` 里的命中都一路爬到 `#cols`（898×341，整个配置区连 8 张卡）。
     **整块都闪 = 什么都没闪。** 46 个是这一类。
  2. hit 判定要求 `el.children.length === 0`（叶子节点），而**改过的字段**的标签里
     带四态溯源小点：`<span class="field-label">字号<span data-revert…></span></span>`
     → 不是叶子 → 找不到 → 完全没有反馈。也就是**恰好是用户改过、最可能去搜的那些字段**
     永远不闪（飘字·文案/字号/颜色/上浮距离、波纹·颜色）。5 个是这一类。

  两条都源自「按文本内容去 DOM 里猜」。改成显式锚点 `data-fieldrow="卡|字段"`：
  锚点由 renderField 统一发出，注册表也从同一份 c.fields 生成，
  所以「注册表里有、界面上没有」不再可能。
*/
function revealField(cardKey, label, inGroup) {
  const c = CARDS.find((x) => x.key === cardKey);
  if (!c.always && !c.on) { c.on = true; renderTimeline(); }   // 字段所在的效果没开就先开
  if (inGroup) c.more = true;
  afterConfigChange();
  const target = document.querySelector(`[data-fieldrow="${cardKey}|${label}"]`);
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('ring-2', 'ring-slate-400', 'rounded-lg');
  setTimeout(() => target.classList.remove('ring-2', 'ring-slate-400', 'rounded-lg'), 1400);
}

function syncHint() {
  const a = ACTIONS.find((x) => x.id === actionId);
  $('hintGesture').textContent = a.gesture;
  $('stageHint').classList.remove('hidden');
  renderTimeline();
}
// 这一条是上面 recomputeLayout 的子集（它已经含 renderTimeline），
// 留着只为覆盖「时间轴自己重排但不需要重算列宽」的场合；两个事件都要听，理由同上。
['resize', 'viewportchange'].forEach((ev) => window.addEventListener(ev, () => renderTimeline()));

// ── 布局预设






/*
  ══ 切主题：换引用 + 全量重渲染 ══════════════════════════════════════

  **换引用，不是把内容复制过去**——桶里的东西必须留在原主题里，
  这正是原先那条闭环（在几何改的值出现在流光下、而且在流光里改不回去）的成因。

  重渲染要覆盖全部四处消费者：卡片、输出行、时间轴、舞台。
  漏任何一处就会得到「切了主题但某一块还是上一个主题的」——
  也就是把已经修掉的缺陷换个位置重现一遍。

  播放头夹回标尺内：不同主题总长不同（熔金 640ms vs 夕霞 1180ms），
  切过去之后旧的播放头可能落在标尺之外，那是个不可达状态。
*/
window.onThemeChange(() => {
  S = themeState(activeTheme().id, seedFor);
  CARDS = S.cards;
  CH = S.ch;
  CH_BEFORE = S.chBefore;
  CH_DEFAULT = S.chDefault;
  TRIGGER = S.trigger;
  bezCache.clear();          // 缓动函数按曲线缓存，换主题必须失效
  ab = false; $('abBadge').classList.add('hidden');
  clampPlayhead();
  registerFields();          // ⌘K 的字段注册表跟着主题走（预设名会变）
  afterConfigChange();       // 卡片 + 输出行 + 舞台最小尺寸 + 舞台画面
  renderTimeline();
});

renderActions(); renderCards(); renderOutputs(); syncHint(); syncLayout(); syncDrawer(); registerFields();
</script>
</body>
