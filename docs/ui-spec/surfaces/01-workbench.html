<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主题工作台 · UX 原型</title>
<link rel="stylesheet" href="../mockup.css" />
<style>
  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .fx { position: absolute; pointer-events: none; user-select: none; }
  .checker {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #eef2f6 25%, transparent 25%, transparent 75%, #eef2f6 75%),
      linear-gradient(45deg, #eef2f6 25%, transparent 25%, transparent 75%, #eef2f6 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
</style>
</head>
<body class="bg-slate-200 p-6 text-slate-900">

<div id="proto"></div>
<div id="app"></div>

<template id="page">

      <!-- 动作标签：带已启用效果数 -->
      <div class="shrink-0 px-3 pt-3">
        <div class="rounded-xl border border-slate-200 bg-white px-2.5 py-2.5 shadow-sm">
          <div id="actionTabs" class="-mx-1 flex gap-2 overflow-x-auto px-1"></div>
        </div>
      </div>

      <div id="cols" class="grid min-h-0 flex-1 gap-1.5 px-3 pt-2.5" style="grid-template-columns: minmax(0,1.05fr) 4px minmax(0,1.25fr)">

        <!-- 配置列 -->
        <div class="min-h-0 space-y-2 overflow-y-auto pr-1" id="cardCol"></div>

        <!--
          列宽分隔条。真实代码 useWorkbenchColumnLayout 早就有 startResizeColumns，
          稿子原先只画了三个布局预设按钮、没有分隔条——按稿子重构会把这个已工作的
          功能删掉。预设保留为快捷入口，拖拽是自由档。
          4px 宽与真实代码 getWorkbenchGridTemplate 里的 "4px" 轨道一致。
        -->
        <div
          id="colSplit"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整配置列与预览列的宽度"
          tabindex="0"
          class="group relative -mx-1 w-1.5 cursor-col-resize self-stretch rounded-full focus-visible:outline-none"
        >
          <span class="pointer-events-none absolute inset-y-0 left-1/2 w-px -translate-x-1/2 bg-slate-200 transition-colors group-hover:bg-slate-400 group-focus-visible:bg-slate-500"></span>
        </div>

        <!-- 预览列：舞台占满全高 -->
        <div class="flex min-h-0 flex-col">
          <section class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <!--
              页头压成单行：原先它占 97px，而它要服务的舞台只有 143px。
              说明文字（点击舞台触发 · 拖播放头定格）与舞台内的 stageHint 说的是同一件事，
              重复占掉的正是舞台最缺的垂直空间。标题旁留一句极短的提示即可。
            -->
            <div class="flex items-center justify-between gap-2 border-b border-slate-100 px-4 py-2">
              <!--
                「点一下即触发」这句已删除。它和舞台里的 stageHint（「在这里单击试试」）
                说的是同一件事，而在真实默认宽度下它被 truncate 压成**一个字**——
                一个字的提示不传递任何信息，只制造视觉噪音。
                这条也正是上一轮压缩页头时给出的理由（重复占掉的正是舞台最缺的空间），
                当时只删了两行说明里的一行，留下的这半句在 960px 下才露出问题。
              -->
              <div class="flex min-w-0 items-baseline gap-2">
                <h3 class="shrink-0 text-sm font-medium text-slate-900">实时预览</h3>
              </div>
              <div class="flex shrink-0 items-center gap-1.5">
                <div class="seg-group">
                  <button data-bg="light" class="seg-item seg-item-on">浅</button>
                  <button data-bg="dark" class="seg-item">深</button>
                  <button data-bg="checker" class="seg-item">格</button>
                </div>
                <button id="onionBtn" class="btn-outline h-7 px-2.5 text-2xs" title="洋葱皮：叠加多帧看运动路径">轨迹</button>
                <button id="abBtn" class="btn-outline h-7 px-2.5 text-2xs" title="按住对比修改前">A/B</button>
              </div>
            </div>

            <div class="flex min-h-0 flex-1 flex-col px-4 pt-3">
              <div id="stage" class="relative min-h-0 flex-1 overflow-hidden rounded-xl border border-slate-200 bg-white">
                <div id="stageHint" class="pointer-events-none absolute inset-0 grid place-items-center text-center">
                  <div>
                    <div class="text-xs font-medium text-slate-500">在这里<span id="hintGesture">单击</span>试试</div>
                    <div class="mt-1 text-2xs text-slate-400">或拖下面的播放头逐帧检视</div>
                  </div>
                </div>
                <div id="onionHost" class="pointer-events-none absolute inset-0"></div>
                <div id="fxHost" class="pointer-events-none absolute inset-0"></div>
                <div id="abBadge" class="pointer-events-none absolute right-3 top-3 hidden rounded-lg bg-slate-900 px-2 py-1 text-2xs font-semibold text-white">修改前</div>
              </div>
            </div>

            <!--
              传输控制：窄列下允许换行（垂直代价可接受），但每一组必须 shrink-0，
              否则「循环区间」「自动重播」这类三四字的按钮会被压成竖排单字。
              换行 = 还能读；压成单字 = 读不了。
            -->
            <div class="flex flex-wrap items-center gap-2 px-4 py-2.5 [&>*]:shrink-0">
              <div class="flex items-center gap-0.5 rounded-xl border border-slate-200 bg-white p-1 shadow-sm">
                <button id="playBtn" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="播放/暂停">
                  <svg id="playIcon" class="size-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="stepBack" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="后退一帧">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6 9 12l6 6M8 6v12"/></svg>
                </button>
                <button id="stepFwd" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="前进一帧">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6M16 6v12"/></svg>
                </button>
                <button id="replayBtn" class="grid size-7 place-items-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100" aria-label="重播">
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
                </button>
              </div>
              <div class="seg-group">
                <button data-speed="1" class="seg-item seg-item-on">1×</button>
                <button data-speed="0.5" class="seg-item">0.5×</button>
                <button data-speed="0.25" class="seg-item">0.25×</button>
              </div>
              <button id="loopBtn" class="btn-outline h-7 px-2.5 text-2xs" title="只循环标尺上选中的区间">循环区间</button>
              <!--
                自动重播与「循环区间」是两回事，所以是两个控件：
                循环区间 = 反复播标尺上选中的那一段，段与段之间不留空隙；
                自动重播 = 整条播完后隔一段时间再来一次，模拟「用户隔一会儿点一下」。
                调手感时需要的是后者——效果之间要有间隔才看得出单次的样子。
                间隔档位（2400/1200/600ms）与真实代码 INTERVAL_PRESETS 对齐。
              -->
              <button id="autoBtn" class="btn-outline h-7 px-2.5 text-2xs" title="整条播完后自动再来一次">自动重播</button>
              <div id="autoIntervalGroup" class="seg-group hidden" aria-label="自动重播间隔">
                <button data-interval="2400" class="seg-item">慢</button>
                <button data-interval="1200" class="seg-item seg-item-on">标准</button>
                <button data-interval="600" class="seg-item">快</button>
              </div>
              <span class="ml-auto inline-flex h-7 items-center gap-1 rounded-xl bg-slate-50 px-2.5 text-2xs font-semibold tabular-nums text-slate-700 ring-1 ring-slate-200">
                <span id="timeNow">0</span><span class="text-slate-400">/</span><span id="timeTotal">960</span><span class="font-normal text-slate-400">ms</span>
              </span>
            </div>

            <!--
              这一行在 960×680 下曾经**竖排成一列单字**（本/次/输/出）：
              容器实测只有 32px 宽，`flex-wrap` 于是按字换行。
              竖排单字是「窄到没有任何可读性」的信号，任何时候都不该出现，
              所以这里禁掉换行、标签给 nowrap，装不下就横向滚动——
              横滚需要一个动作才能看全，竖排单字连读都读不了。
            -->
            <div class="flex items-center gap-1.5 border-t border-slate-100 px-4 py-2">
              <span class="shrink-0 whitespace-nowrap text-2xs font-medium text-slate-500">本次输出</span>
              <div id="outputTags" class="flex min-w-0 flex-1 gap-1.5 overflow-x-auto whitespace-nowrap"></div>
            </div>
          </section>
        </div>
      </div>

      <!-- ══ 底部抽屉：时间轴需要的是水平空间，所以横跨两列 ══ -->
      <div id="drawer" class="shrink-0 border-t border-slate-200 bg-white">
        <div id="drawerGrip" class="group flex h-2.5 cursor-row-resize items-center justify-center" title="拖动调整高度">
          <span class="h-0.5 w-10 rounded-full bg-slate-200 transition-colors group-hover:bg-slate-400"></span>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 px-3 pb-2">
          <div class="flex min-w-0 items-center gap-2">
            <button id="drawerToggle" class="grid size-5 place-items-center rounded text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-700" aria-label="折叠时间轴">
              <svg id="drawerChevron" class="size-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <span class="text-xs font-medium text-slate-700">时间轴</span>
            <span class="rounded-md bg-slate-100 px-1.5 py-0.5 text-2xs font-medium tabular-nums text-slate-500">总长 <span id="totalLabel">960</span>ms</span>
            <span id="drawerSummary" class="truncate text-2xs text-slate-400"></span>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            <div class="seg-group">
                    <button data-snap="20" class="seg-item seg-item-on">20</button>
                    <button data-snap="10" class="seg-item">10</button>
                    <button data-snap="0" class="seg-item">关</button>
                  </div>
                  <div class="seg-group">
                    <button data-zoom="1" class="seg-item seg-item-on">适配</button>
                    <button data-zoom="2" class="seg-item">2×</button>
                    <button data-zoom="4" class="seg-item">4×</button>
                  </div>
            <button id="copyRhythm" class="text-2xs font-medium text-slate-400 transition-colors hover:text-slate-700" title="把这套时间关系套用到其他动作">复制节奏</button>
          </div>
        </div>
        <div id="drawerBody" class="grid gap-2.5 px-3 pb-3" style="grid-template-columns: minmax(0,1fr) 296px; height: 236px">
          <div id="tlScroll" class="min-h-0 overflow-auto rounded-xl border border-slate-200 bg-white px-3 py-2">
            <!--
              轨道最小宽 320px（132 标签 + 10 gap + 320 轨道 + 8 内边距 = 470）。
              原先只有 `min-w-full`，于是 `.tl-row` 的 `132px + 1fr` 里**轨道是唯一有弹性的轨**，
              窗口变窄时全部收缩由它承担、标签列到死都保着 132px：
              实测 1200px 窗口下轨道还有 444px，880px 只剩 124px，720px（桌面最小）就是 2px。
              2px 的色块既拖不动块体也拖不动边缘——看得见、够不着。
              现在装不下就让 #tlScroll 横向滚动（DAW 的通行做法），标签列 sticky 钉住。
            -->
            <div id="tlInner" class="min-w-[470px]">
              <!--
                标尺的栅格必须和 .tl-row **严格一致**（132px + minmax(320px,1fr) + gap-2.5 + px-1）。
                README 已经为此修过一次：原先标尺 96px、轨道 112px，刻度与色块错位、播放头偏 5px。
                给轨道加 min-width 时如果只改 .tl-row 不改这里，同一个错位会立刻复发——
                而且只在窄窗口下复发，宽窗口看不出来。
              -->
              <div class="grid grid-cols-[132px_minmax(320px,1fr)] gap-2.5 px-1">
                <div class="sticky left-0 z-10 bg-white"></div>
                <div id="ruler" class="relative h-6 cursor-col-resize"></div>
              </div>
              <div id="lanes" class="relative mt-1 space-y-1"></div>
              <p class="mt-2 text-2xs leading-relaxed text-slate-400">
                拖色块中部改偏移 · 拖两端改时长 · 拖到别人的<span class="mx-0.5 inline-block size-1.5 rotate-45 bg-slate-900 align-middle"></span>锚点上会<span class="font-medium text-slate-600">建立链接</span> · ⌥ 解除吸附 · S 独奏 / M 静音
              </p>
            </div>
          </div>
          <div id="inspector" class="min-h-0 overflow-y-auto rounded-xl border border-slate-200 bg-slate-50/60 px-3 py-2.5"></div>
        </div>
      </div>

    </template>

<script src="../controls.js"></script>
<script src="../shell.js"></script>
<script>
mountShell({ active: 'workbench', mainClass: 'flex min-w-0 flex-1 flex-col overflow-hidden bg-slate-50',
  proto: [['normal', '① 常规'], ['collapsed', '② 侧边栏折叠'], ['cmdk', '③ 命令面板 ⌘K']],
  hint: '舞台可点击触发 · 拖播放头定格 · 拖色块到锚点建立链接 · 预设 chip 可点 · ⌘Z 撤销',
  onProto: (id) => {
    if (id === 'collapsed') setSidebar(true);
    else if (id === 'cmdk') { setSidebar(false); toggleCmdk(true); }
    else { setSidebar(false); toggleCmdk(false); }
  } });
// 布局预设 + 自由拖拽：外壳出按钮，页面出实现（列宽是页面自己的事）
//
// 权重与夹取区间照 useWorkbenchColumnLayout.ts 的模型来：预设只是权重的三个档位，
// 拖分隔条是连续档。拖过之后不再高亮任何预设——当前比例已经不是那三档里的任何一个，
// 继续亮着会谎报状态。
const LAYOUTS = { config: [1.6, 1], split: [1, 1], preview: [0.8, 1.7] };
const COL_MIN = 0.62, COL_MAX = 1.9;
const clampCol = (v) => Math.min(COL_MAX, Math.max(COL_MIN, v));
let weights = [...LAYOUTS.config];
let layout = 'config';

/**
 * 权重是比例，而比例在窄窗口下会把某一列压到不可用——**必须再按像素下限夹一道**。
 *
 * 实测：默认预设「配置优先」是 1.6 : 1。在 1440px 下预览列还有约 458px、够用；
 * 换到真实默认的 960px 窗口后只剩 **258px**，而舞台的 min-width 就占 240，
 * 只剩 18px 余量——于是「本次预览」工具条和「本次输出」行被挤爆，
 * 输出行的容器实测只有 **32px 宽，文字竖排成一列单字**。
 *
 * 所以这里把比例换算成像素后夹取：预览列 ≥ 舞台最小宽 + 72（留给工具条与滚动条），
 * 配置列 ≥ 340（一张效果卡的字段行 + 数值读数装得下的下限）。
 * 两者都满足不了时按可用宽度等分，并让 shouldStackCols() 决定是否改成上下堆叠。
 */
const CONFIG_COL_MIN = 340;
const previewColMin = () => stageMin().w + 72;
// 两列都塞不进去就不要硬塞——横向并排不是目的，同时看到配置与预览才是。
// 装不下时改成上下堆叠，各自拿满宽度。
function shouldStackCols() {
  const total = document.getElementById('cols').clientWidth || 0;
  return total > 0 && total - 4 < CONFIG_COL_MIN + previewColMin();
}
function applyCols() {
  const cols = document.getElementById('cols');
  const total = cols.clientWidth || 0;
  const split = document.getElementById('colSplit');
  if (shouldStackCols()) {
    // 单列堆叠：配置在上、预览在下。分隔条此时无意义（没有左右可分），必须真的移出
    // 可达性树而不是只做视觉隐藏——留一个键盘能聚焦、按了却什么也不做的 separator
    // 就是决策 #4「操作不得只在某一种到达方式下可用」的反面：一个骗人的控件。
    cols.style.gridTemplateColumns = 'minmax(0,1fr)';
    cols.dataset.stacked = '1';
    if (split) { split.hidden = true; split.tabIndex = -1; }
    return;
  }
  delete cols.dataset.stacked;
  if (split) { split.hidden = false; split.tabIndex = 0; }
  let [a, b] = weights;
  if (total > 0) {
    const avail = total - 4;
    const pxB = (avail * b) / (a + b);
    const minB = previewColMin();
    // 预览列不够 → 从配置列借，但不能让配置列低于它自己的下限
    if (pxB < minB) {
      const wantB = Math.min(minB, Math.max(0, avail - CONFIG_COL_MIN));
      const wantA = Math.max(0, avail - wantB);
      if (wantA > 0 && wantB > 0) { a = wantA; b = wantB; }
    }
  }
  cols.style.gridTemplateColumns = `minmax(0,${a}fr) 4px minmax(0,${b}fr)`;
}
function syncLayout() {
  applyCols();
  document.querySelectorAll('[data-shell-layout]').forEach((b) => b.classList.toggle('layout-btn-on', b.dataset.shellLayout === layout));
}
document.querySelectorAll('[data-shell-layout]').forEach((b) => b.addEventListener('click', () => {
  layout = b.dataset.shellLayout;
  weights = [...LAYOUTS[layout]];
  syncLayout();
}));

// 拖分隔条：按像素位移换算权重增量，与真实代码一致地用「总权重守恒」的方式挪，
// 这样另一列不会被挤没。
function startColDrag(startX) {
  const total = weights[0] + weights[1];
  const gridW = document.getElementById('cols').clientWidth || 1;
  const start = [...weights];
  const onMove = (e) => {
    const deltaWeight = ((e.clientX ?? startX) - startX) / gridW * total;
    const left = clampCol(start[0] + deltaWeight);
    weights = [left, clampCol(total - left)];
    layout = '';            // 已是自定义比例，不再谎称命中某个预设
    applyCols();
    document.querySelectorAll('[data-shell-layout]').forEach((b) => b.classList.remove('layout-btn-on'));
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    toast('已调整列宽', () => { weights = [...start]; applyCols(); });
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
document.getElementById('colSplit').addEventListener('pointerdown', (e) => { e.preventDefault(); startColDrag(e.clientX); });
// 键盘可达：分隔条不能只能用鼠标拖（决策 #4 同源——操作不得只有一种到达方式）
document.getElementById('colSplit').addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.12 : 0.04;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const total = weights[0] + weights[1];
  const left = clampCol(weights[0] + (e.key === 'ArrowRight' ? step : -step));
  weights = [left, clampCol(total - left)];
  layout = '';
  applyCols();
  document.querySelectorAll('[data-shell-layout]').forEach((b) => b.classList.remove('layout-btn-on'));
});
</script>
<script>
const $ = (id) => document.getElementById(id);

const ICONS = {
  trigger: '<path d="M3 3l7.5 18 2.5-7.5L21 11z"/>',
  text: '<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
  animation: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  particle: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="9" cy="17" r="2"/><circle cx="17" cy="18" r="1.5"/>',
  ripple: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="11" stroke-dasharray="2 4"/>',
  audio: '<path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',

// ── 渲染：效果卡
function renderCards() {
  $('cardCol').innerHTML = CARDS.map((c) => {
    const on = c.always || c.on;
    if (!on) {
      // 未启用 → 收成一行
      return `<div class="cfg-card">
        <div class="cfg-head">
          <span class="cfg-icon"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[c.key]}</svg></span>
          <span class="min-w-0 flex-1">
            <span class="cfg-name">${c.name}</span>
            <span class="ml-2 text-2xs text-slate-400">${c.total} 项设置</span>
          </span>
          <button data-toggle="${c.key}" class="switch-knob" aria-label="启用${c.name}"></button>
        </div>
      </div>`;
    }
    const fields = c.fields.length ? c.fields.map((f, i) => renderField(c.key, f, i)).join('') : '';
    const shown = c.fields.length;
    return `<div class="cfg-card cfg-card-on">
      <div class="cfg-head border-b border-slate-100">
        <span class="cfg-icon cfg-icon-on"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[c.key]}</svg></span>
        <span class="min-w-0 flex-1">
          <!--
            卡头这一排在窄配置列下曾把卡名压成竖排单字（「飘/字」、「已/启/用」）。
            名称和状态徽标必须 nowrap + shrink-0；该让位的是时间 chip（它 truncate），
            因为 chip 的信息在时间轴里还有一份，卡名没有第二份。
          -->
          <!--
            「已启用」徽标已删除：它是同一个 bit 的**第三次编码**——
            决策 #3 已经定了「深底图标=启用、浅灰=关闭」，同一行最右侧还有开关。
            而在真实默认宽度（配置列约 374px）下，正是这个冗余徽标撑爆了卡头：
            它和时间 chip 视觉重叠，两段文字叠在一起谁都读不清。
            删冗余编码比给冗余编码想办法让位更对。
          -->
          <!--
            让位顺序是明确的：卡名（2–3 个字、约 28–42px）**绝不让位**，
            该让的是时间 chip（它 min-w-0 shrink + truncate，且 title 里有全文）。
            反过来把卡名截成「飘..」比截断 chip 糟得多——卡名是这张卡的身份。
          -->
          <span class="flex min-w-0 items-center gap-2">
            <span class="cfg-name shrink-0 whitespace-nowrap">${c.name}</span>
          </span>
          <span class="cfg-sum block">${(() => {
            const changed = (c.fields || []).filter((f) => f.src === 'custom' || f.src === 'ai').length;
            return `${c.preset}${changed ? ` · <span class="text-slate-500">${changed} 项已改</span>` : ''} · ${c.total} 项设置`;
          })()}</span>
        </span>
        ${timeChip(c.key)}
        ${(() => {
          // 「重置这张卡」只在真有改动时出现——没有改动时它是空操作，
          // 摆一个点了没反应的按钮比不摆更糟（同 README 决策 #4 的精神）。
          const changed = (c.fields || []).filter((f) => f.src === 'custom' || f.src === 'ai').length;
          return changed
            ? `<button data-cardreset="${c.key}" class="shrink-0 rounded-lg px-2 py-1 text-2xs font-medium text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900" title="把这张卡的 ${changed} 项改动恢复到预设值">重置</button>`
            : '';
        })()}
        <button data-cardfold="${c.key}" class="grid size-6 shrink-0 place-items-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-700" aria-label="${c.folded ? '展开' : '折叠'}${c.name}" title="${c.folded ? '展开' : '折叠'}这张卡">
          <svg class="size-3.5 transition-transform ${c.folded ? '' : 'rotate-90'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        ${c.always ? '' : `<button data-toggle="${c.key}" class="switch-knob switch-on" aria-label="关闭${c.name}"></button>`}
      </div>
      <div class="space-y-3 px-3 py-3${c.folded ? ' hidden' : ''}">
        <div>
          <div class="mb-2 flex items-center gap-1.5">
            <span class="field-label">预设</span>
            <span class="text-2xs text-slate-400">点一下填一组参数，再微调</span>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${(() => {
              const changed = (c.fields || []).some((f) => f.src === 'custom' || f.src === 'ai');
              return c.presets.map((p) => {
                const on = p === c.preset;
                // 套了预设又手改过，chip 不能继续假装「就是这个预设」
                return `<button data-preset="${c.key}|${p}" class="preset-chip${on ? ' preset-chip-on' : ''}">${p}${on && changed ? '<span class="ml-1 font-normal opacity-70">·已改</span>' : ''}</button>`;
              }).join('') + (changed ? `<button data-represet="${c.key}" class="preset-chip border-dashed">回到「${c.preset}」</button>` : '');
            })()}
          </div>
        </div>
        ${fields ? `<div class="space-y-2.5 border-t border-slate-100 pt-3">${fields}</div>` : ''}
        ${c.total > shown ? `
          <div class="border-t border-slate-100 pt-2.5">
            <button data-more="${c.key}" class="flex w-full items-center gap-1.5 text-2xs font-medium text-slate-500 transition-colors hover:text-slate-900">
              <svg class="size-3 transition-transform ${c.more ? 'rotate-90' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
              其余 ${c.total - shown} 项
              <span class="ml-auto inline-flex items-center gap-1 font-normal text-slate-400">按 <span class="kbd">⌘K</span> 可直接搜字段</span>
            </button>
            ${c.more && c.groups ? `<div class="mt-2 space-y-1.5">
              ${c.groups.map(([g, fields]) => `
                <div class="rounded-lg bg-slate-50 px-2.5 py-2">
                  <div class="text-2xs font-semibold text-slate-500">${g} <span class="font-normal text-slate-400">${fields.length}</span></div>
                  <div class="mt-1.5 flex flex-wrap gap-1">
                    ${fields.map((f) => `<span class="rounded border border-slate-200 bg-white px-1.5 py-0.5 text-2xs text-slate-600">${f}</span>`).join('')}
                  </div>
                </div>`).join('')}
            </div>` : ''}
          </div>` : ''}
      </div>
    </div>`;
  }).join('');
  bindCardEvents();
  bindCardChrome();
}

// 折叠与重置。两者都是「卡级」操作，与效果开关分开：
// 折叠只影响视觉密度（配置仍然生效），关闭才是不出效果。把它们混成一个控件
// 会让「我只是想少占点地方」变成「我把效果关了」。
function bindCardChrome() {
  document.querySelectorAll('[data-jumptrack]').forEach((b) => b.addEventListener('click', () => revealTrack(b.dataset.jumptrack)));
  document.querySelectorAll('[data-cardfold]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.cardfold);
    c.folded = !c.folded;
    renderCards();
  }));
  document.querySelectorAll('[data-cardreset]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.cardreset);
    const before = c.fields.map((f) => ({ value: f.value, src: f.src }));
    const n = before.filter((s) => s.src === 'custom' || s.src === 'ai').length;
    c.fields.forEach((f) => {
      if (f.src !== 'custom' && f.src !== 'ai') return;
      if (f.presetValue !== undefined) f.value = f.presetValue;
      f.src = 'preset';
    });
    renderCards(); renderOutputs(); renderTimeline();
    toast(`已重置「${c.name}」· ${n} 项回到「${c.preset}」`, () => {
      c.fields.forEach((f, i) => { f.value = before[i].value; f.src = before[i].src; });
      renderCards(); renderOutputs(); renderTimeline();
    });
  }));
}

const SRC = {
  preset:  ['bg-slate-300', '来自预设'],
  ai:      ['bg-sky-400', 'AI 建议'],
  custom:  ['bg-slate-900', '你改过'],
};
function srcDot(cardKey, f) {
  const meta = SRC[f.src];
  if (!meta) return '';
  const revert = f.presetValue !== undefined ? ` · 双击回到预设值 ${f.presetValue}` : '';
  return `<span data-revert="${cardKey}|${f.label}" class="size-1.5 shrink-0 rounded-full ${meta[0]}" title="${meta[1]}${revert}"></span>`;
}
function renderField(cardKey, f, i) {
  const id = `f-${cardKey}-${i}`;
  if (f.type === 'num') {
    // 共享滑块 + 可编辑读数：标签可 scrub、拖柄出气泡、双击回默认
    return `<div class="ctl-row">
      <span class="field-label ctl-label-scrub" data-scrub="${id}">${f.label}${srcDot(cardKey, f)}</span>
      <div id="${id}" data-slider data-min="${f.min}" data-max="${f.max}" data-value="${f.value}"
           data-default="${f.presetValue ?? f.value}" data-field="${cardKey}|${f.label}"></div>
      <span class="ctl-value"><span data-out="${id}">${f.value}</span>${f.unit ? ` ${f.unit}` : ''}</span>
    </div>`;
  }
  if (f.type === 'select') {
    return `<div class="ctl-row-wide">
      <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
      <div id="${id}" data-select="${cardKey}|${f.label}"></div>
    </div>`;
  }
  if (f.type === 'color') {
    const palette = ['#F59E0B', '#0EA5E9', '#0D9488', '#F43F5E', '#8B5CF6', '#0F172A'];
    return `<div class="grid grid-cols-[104px_minmax(0,1fr)] items-center gap-2.5">
      <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
      <span class="flex flex-wrap gap-1.5">
        ${palette.map((p) => `<button data-color="${cardKey}|${p}" class="size-6 rounded-lg border ${p === f.value ? 'border-slate-950 ring-2 ring-slate-300' : 'border-slate-200'} shadow-sm" style="background:${p}" aria-label="颜色 ${p}"></button>`).join('')}
      </span>
    </div>`;
  }
  return `<div class="grid grid-cols-[104px_minmax(0,1fr)] items-center gap-2.5">
    <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>
    <input value="${f.value}" class="h-8 rounded-xl border border-slate-200 bg-white px-2 text-xs text-slate-700 shadow-sm" />
  </div>`;
}

function mountCardControls() {
  // 形状类字段画出图形，其余给纯文字选项——都走同一个下拉实现
  document.querySelectorAll('[data-select]').forEach((el) => {
    if (el.dataset.mounted) return;
    el.dataset.mounted = '1';
    const [key, label] = el.dataset.select.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    const isShape = label === '形状';
    Ctl.select(el, {
      options: f.options.map((o) => ({ label: o, thumb: isShape ? Ctl.shapeThumb(o) : undefined })),
      value: f.value,
      onChange: (v) => {
        const before = f.value;
        f.value = v; f.src = 'custom';
        renderCards();
        const undo = () => { f.value = before; renderCards(); return () => { f.value = v; renderCards(); return undo; }; };
        toast(`「${c.name} · ${label}」已改为 ${v}`, undo);
      },
    });
  });
  document.querySelectorAll('[data-slider]:not([data-mounted])').forEach((el) => {
    el.dataset.mounted = '1';
    const out = document.querySelector(`[data-out="${el.id}"]`);
    const [key, label] = (el.dataset.field || '').split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c?.fields.find((x) => x.label === label);
    Ctl.slider(el, {
      onChange: (v) => { if (out) out.textContent = v; if (f) f.value = v; },
      onCommit: (v) => {
        if (!f) return;
        if (f.presetValue === undefined) f.presetValue = v;
        f.src = 'custom';
        renderCards(); touch();
      },
    });
  });
}

function bindCardEvents() {
  mountCardControls();
  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.toggle);
    const before = { on: !!c.on, links: CH.map((x) => ({ id: x.id, ref: x.ref, off: x.off })) };
    // 必须在翻转开关**之前**固化链接：之后再算 startOf 会走「目标已关闭」的降级
    // 路径，固化下来的是 off 而不是原本的绝对位置，色块会跳到时间轴开头。
    const broken = c.on ? breakLinksTo(c.key) : [];
    c.on = !c.on;
    const act = ACTIONS.find((a) => a.id === actionId);
    act.enabled = CARDS.filter((x) => !x.always && x.on).length;
    renderCards(); renderActions(); renderOutputs(); renderTimeline();
    const after = { on: c.on, links: CH.map((x) => ({ id: x.id, ref: x.ref, off: x.off })) };
    const apply = (snap) => {
      c.on = snap.on;
      snap.links.forEach((l) => { const ch = CH.find((x) => x.id === l.id); if (ch) { ch.ref = l.ref; ch.off = l.off; } });
      act.enabled = CARDS.filter((x) => !x.always && x.on).length;
      renderCards(); renderActions(); renderOutputs(); renderTimeline();
    };
    // 撤销函数返回重做函数，⌘⇧Z 才有东西可用
    const restore = () => { apply(before); return () => { apply(after); return restore; }; };
    toast(`${c.on ? '已启用' : '已关闭'}「${c.name}」`
      + (broken.length ? ` · ${broken.join('、')}的链接已固化为绝对时间` : ''), restore);
  }));
  document.querySelectorAll('[data-more]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.more);
    c.more = !c.more;
    renderCards();
  }));
  document.querySelectorAll('[data-represet]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.represet);
    const before = (c.fields || []).map((f) => ({ f, v: f.value, src: f.src }));
    (c.fields || []).forEach((f) => {
      if ((f.src === 'custom' || f.src === 'ai') && f.presetValue !== undefined) { f.value = f.presetValue; f.src = 'preset'; }
    });
    renderCards();
    const undo = () => { before.forEach(({ f, v, src }) => { f.value = v; f.src = src; }); renderCards(); return () => { document.querySelector(`[data-represet="${c.key}"]`)?.click(); return undo; }; };
    toast(`「${c.name}」已回到预设 ${c.preset}`, undo);
  }));
  document.querySelectorAll('[data-revert]').forEach((el) => el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const [key, label] = el.dataset.revert.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    if (f.presetValue === undefined) return;
    const before = { v: f.value, src: f.src };
    f.value = f.presetValue; f.src = 'preset';
    renderCards();
    toast(`「${label}」已回到预设值 ${f.presetValue}`, () => { f.value = before.v; f.src = before.src; renderCards(); });
  }));
  document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
    const [key, p] = b.dataset.preset.split('|');
    const c = CARDS.find((x) => x.key === key);
    const before = c.preset;
    c.preset = p;
    (c.fields || []).forEach((f) => { if (f.src === 'custom' || f.src === 'ai') f.src = 'preset'; });
    renderCards();
    const undo = () => { c.preset = before; renderCards(); return () => { c.preset = p; renderCards(); return undo; }; };
    toast(`「${c.name}」已套用预设 ${p}`, undo);
  }));
  document.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', () => {
    const [key, color] = b.dataset.color.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.type === 'color');
    const before = f.value; f.value = color;

function laneW() { const l = document.querySelector('[data-lane]'); return l ? l.clientWidth : 360; }
function areaPath(curve, w, h) {
  const f = easeOf(curve);
  const pts = Array.from({ length: 16 }, (_, i) => { const x = i / 15; return `${(x * w).toFixed(2)},${(h - f(x) * h).toFixed(2)}`; });
  return `M0,${h} L${pts.join(' L')} L${w},${h} Z`;

// 循环区间必须跟着总长收缩，否则关掉最长的通道后区间会落在总长之外、播放卡死
function clampLoop() {
  const T = totalMs();
  loopOut = Math.min(loopOut, T);
  loopIn = Math.max(0, Math.min(loopIn, loopOut - 40));
  // 兜底只在区间真的塌掉时才把它钉到尾部。**不能**用它来产生初始区间：
  // clampLoop 每次 renderTimeline 都跑，而 loopIn/loopOut 初值都是 0，
  // 于是首次渲染就落进这个分支、把区间钉在 [T-40, T]——一点「循环区间」
  // 看到的是标尺末尾 2.8% 的一条缝（实测 left:97.2% / width:2.78%），像坏了。
  // 有意义的初始区间由 loopBtn 在开启时现算（见 defaultLoopRange）。
  if (loopOut - loopIn < 40) { loopIn = Math.max(0, T - 40); loopOut = T; }
}
/**
 * 开启「循环区间」时的初始区间：优先取当前选中通道的跨度——
 * 用户开循环几乎总是为了反复看**某一个**效果，而不是看整条。
 * 没有选中通道时退回全长。
 */
function defaultLoopRange() {
  const T = totalMs();
  const ch = CH.find((x) => x.id === selCh && cardOn(x.id));
  if (!ch) return [0, T];
  const s = startOf(ch);
  const e = s + ch.dur + (ch.repeat ? cardVal('particle', '数量', ch.repeat.n) * staggerOf(ch) : 0);
  return [Math.max(0, Math.floor(s)), Math.min(T, Math.max(s + 40, Math.ceil(e)))];
}
function renderTimeline() {
  clampPlayhead();   // 总长可能刚变小（关轨、改时长、拖连击窗），别把播放头留在标尺外
  clampLoop();
  const T = totalMs();
  $('totalLabel').textContent = T; $('timeTotal').textContent = T;
  $('tlInner').style.width = zoom === 1 ? '100%' : `${zoom * 100}%`;
  const step = T > 1400 ? 200 : 100;
  const ticks = []; for (let ms = 0; ms <= T; ms += step) ticks.push(ms);

  $('ruler').innerHTML =
    (loopOn ? `<div class="loop-band" style="left:${(loopIn / T) * 100}%;width:${((loopOut - loopIn) / T) * 100}%"></div>
       <div class="loop-h" data-loop="in" style="left:${(loopIn / T) * 100}%"></div>
       <div class="loop-h" data-loop="out" style="left:${(loopOut / T) * 100}%"></div>` : '')
    + ticks.map((ms) => `<div class="absolute bottom-0 flex flex-col items-center" style="left:${(ms / T) * 100}%;transform:translateX(${ms === 0 ? '0' : ms === T ? '-100%' : '-50%'})">
        <span class="h-2.5 w-px bg-slate-400"></span>
        <span class="mt-0.5 text-2xs leading-none tabular-nums text-slate-500">${ms}</span></div>`).join('')
    + ticks.slice(0, -1).map((ms) => `<div class="absolute bottom-0 h-1.5 w-px bg-slate-300/70" style="left:${((ms + step / 2) / T) * 100}%"></div>`).join('');

  const pct = (ms) => (ms / T) * 100;
  // 触发轨：节流窗 / 连击窗 / 事件点，与效果同一把标尺
  let html = `<div class="tl-row group">
      <div class="flex items-center gap-1.5">
        <span class="size-1.5 shrink-0 rounded-full bg-slate-900"></span>
        <span class="truncate text-2xs font-semibold text-slate-700">触发</span>
      </div>
      <!--
        触发轨原先是**只读**的：两个窗只是色带、右侧一行静态文字，整条轨 interactive=0。
        而卡片上的「节流间隔」「连击窗口」已按决策 #9 删掉了——于是这两个值哪儿都改不了，
        其中「连击窗口」在真实代码里是个 120–3000ms 的滑块（TextFeedbackCard.tsx）。
        README 说过「方向做反了：时间轴在显示，卡片在编辑」，上一轮只删了卡片那一半。
        现在两个窗的右边缘可拖，兑现「触发的节流窗 / 连击窗和效果放在同一把标尺上」。
      -->
      <div class="tl-lane" data-lane>
        <div class="win-combo" style="left:0;width:${pct(TRIGGER.comboWindow)}%">
          <span class="absolute inset-y-0 right-0 w-1.5 cursor-col-resize" data-trigwin="comboWindow" title="拖动改连击窗"></span>
        </div>
        <div class="win-throttle" style="left:0;width:${pct(TRIGGER.throttle)}%">
          <span class="absolute inset-y-0 right-0 w-1.5 cursor-col-resize" data-trigwin="throttle" title="拖动改节流间隔"></span>
        </div>
        <span class="ev-dot" style="left:0"></span>
        <span class="ev-dot opacity-40" style="left:${pct(TRIGGER.secondClick)}%"></span>
        <span class="pointer-events-none absolute right-1.5 top-1/2 -translate-y-1/2 text-2xs text-slate-400">节流 ${TRIGGER.throttle}ms · 连击窗 ${TRIGGER.comboWindow}ms<span class="ml-1 text-slate-300">· 拖窗右缘可改</span></span>
      </div>
    </div>`;

  for (const ch of chLanes()) {
    const s = startOf(ch);
    const linked = ch.ref !== 'trigger';
    const sel = selCh === ch.id;
    const soloedAny = CH.some((c) => c.solo && cardOn(c.id));
    const muted = ch.mute || (soloedAny && !ch.solo);
    const dirty = isChDirty(ch);   // 覆盖偏移 / 时长 / 曲线 / 错峰，与「重置为默认」同一份定义
    const wPct = Math.max(1.4, pct(ch.dur));
    html += `<div class="tl-row group" data-row="${ch.id}">
      <div class="flex items-center gap-1">
        <button class="grid size-4 shrink-0 place-items-center rounded text-slate-400 hover:text-slate-700" data-expand="${ch.id}" aria-label="展开属性轨">
          <svg class="size-3 transition-transform ${sel ? 'rotate-90' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <span class="truncate text-2xs font-semibold ${muted ? 'text-slate-400' : sel ? 'text-slate-900' : 'text-slate-600'}">${ch.label}</span>
        ${linked ? '<span class="shrink-0 text-2xs text-slate-400" title="已链接到锚点">⛓</span>' : ''}
        <span class="ml-auto flex shrink-0 items-center gap-0.5">
          ${dirty ? `<button class="tl-iconbtn" data-reset-ch="${ch.id}" title="重置为默认">×</button>` : ''}
          <button class="tl-iconbtn ${ch.solo ? 'tl-iconbtn-on' : ''}" data-solo="${ch.id}" title="独奏：只播这一条">S</button>
          <button class="tl-iconbtn ${ch.mute ? 'tl-iconbtn-on' : ''}" data-mute="${ch.id}" title="静音：排除这一条">M</button>
        </span>
      </div>
      <div class="tl-lane" data-lane data-lane-id="${ch.id}">
        ${ticks.map((ms) => `<div class="pointer-events-none absolute inset-y-0 w-px bg-slate-200/60" style="left:${pct(ms)}%"></div>`).join('')}
        ${linked ? `<div class="link-line" style="left:${pct(startOf(CH.find((x) => x.id === ch.ref.split('.')[0])) + CH.find((x) => x.id === ch.ref.split('.')[0]).dur * anchorAt(CH.find((x) => x.id === ch.ref.split('.')[0]), ch.ref.split('.')[1]))}%;width:${Math.max(0, pct(ch.off))}%;top:2px"></div>
             <span class="link-chip" style="left:${pct(s)}%;top:2px">${ch.off === 0 ? '⛓' : (ch.off > 0 ? '+' : '') + ch.off}</span>` : ''}
        <div class="tl-bar ${muted ? 'tl-bar-muted' : ''} ${sel ? 'tl-bar-on' : ''}" data-bar="${ch.id}" style="left:${pct(s)}%;width:${wPct}%">
          <svg class="pointer-events-none absolute inset-0 size-full" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
            <path d="${areaPath(ch.curves[ch.main] || [0, 0, 1, 1], 100, 20)}" fill="#0f172a" fill-opacity="0.07"/>
          </svg>
          ${ch.repeat ? Array.from({ length: cardVal('particle', '数量', ch.repeat.n) }, (_, i) => {
            const off = (i * ch.repeat.stagger / ch.dur) * 100;
            return off > 98 ? '' : `<span class="pointer-events-none absolute inset-y-0.5 w-px bg-slate-900/15" style="left:${off}%"></span>`;
          }).join('') : ''}
          ${wPct > 16 ? `<span class="pointer-events-none absolute inset-y-0 right-1 flex items-center text-2xs font-semibold tabular-nums text-slate-500">${ch.dur}ms</span>` : ''}
          ${ch.anchors.map(([name, at]) => `<span class="anc ${name === 'peak' || name === 'spread' ? 'anc-peak' : ''}" data-anc="${ch.id}.${name}" style="left:${at * 100}%" title="${name}"></span>`).join('')}
          <span class="absolute inset-y-0 left-0 w-1.5 cursor-col-resize" data-edge="l" data-edge-id="${ch.id}"></span>
          <span class="absolute inset-y-0 right-0 w-1.5 cursor-col-resize" data-edge="r" data-edge-id="${ch.id}"></span>

  $('lanes').innerHTML = `<div id="playhead" class="pointer-events-none absolute -top-1 bottom-0 z-20 w-px bg-slate-900" style="left:0px">
      <span class="absolute -top-0.5 left-1 rounded bg-slate-900 px-1 py-0.5 text-2xs font-semibold tabular-nums text-white">0ms</span></div>` + html;
  bindTimeline();
  renderInspector();
  paintStage();
}

function msFromX(clientX) {
  const l = document.querySelector('[data-lane]');
  const r = l.getBoundingClientRect();
  return Math.max(0, Math.min(totalMs(), ((clientX - r.left) / r.width) * totalMs()));
}
const q = (ms, alt) => (!snap || alt ? Math.round(ms) : Math.round(ms / snap) * snap);

// 拖色块时找最近的「别人的锚点」，命中就建立链接
function nearestAnchor(ch, absStart) {
  let best = null;
  for (const other of chLanes()) {
    if (other.id === ch.id) continue;
    for (const [name, at] of other.anchors) {
      const ms = startOf(other) + other.dur * at;
      const d = Math.abs(ms - absStart);
      if (d <= totalMs() * 0.02 && (!best || d < best.d)) best = { ref: `${other.id}.${name}`, ms, d };
    }
  }
  return best;
}
function bindTimeline() {
  const scrub = (el) => el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-bar],[data-loop]')) return;
    setPlaying(false);
    el.setPointerCapture(e.pointerId);
    const mv = (ev) => { t = q(msFromX(ev.clientX), ev.altKey); paintStage(); };
    mv(e);
    const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
  scrub($('ruler'));
  document.querySelectorAll('[data-lane]').forEach(scrub);

  // 触发窗拖右缘。连击窗是总长的下界之一（totalOf 里 Math.max(TRIGGER.comboWindow, …)），
  // 所以拖它会改总长；节流窗必须夹在连击窗内，否则「节流比连击还长」是无意义状态。
  document.querySelectorAll('[data-trigwin]').forEach((h) => h.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    h.setPointerCapture(e.pointerId);
    const key = h.dataset.trigwin;
    const mv = (ev) => {
      const ms = q(msFromX(ev.clientX), ev.altKey);
      if (key === 'comboWindow') TRIGGER.comboWindow = Math.max(TRIGGER.throttle + 20, Math.min(3000, ms));
      else TRIGGER.throttle = Math.max(0, Math.min(TRIGGER.comboWindow - 20, ms));
      clampPlayhead();
      renderTimeline();
    };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); touch(); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  }));

  document.querySelectorAll('[data-loop]').forEach((h) => h.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); h.setPointerCapture(e.pointerId);
    const which = h.dataset.loop;
    const mv = (ev) => {
      const ms = q(msFromX(ev.clientX), ev.altKey);
      if (which === 'in') loopIn = Math.min(ms, loopOut - 40); else loopOut = Math.max(ms, loopIn + 40);
      loopTouched = true;
      renderTimeline();
    };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  }));

  document.querySelectorAll('[data-bar]').forEach((bar) => bar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-edge]')) return;
    e.stopPropagation();
    markBefore();
    const ch = CH.find((x) => x.id === bar.dataset.bar);
    selCh = ch.id; selProp = ch.main;
    const m0 = msFromX(e.clientX), s0 = startOf(ch);
    bar.setPointerCapture(e.pointerId);
    const mv = (ev) => {
      const want = Math.max(0, q(s0 + (msFromX(ev.clientX) - m0), ev.altKey));
      let hit = ev.altKey ? null : nearestAnchor(ch, want);
      if (hit && wouldCycle(ch, hit.ref)) { hit = null; cycleWarn(ch, want); }
      if (hit) { ch.ref = hit.ref; ch.off = q(want - hit.ms, false); }
      else { ch.ref = 'trigger'; ch.off = want; }
      renderTimeline();
    };
    const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); touch(); };
    bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up);
    renderTimeline();
  }));

  document.querySelectorAll('[data-edge]').forEach((h) => h.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    markBefore();
    const ch = CH.find((x) => x.id === h.dataset.edgeId);
    const isL = h.dataset.edge === 'l';
    const m0 = msFromX(e.clientX), off0 = ch.off, dur0 = ch.dur;
    h.setPointerCapture(e.pointerId);
    const mv = (ev) => {
      const d = msFromX(ev.clientX) - m0;
      if (isL) { const no = q(off0 + d, ev.altKey); ch.dur = Math.max(40, dur0 - (no - off0)); ch.off = no; }
      else ch.dur = Math.max(40, q(dur0 + d, ev.altKey));
      renderTimeline();
    };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); touch(); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  }));

  document.querySelectorAll('[data-expand]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = b.dataset.expand;
    selCh = selCh === id ? '' : id;
    const ch = CH.find((x) => x.id === id);
    if (selCh) selProp = ch.main;
    renderTimeline();
  }));
  document.querySelectorAll('[data-mute]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const ch = CH.find((x) => x.id === b.dataset.mute);
    ch.mute = !ch.mute;
    renderTimeline();
  }));
  document.querySelectorAll('[data-solo]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const ch = CH.find((x) => x.id === b.dataset.solo);
    const was = ch.solo;
    CH.forEach((c) => { c.solo = false; });
    ch.solo = !was;
    renderTimeline();
  }));
  document.querySelectorAll('[data-reset-ch]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    markBefore();
    const ch = CH.find((x) => x.id === b.dataset.resetCh);
    resetCh(ch);
    renderTimeline(); touch();
  }));
}
// 播放头由实测几何定位（见 paintStage 里那段注释），所以窗口尺寸一变必须重算。
// 原先没有任何 resize 监听：拖动真实窗口后播放头会留在旧的像素位置，
// 时间对、位置错——而这恰好是最难察觉的一种错，因为数字读数仍然是对的。
let resizeRaf = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeRaf);
  // applyCols 也必须重跑：列宽的像素下限是按当前可用宽度算的（见 applyCols 注释），
  // 只重排时间轴会留下一个「比例没跟着窗口走」的中间状态。
  resizeRaf = requestAnimationFrame(() => { applyCols(); syncDrawer(); renderTimeline(); });
});

document.querySelectorAll('[data-snap]').forEach((b) => b.addEventListener('click', () => {
  snap = Number(b.dataset.snap);
  document.querySelectorAll('[data-snap]').forEach((x) => x.className = 'seg-item' + (x === b ? ' seg-item-on' : ''));
}));
document.querySelectorAll('[data-zoom]').forEach((b) => b.addEventListener('click', () => {
  zoom = Number(b.dataset.zoom);
  document.querySelectorAll('[data-zoom]').forEach((x) => x.className = 'seg-item' + (x === b ? ' seg-item-on' : ''));
  renderTimeline();
}));

// ── 属性子轨 + 曲线编辑
function renderInspector() {
  const ch = CH.find((x) => x.id === selCh);
  if (!ch || !cardOn(ch.id)) {
    $('inspector').innerHTML = '<p class="text-2xs text-slate-400">点通道名前的箭头展开它的属性轨——每个属性各有一条曲线，原来这些曲线只存在于运行时代码里。</p>';
    return;
  }
  if (!ch.curves[selProp]) selProp = ch.main;
  const keys = Object.keys(ch.curves);
  $('inspector').innerHTML = `
    <div class="flex items-center justify-between gap-2">
      <span class="text-2xs font-semibold text-slate-600">${ch.label} · 属性轨</span>
      <span class="text-2xs tabular-nums text-slate-400" id="bezOut">cubic-bezier(${ch.curves[selProp].map((v) => v.toFixed(2)).join(', ')})</span>
    </div>
    ${ch.repeat ? `
    <!--
      错峰间隔原先是写死的 stagger: 10，只在渲染里用，**没有任何编辑入口**——
      而卡片上的「错峰间隔」已经按决策 #9 删掉了，第 769 行的注释还写着
      「错峰是时间（隔多久发一个）→ 时间轴」，宣称了时间轴并不拥有的东西。
      把它放在属性轨区而不是色块上：它是**轨道级**的时间属性（这条轨里每个粒子隔多久发一个），
      不是这一根色块的起点或长度，画成第三种拖拽手柄只会和拖块体 / 拖边缘打架。
    -->
    <div class="mt-2 flex items-center gap-2 rounded-lg bg-slate-50 px-2.5 py-1.5">
      <span class="shrink-0 text-2xs font-medium text-slate-600">错峰间隔</span>
      <div id="staggerSl" data-slider data-min="0" data-max="60" data-value="${staggerOf(ch)}" data-default="${(CH_DEFAULT.find((x) => x.id === ch.id).repeat || {}).stagger ?? 0}" data-snap="1" class="min-w-0 flex-1"></div>
      <span class="ctl-value shrink-0"><span data-out="staggerSl">${staggerOf(ch)}</span> ms</span>
      <span class="shrink-0 text-2xs text-slate-400">× ${cardVal('particle', '数量', ch.repeat.n)} 个 = ${cardVal('particle', '数量', ch.repeat.n) * staggerOf(ch)}ms 尾巴</span>
    </div>` : ''}
    <div class="mt-2 grid gap-2 group-data-[w=lg]/win:grid-cols-[minmax(0,1fr)_112px]">
      <div class="space-y-1">
        ${keys.map((k) => `
          <button class="flex w-full items-center gap-2 text-left" data-prop="${k}">
            <span class="w-14 shrink-0 truncate text-2xs ${k === selProp ? 'font-semibold text-slate-800' : 'text-slate-500'}">${k}</span>
            <span class="sub-lane ${k === selProp ? 'sub-lane-on' : ''} min-w-0 flex-1">
              <svg class="absolute inset-0 size-full" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
                <path d="${areaPath(ch.curves[k], 100, 20)}" fill="#0f172a" fill-opacity="${k === selProp ? 0.12 : 0.06}"/>
              </svg>
            </span>
            ${(ch.curves[k][1] > 1 || ch.curves[k][3] > 1) ? '<span class="shrink-0 rounded bg-amber-50 px-1 text-2xs font-medium text-amber-700">过冲</span>' : '<span class="w-6 shrink-0"></span>'}
          </button>`).join('')}
      </div>
      <div class="relative h-[68px] rounded-lg border border-slate-200 bg-white" data-curve>
        <svg class="absolute inset-0 size-full" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="0" y1="90" x2="100" y2="90" stroke="#e2e8f0" stroke-width="0.8"/>
          <line x1="0" y1="10" x2="100" y2="10" stroke="#eef2f6" stroke-width="0.8" stroke-dasharray="3 3"/>
          <path data-cp d="" fill="none" stroke="#0f172a" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="curve-handle" data-ch-h="1"></span>
        <span class="curve-handle" data-ch-h="2"></span>
      </div>
    </div>`;
  document.querySelectorAll('[data-prop]').forEach((b) => b.addEventListener('click', () => { selProp = b.dataset.prop; renderInspector(); }));
  if (ch.repeat) {
    // 拖动中只 paintStage()，松手才 renderTimeline()：错峰会改变总长（尾巴 = 数量 × 间隔），
    // 而 renderTimeline 会重建 inspector、把正在拖的那个滑块连根换掉。
    const out = $('inspector').querySelector('[data-out="staggerSl"]');
    Ctl.slider($('staggerSl'), {
      onChange: (v) => { markBefore(); ch.repeat.stagger = v; if (out) out.textContent = v; paintStage(); },
      onCommit: () => { renderTimeline(); touch(); },
    });
  }
  bindCurve(ch);
}
function bindCurve(ch) {
  const box = $('inspector').querySelector('[data-curve]');
  if (!box) return;
  const path = box.querySelector('[data-cp]');
  const hs = [box.querySelector('[data-ch-h="1"]'), box.querySelector('[data-ch-h="2"]')];
  const Y = (v) => 90 - v * 80, X = (v) => v * 100;
  function paintCurve() {
    const p = ch.curves[selProp];
    path.setAttribute('d', `M0 ${Y(0)} C ${X(p[0])} ${Y(p[1])}, ${X(p[2])} ${Y(p[3])}, 100 ${Y(1)}`);
    hs[0].style.left = X(p[0]) + '%'; hs[0].style.top = Y(p[1]) + '%';
    hs[1].style.left = X(p[2]) + '%'; hs[1].style.top = Y(p[3]) + '%';
    const over = p[1] > 1 || p[3] > 1;
    path.setAttribute('stroke', over ? '#d97706' : '#0f172a');
    const out = $('bezOut');
    if (out) out.textContent = `cubic-bezier(${p.map((v) => v.toFixed(2)).join(', ')})` + (over ? ' · 过冲' : '');
  }
  hs.forEach((h, i) => h.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); markBefore(); h.setPointerCapture(e.pointerId);
    const mv = (ev) => {
      const r = box.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
      const v = (90 - ((ev.clientY - r.top) / r.height) * 100) / 80;
      const p = ch.curves[selProp];
      p[i * 2] = x; p[i * 2 + 1] = Math.max(-0.3, Math.min(1.6, v));
      bezCache.clear();
      paintCurve();
      $('inspector').querySelectorAll('[data-prop]').forEach((b) => {
        if (b.dataset.prop !== selProp) return;
        b.querySelector('path').setAttribute('d', areaPath(ch.curves[selProp], 100, 20));
      });
      const bar = document.querySelector(`[data-bar="${ch.id}"] path`);
      if (bar && ch.main === selProp) bar.setAttribute('d', areaPath(ch.curves[selProp], 100, 20));
      paintStage();
    };
    // 松手才 renderTimeline()：拖动中只改 path 的 d（见上），因为 renderTimeline
    // 会重建 inspector、把正在拖的控制点连根换掉。
    // 而**必须**在松手时重渲染——曲线是决策 #9 判给时间轴的四样之一，
    // 轨道头的 dirty 点与「重置」按钮都由 isChDirty(ch) 决定，
    // 原先这条路径全程不重渲染轨道头，于是改了曲线永远等不到那个按钮出现：
    // 得先随便拖一下块体把按钮骗出来，再点它——而它当时还不还原曲线。
    const up = () => {
      h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up);
      renderTimeline(); touch();
    };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  }));
  paintCurve();
}

let cycleWarnAt = 0;
function cycleWarn(ch, want) {
  const now = performance.now();
  if (now - cycleWarnAt < 1800) return;
  cycleWarnAt = now;
  toast(`不能链接：会和「${ch.label}」形成环，已按绝对时间放置`);
}

/**
 * 舞台与轨道的**最小可用尺寸**，从卡片上的真实取值算出来。
 *
 * 为什么必须声明出来：全套布局都是 `min-h-0 flex-1`，所以窗口变小时
 * 它**永远不溢出、永远不裁切**，只是一路缩到没用。机械探针因此查不到任何异常——
 * 实测把窗口从 1440×892 换到真实默认的 960×680，五个页面「新增溢出 0、新增过小元素 0」，
 * 而舞台已经只有 224×41。**「装不下」不是溢出问题，是最小尺寸从没被表达过。**
 *
 * 所以改成按内容倒推并声明为硬下限，装不下时让它溢出 / 滚动 / 挤走抽屉，
 * 而不是静默缩成一条缝。数字全部取自卡片字段，改卡片这里就跟着变：
 *   波纹最大半径 120 → 直径 240
 *   粒子扩散半径 96  → 直径 192
 *   飘字上浮 64 + 字号 24 → 88
 */
function stageMin() {
  const need = [140];   // 空舞台也要放得下提示文案
  const needH = [140];
  if (cardOn('ripple')) { const d = cardVal('ripple', '最大半径', 120) * 2; need.push(d); needH.push(d); }
  if (cardOn('particle')) { const d = cardVal('particle', '扩散半径', 96) * 2; need.push(d); needH.push(d + 24); }
  if (cardOn('text')) { needH.push(cardVal('text', '上浮距离', 64) + 24); }
  // 上限兜一下：舞台不该为了一个 320px 的扩散半径把整个窗口撑爆，
  // 超过这个值就让舞台自己裁切（效果溢出边界在真实运行时也会发生）。
  return { w: Math.min(360, Math.max(...need)), h: Math.min(360, Math.max(...needH)) };
}

// ── 抽屉：折叠与拖高度
// 抽屉默认高度从 236 降到 176：抽屉每多占 1px 舞台就少 1px，
// 而舞台原先只有 143px、装不下自己要画的 208px 波纹。
// **高度不能再写死**：原先 236/176 都是在 892px 外壳里挑的，换到真实默认的 680px
// 窗口后抽屉仍占 225px，把舞台压到 41px。现在按可用高度夹取，舞台的最小值优先。
// drawerH 是**用户意图**（拖出来的期望高度），只有拖拽会改它。
// 生效高度由 effectiveDrawerH() 现算。两者必须分开：
// 我第一版把夹取直接写回 drawerH，结果窗口一变小就把期望值永久改小了，
// 再切回大屏也回不来（实测三档都停在 140，而大屏本该是 176）。
// 「窗口小」是暂时的约束，不该吃掉用户的偏好。
let drawerOpen = true, drawerH = 176;
function drawerMaxH() {
  const stack = $('drawerBody').closest('#mockWindow') || document.body;
  const avail = stack.getBoundingClientRect().height;
  // 外壳固定占用：标题栏 32 + 工作区导航 ~44 + 动作页签 ~64 + 预览工具条 ~96 + 抽屉标题行 ~34 + 边距
  const chrome = 300;
  return Math.max(120, Math.min(460, avail - chrome - stageMin().h));
}
const effectiveDrawerH = () => Math.max(120, Math.min(drawerH, drawerMaxH()));

/**
 * 窄窗口下抽屉默认折叠。
 *
 * 纵向预算算给你看：真实默认窗口 960×680 的主区只有 596px，而
 * 动作页签 56 + 舞台最小 240 + 预览工具条与输出行 ~120 + 抽屉 140 = 556，
 * 只剩 40px 给配置卡列——**三者不可能同时展开**。
 * 折叠抽屉是唯一不牺牲正确性的取舍：README 已经为折叠态设计了标题行摘要
 * （N 条轨道 · N 条已链接 · 播放头 xxx ms），所以收起来不丢上下文；
 * 而用户要调时间时展开它，此时舞台按 drawerMaxH 让出高度。这正是「抽屉」这个形态存在的理由。
 *
 * 只在**首次布局**时决定，之后尊重用户的展开/折叠意图——
 * 否则每次改窗口大小都把用户刚展开的抽屉再收起来，是 README 说的「联动必须双向」的反面。
 */
let drawerAutoDecided = false;
function autoCollapseDrawerIfTight() {
  if (drawerAutoDecided) return;
  const win = $('drawerBody').closest('#mockWindow');
  if (!win || !win.getBoundingClientRect().height) return;
  drawerAutoDecided = true;
  if (drawerMaxH() <= 150) drawerOpen = false;
}
function syncDrawer() {
  autoCollapseDrawerIfTight();
  const body = $('drawerBody');
  body.classList.toggle('hidden', !drawerOpen);
  const st = $('stage');
  const min = stageMin();
  st.style.minHeight = min.h + 'px';
  st.style.minWidth = min.w + 'px';
  body.style.height = effectiveDrawerH() + 'px';
  $('drawerChevron').classList.toggle('-rotate-90', !drawerOpen);
  $('drawerToggle').setAttribute('aria-label', drawerOpen ? '折叠时间轴' : '展开时间轴');
  // 折叠时把关键信息提到标题行，否则抽屉收起来就完全失去上下文
  const list = chLanes();
  $('drawerSummary').textContent = drawerOpen
    ? ''
    : `${list.length} 条轨道 · ${list.filter((c) => c.ref !== 'trigger').length} 条已链接 · 播放头 ${Math.round(t)}ms`;
  if (drawerOpen) renderTimeline();
}
// 用户亲手开合过就锁定，窗口尺寸变化不再替他决定（见 autoCollapseDrawerIfTight）
$('drawerToggle').addEventListener('click', () => { drawerAutoDecided = true; drawerOpen = !drawerOpen; syncDrawer(); });
$('drawerGrip').addEventListener('pointerdown', (e) => {
  if (!drawerOpen) return;
  $('drawerGrip').setPointerCapture(e.pointerId);
  const y0 = e.clientY, h0 = drawerH;
  // 上限由可用高度算，不再是写死的 460——在 680px 窗口里 460px 抽屉是不合理的上限
  const mv = (ev) => { drawerH = Math.max(120, Math.min(drawerMaxH(), h0 - (ev.clientY - y0))); syncDrawer(); };
  const up = () => { $('drawerGrip').removeEventListener('pointermove', mv); $('drawerGrip').removeEventListener('pointerup', up); };
  $('drawerGrip').addEventListener('pointermove', mv);
  $('drawerGrip').addEventListener('pointerup', up);
});

// ── 把所有字段注册进 ⌘K：390 个配置决策的可发现性，靠搜索而不是分组
function registerFields() {
  const items = [];
  for (const c of CARDS) {
    const shown = (c.fields || []).map((f) => f.label);
    const hidden = (c.groups || []).flatMap(([, fs]) => fs);
    for (const label of [...shown, ...hidden]) {
      const inGroup = !shown.includes(label);
      items.push([`${c.name} · ${label}`, inGroup ? '其余项' : '', () => revealField(c.key, label, inGroup)]);
    }
  }
  registerCommands('字段', items);
}
// ════ 时间 chip：卡片与时间轴之间的桥 ════════════════════
//
// 决策 #9：时间轴是时间的**唯一编辑面**，卡片只管外观。
// 但「时间只在别处能改」不等于「卡片上看不到时间」——那样调手感时得先猜。
// 所以卡片上留一枚**只读** chip 显示当前时间关系，点它跳到对应轨。
//
// 为什么不做成双向同步的输入框：同步能修掉「两个面互相说谎」，
// 但修不掉更根本的一条——**关系型时间没法用数字框表达**。
// 「飘字起点 = 波纹峰值 + 40ms」这种锚点链接塞进输入框只能退化成绝对毫秒，
// 而那正是走查里已经踩过的坑（链接目标被关掉后固化成绝对时间）。
const CARD_TO_CHANNEL = { trigger: 'trigger', text: 'text', particle: 'particle', ripple: 'ripple', audio: 'audio' };

function timeChipText(cardKey) {
  if (cardKey === 'trigger') return `节流 ${TRIGGER.throttle}ms · 连击窗 ${TRIGGER.comboWindow}ms`;
  const ch = CH.find((c) => c.id === CARD_TO_CHANNEL[cardKey]);
  if (!ch) return '';
  if (ch.ref === 'trigger') return `${ch.dur}ms · 跟随触发${ch.off ? ` +${ch.off}ms` : ''}`;
  const [refId, refAnchor] = ch.ref.split('.');
  const refCh = CH.find((c) => c.id === refId);
  const anchorName = { emit: '发出', peak: '峰值', spread: '扩散', in: '入场', onset: '起音' }[refAnchor] || refAnchor;
  const sign = ch.off === 0 ? '' : (ch.off > 0 ? ` +${ch.off}ms` : ` ${ch.off}ms`);
  return `${ch.dur}ms · ${refCh ? refCh.label : refId}${anchorName}${sign}`;
}

function timeChip(cardKey) {
  if (!CARD_TO_CHANNEL[cardKey]) return '';
  // chip **可收缩且截断**（不是 shrink-0）：窄配置列下必须有东西让位，
  // 而它是最该让的那个——同一份时间信息在时间轴上还有一份，卡名没有第二份。
  // title 里给出全文，截断后仍可查证。
  return `<button data-jumptrack="${cardKey}" class="inline-flex min-w-0 shrink items-center gap-1 rounded-lg bg-slate-50 px-1.5 py-0.5 text-2xs font-medium text-slate-500 ring-1 ring-slate-200 transition-colors hover:bg-slate-100 hover:text-slate-900"
    title="${timeChipText(cardKey)} —— 时间在时间轴上编辑，点这里跳过去">
    <svg class="size-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span class="truncate">${timeChipText(cardKey)}</span>
  </button>`;
}

// 反向跳转：卡片 → 时间轴。与 revealField（⌘K → 卡片）对称。
function revealTrack(cardKey) {
  const chId = CARD_TO_CHANNEL[cardKey];
  if (!chId) return;
  if (!drawerOpen) { drawerOpen = true; syncDrawer(); }   // 抽屉收着就先展开，否则跳过去什么也看不到
  renderTimeline();
  // 轨道行的标识是 data-lane-id（挂在 .tl-lane 上），高亮它的父行更完整
  const lane = document.querySelector(`[data-lane-id="${chId}"]`);
  const target = lane?.parentElement || lane || document.getElementById('drawer');
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('ring-2', 'ring-slate-400', 'rounded-lg');
  setTimeout(() => target.classList.remove('ring-2', 'ring-slate-400', 'rounded-lg'), 1400);
}

function revealField(cardKey, label, inGroup) {
  const c = CARDS.find((x) => x.key === cardKey);
  if (!c.always && !c.on) { c.on = true; renderTimeline(); }   // 字段所在的效果没开就先开
  if (inGroup) c.more = true;
  renderCards(); renderOutputs();
  const card = [...document.querySelectorAll('.cfg-card')].find((el) => el.textContent.includes(c.name));
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // 命中的字段闪一下：跳过去还得自己找是没闭环的
  const hit = [...card.querySelectorAll('span, div')].find((el) => el.children.length === 0 && el.textContent.trim() === label);
  const target = hit?.closest('.ctl-row, .ctl-row-wide, .grid') || hit;
  if (target) {
    target.classList.add('ring-2', 'ring-slate-400', 'rounded-lg');
    setTimeout(() => target.classList.remove('ring-2', 'ring-slate-400', 'rounded-lg'), 1400);
  }
}

function syncHint() {
  const a = ACTIONS.find((x) => x.id === actionId);
  $('hintGesture').textContent = a.gesture;
  $('stageHint').classList.remove('hidden');
  renderTimeline();
}
window.addEventListener('resize', () => renderTimeline());

// ── 布局预设






renderActions(); renderCards(); renderOutputs(); syncHint(); syncLayout(); syncDrawer(); registerFields();
</script>
</body>
</html>
