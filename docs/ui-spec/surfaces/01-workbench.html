<script>
mountShell({ active: 'workbench', mainClass: 'flex min-w-0 flex-1 flex-col overflow-hidden bg-slate-50',
  proto: [['normal', '① 常规'], ['collapsed', '② 侧边栏折叠'], ['cmdk', '③ 命令面板 ⌘K']],
  hint: '舞台可点击触发 · 拖播放头定格 · 拖色块到锚点建立链接 · 预设 chip 可点 · ⌘Z 撤销',
  onProto: (id) => {
    if (id === 'collapsed') setSidebar(true);
    else if (id === 'cmdk') { setSidebar(false); toggleCmdk(true); }
    else { setSidebar(false); toggleCmdk(false); }
  } });
// 布局预设 + 自由拖拽：外壳出按钮，页面出实现（列宽是页面自己的事）
//
// 权重与夹取区间照 useWorkbenchColumnLayout.ts 的模型来：预设只是权重的三个档位，
// 拖分隔条是连续档。拖过之后不再高亮任何预设——当前比例已经不是那三档里的任何一个，
// 继续亮着会谎报状态。
const LAYOUTS = { config: [1.6, 1], split: [1, 1], preview: [0.8, 1.7] };
const COL_MIN = 0.62, COL_MAX = 1.9;
const clampCol = (v) => Math.min(COL_MAX, Math.max(COL_MIN, v));
let weights = [...LAYOUTS.config];
let layout = 'config';

function applyCols() {
  document.getElementById('cols').style.gridTemplateColumns =
    `minmax(0,${weights[0]}fr) 4px minmax(0,${weights[1]}fr)`;
}
function syncLayout() {
  applyCols();
  document.querySelectorAll('[data-shell-layout]').forEach((b) => b.classList.toggle('layout-btn-on', b.dataset.shellLayout === layout));
}
document.querySelectorAll('[data-shell-layout]').forEach((b) => b.addEventListener('click', () => {
  layout = b.dataset.shellLayout;
  weights = [...LAYOUTS[layout]];
  syncLayout();
}));

// 拖分隔条：按像素位移换算权重增量，与真实代码一致地用「总权重守恒」的方式挪，
// 这样另一列不会被挤没。
function startColDrag(startX) {
  const total = weights[0] + weights[1];
  const gridW = document.getElementById('cols').clientWidth || 1;
  const start = [...weights];
  const onMove = (e) => {
    const deltaWeight = ((e.clientX ?? startX) - startX) / gridW * total;
    const left = clampCol(start[0] + deltaWeight);
    weights = [left, clampCol(total - left)];
    layout = '';            // 已是自定义比例，不再谎称命中某个预设
    applyCols();
    document.querySelectorAll('[data-shell-layout]').forEach((b) => b.classList.remove('layout-btn-on'));
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    toast('已调整列宽', () => { weights = [...start]; applyCols(); });
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
document.getElementById('colSplit').addEventListener('pointerdown', (e) => { e.preventDefault(); startColDrag(e.clientX); });
// 键盘可达：分隔条不能只能用鼠标拖（决策 #4 同源——操作不得只有一种到达方式）
document.getElementById('colSplit').addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.12 : 0.04;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const total = weights[0] + weights[1];
  const left = clampCol(weights[0] + (e.key === 'ArrowRight' ? step : -step));
  weights = [left, clampCol(total - left)];
  layout = '';
  applyCols();
  document.querySelectorAll('[data-shell-layout]').forEach((b) => b.classList.remove('layout-btn-on'));
});
</script>

const ICONS = {

      { label: '形状', type: 'select', value: '圆点', options: ['圆点', '方块', '星形', '钻石'] },

];

const ACTIONS = [
  { id: 'leftClick', label: '左键单击', gesture: '单击', enabled: 3 },
  { id: 'rightClick', label: '右键单击', gesture: '右键单击', enabled: 1 },
  { id: 'doubleClick', label: '双击', gesture: '双击', enabled: 0 },
  { id: 'longPress', label: '长按', gesture: '长按', enabled: 2 },
  { id: 'wheel', label: '滚轮', gesture: '滚动', enabled: 0 },
];
let actionId = 'leftClick';




// ── 渲染：动作标签
function renderActions() {
  $('actionTabs').innerHTML = ACTIONS.map((a) => `
    <button data-action="${a.id}" class="action-tab${a.id === actionId ? ' action-tab-on' : ''}">
      ${a.label}
      ${a.enabled ? `<span class="count-badge">${a.enabled}</span>` : '<span class="text-2xs font-normal opacity-50">未配置</span>'}
    </button>`).join('');
  document.querySelectorAll('[data-action]').forEach((b) => b.addEventListener('click', () => {
    actionId = b.dataset.action; renderActions(); syncHint();
  }));
}


// ── 渲染：效果卡

  $('cardCol').innerHTML = CARDS.map((c) => {
    const on = c.always || c.on;
    if (!on) {
      // 未启用 → 收成一行
      return `<div class="cfg-card">
        <div class="cfg-head">
          <span class="cfg-icon"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[c.key]}</svg></span>
          <span class="min-w-0 flex-1">
            <span class="cfg-name">${c.name}</span>
            <span class="ml-2 text-2xs text-slate-400">${c.total} 项设置</span>
          </span>
          <button data-toggle="${c.key}" class="switch-knob" aria-label="启用${c.name}"></button>
        </div>

          </span>

          // 摆一个点了没反应的按钮比不摆更糟（同 README 决策 #4 的精神）。
          const changed = (c.fields || []).filter((f) => f.src === 'custom' || f.src === 'ai').length;

          <svg class="size-3.5 transition-transform ${c.folded ? '' : 'rotate-90'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        ${c.always ? '' : `<button data-toggle="${c.key}" class="switch-knob switch-on" aria-label="关闭${c.name}"></button>`}

          </div>
          <div class="flex flex-wrap gap-1.5">
            ${(() => {
              const changed = (c.fields || []).some((f) => f.src === 'custom' || f.src === 'ai');
              return c.presets.map((p) => {
                const on = p === c.preset;
                // 套了预设又手改过，chip 不能继续假装「就是这个预设」
                return `<button data-preset="${c.key}|${p}" class="preset-chip${on ? ' preset-chip-on' : ''}">${p}${on && changed ? '<span class="ml-1 font-normal opacity-70">·已改</span>' : ''}</button>`;
              }).join('') + (changed ? `<button data-represet="${c.key}" class="preset-chip border-dashed">回到「${c.preset}」</button>` : '');
            })()}
          </div>
        </div>
        ${fields ? `<div class="space-y-2.5 border-t border-slate-100 pt-3">${fields}</div>` : ''}
        ${c.total > shown ? `
          <div class="border-t border-slate-100 pt-2.5">
            <button data-more="${c.key}" class="flex w-full items-center gap-1.5 text-2xs font-medium text-slate-500 transition-colors hover:text-slate-900">
              <svg class="size-3 transition-transform ${c.more ? 'rotate-90' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
              其余 ${c.total - shown} 项

            </button>

              ${c.groups.map(([g, fields]) => `
                <div class="rounded-lg bg-slate-50 px-2.5 py-2">

                  </div>
                </div>`).join('')}
            </div>` : ''}
          </div>` : ''}
      </div>
    </div>`;
  }).join('');
  bindCardEvents();
  bindCardChrome();
}

// 折叠与重置。两者都是「卡级」操作，与效果开关分开：
// 折叠只影响视觉密度（配置仍然生效），关闭才是不出效果。把它们混成一个控件
// 会让「我只是想少占点地方」变成「我把效果关了」。
function bindCardChrome() {
  document.querySelectorAll('[data-cardfold]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.cardfold);
    c.folded = !c.folded;
    renderCards();
  }));
  document.querySelectorAll('[data-cardreset]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.cardreset);
    const before = c.fields.map((f) => ({ value: f.value, src: f.src }));
    const n = before.filter((s) => s.src === 'custom' || s.src === 'ai').length;
    c.fields.forEach((f) => {
      if (f.src !== 'custom' && f.src !== 'ai') return;
      if (f.presetValue !== undefined) f.value = f.presetValue;
      f.src = 'preset';
    });
    renderCards(); renderOutputs(); renderTimeline();
    toast(`已重置「${c.name}」· ${n} 项回到「${c.preset}」`, () => {
      c.fields.forEach((f, i) => { f.value = before[i].value; f.src = before[i].src; });
      renderCards(); renderOutputs(); renderTimeline();
    });
  }));
}

const SRC = {
  preset:  ['bg-slate-300', '来自预设'],
  ai:      ['bg-sky-400', 'AI 建议'],
  custom:  ['bg-slate-900', '你改过'],
};
function srcDot(cardKey, f) {
  const meta = SRC[f.src];

  return `<span data-revert="${cardKey}|${f.label}" class="size-1.5 shrink-0 rounded-full ${meta[0]}" title="${meta[1]}${revert}"></span>`;
}
function renderField(cardKey, f, i) {
  const id = `f-${cardKey}-${i}`;

    return `<div class="grid grid-cols-[104px_minmax(0,1fr)] items-center gap-2.5">
      <span class="field-label">${f.label}${srcDot(cardKey, f)}</span>

  </div>`;
}

function mountCardControls() {
  // 形状类字段画出图形，其余给纯文字选项——都走同一个下拉实现
  document.querySelectorAll('[data-select]').forEach((el) => {
    if (el.dataset.mounted) return;
    el.dataset.mounted = '1';
    const [key, label] = el.dataset.select.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    const isShape = label === '形状';
    Ctl.select(el, {
      options: f.options.map((o) => ({ label: o, thumb: isShape ? Ctl.shapeThumb(o) : undefined })),
      value: f.value,
      onChange: (v) => {
        const before = f.value;
        f.value = v; f.src = 'custom';
        renderCards();
        const undo = () => { f.value = before; renderCards(); return () => { f.value = v; renderCards(); return undo; }; };
        toast(`「${c.name} · ${label}」已改为 ${v}`, undo);
      },
    });
  });
  document.querySelectorAll('[data-slider]:not([data-mounted])').forEach((el) => {
    el.dataset.mounted = '1';
    const out = document.querySelector(`[data-out="${el.id}"]`);
    const [key, label] = (el.dataset.field || '').split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c?.fields.find((x) => x.label === label);
    Ctl.slider(el, {
      onChange: (v) => { if (out) out.textContent = v; if (f) f.value = v; },
      onCommit: (v) => {
        if (!f) return;
        if (f.presetValue === undefined) f.presetValue = v;
        f.src = 'custom';
        renderCards(); touch();
      },
    });
  });
}

function bindCardEvents() {
  mountCardControls();
  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.toggle);
    const before = { on: !!c.on, links: CH.map((x) => ({ id: x.id, ref: x.ref, off: x.off })) };
    // 必须在翻转开关**之前**固化链接：之后再算 startOf 会走「目标已关闭」的降级
    // 路径，固化下来的是 off 而不是原本的绝对位置，色块会跳到时间轴开头。
    const broken = c.on ? breakLinksTo(c.key) : [];
    c.on = !c.on;
    const act = ACTIONS.find((a) => a.id === actionId);
    act.enabled = CARDS.filter((x) => !x.always && x.on).length;
    renderCards(); renderActions(); renderOutputs(); renderTimeline();
    const after = { on: c.on, links: CH.map((x) => ({ id: x.id, ref: x.ref, off: x.off })) };
    const apply = (snap) => {
      c.on = snap.on;
      snap.links.forEach((l) => { const ch = CH.find((x) => x.id === l.id); if (ch) { ch.ref = l.ref; ch.off = l.off; } });
      act.enabled = CARDS.filter((x) => !x.always && x.on).length;
      renderCards(); renderActions(); renderOutputs(); renderTimeline();
    };
    // 撤销函数返回重做函数，⌘⇧Z 才有东西可用
    const restore = () => { apply(before); return () => { apply(after); return restore; }; };
    toast(`${c.on ? '已启用' : '已关闭'}「${c.name}」`
      + (broken.length ? ` · ${broken.join('、')}的链接已固化为绝对时间` : ''), restore);
  }));
  document.querySelectorAll('[data-more]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.more);
    c.more = !c.more;
    renderCards();
  }));
  document.querySelectorAll('[data-represet]').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.key === b.dataset.represet);
    const before = (c.fields || []).map((f) => ({ f, v: f.value, src: f.src }));
    (c.fields || []).forEach((f) => {
      if ((f.src === 'custom' || f.src === 'ai') && f.presetValue !== undefined) { f.value = f.presetValue; f.src = 'preset'; }
    });
    renderCards();
    const undo = () => { before.forEach(({ f, v, src }) => { f.value = v; f.src = src; }); renderCards(); return () => { document.querySelector(`[data-represet="${c.key}"]`)?.click(); return undo; }; };
    toast(`「${c.name}」已回到预设 ${c.preset}`, undo);
  }));
  document.querySelectorAll('[data-revert]').forEach((el) => el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const [key, label] = el.dataset.revert.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.label === label);
    if (f.presetValue === undefined) return;
    const before = { v: f.value, src: f.src };
    f.value = f.presetValue; f.src = 'preset';
    renderCards();
    toast(`「${label}」已回到预设值 ${f.presetValue}`, () => { f.value = before.v; f.src = before.src; renderCards(); });
  }));
  document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
    const [key, p] = b.dataset.preset.split('|');
    const c = CARDS.find((x) => x.key === key);
    const before = c.preset;
    c.preset = p;
    (c.fields || []).forEach((f) => { if (f.src === 'custom' || f.src === 'ai') f.src = 'preset'; });
    renderCards();
    const undo = () => { c.preset = before; renderCards(); return () => { c.preset = p; renderCards(); return undo; }; };
    toast(`「${c.name}」已套用预设 ${p}`, undo);
  }));
  document.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', () => {
    const [key, color] = b.dataset.color.split('|');
    const c = CARDS.find((x) => x.key === key);
    const f = c.fields.find((x) => x.type === 'color');
    const before = f.value; f.value = color;
    c.tweaked = true;
    renderCards();
    const undo = () => { f.value = before; renderCards(); return () => { f.value = color; renderCards(); return undo; }; };
    toast(`「${c.name}」颜色已更新`, undo);
  }));
}

// ── 输出标签
function renderOutputs() {
  const on = CARDS.filter((c) => !c.always && c.on);
  $('outputTags').innerHTML = on.length
    ? on.map((c) => `<span class="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-0.5 text-2xs font-medium text-slate-600">
        <svg class="size-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">${ICONS[c.key]}</svg>${c.name}</span>`).join('')
    : '<span class="text-2xs text-slate-400">还没有开启任何效果 —— 打开下方任意一张卡</span>';
}

// ══════════════════════════════════════════════════════════════════
// 预览 + 时间轴
//
// 功能层的重构（不是给旧结构换皮）：
//  1. 通道不再是「有起点和长度的黑盒」，而是暴露语义**锚点**（emit / peak /
//     spread / onset）。锚点是节奏的接点。
//  2. 通道的起点可以**链接到别人的锚点**（相对时间），而不是各写一个绝对延迟。
//     这样改一个时长，其余通道的节奏关系不会散。
//  3. 每条通道的**属性各有自己的曲线**（半径 / 位移 / 缩放 / 不透明度），
//     在属性子轨里可见可编。原来 7 段弹簧只存在于运行时代码里。
//  4. **重复 / 错峰**是轨道属性：粒子数 × 错峰间隔在色块里画成刻度，
//     不再是一个看不见的乘数。
//  5. 触发本身（节流窗 / 连击窗 / 第二次点击）和效果放在**同一把标尺**上。
//  6. 舞台与时间轴共用**唯一播放头**：任意毫秒可定格，可只循环一段区间。
// ══════════════════════════════════════════════════════════════════

const CH_DEFAULT = [
  { id: 'ripple', label: '波纹', ref: 'trigger', off: 0, dur: 620,
    anchors: [['emit', 0], ['peak', 0.62]],
    curves: { 半径: [0, 0, .2, 1], 不透明度: [.4, 0, 1, 1] }, main: '半径' },
  { id: 'particle', label: '粒子', ref: 'ripple.peak', off: 0, dur: 900,
    anchors: [['emit', 0], ['spread', 0.55]],
    curves: { 扩散: [.2, .6, .3, 1], 不透明度: [.3, 0, 1, 1] }, main: '扩散',
    repeat: { n: 14, stagger: 10 } },
  { id: 'text', label: '飘字', ref: 'ripple.peak', off: 40, dur: 820,
    anchors: [['in', 0], ['peak', 0.3]],
    curves: { 上浮: [.2, .7, .3, 1], 缩放: [.34, 1.56, .64, 1], 不透明度: [.4, 0, .6, 1] }, main: '上浮' },
  { id: 'audio', label: '音效', ref: 'trigger', off: 0, dur: 120,
    anchors: [['onset', 0]], curves: { 音量: [0, 0, 1, 1] }, main: '音量' },
];
const clone = (a) => a.map((c) => ({ ...c, anchors: c.anchors.map((x) => [...x]), curves: Object.fromEntries(Object.entries(c.curves).map(([k, v]) => [k, [...v]])), repeat: c.repeat ? { ...c.repeat } : undefined }));
let CH = clone(CH_DEFAULT);
let CH_BEFORE = clone(CH_DEFAULT);   // A/B 参照

const TRIGGER = { throttle: 60, comboWindow: 900, secondClick: 260 };
let t = 0, playing = false, speed = 1, snap = 20, zoom = 1;
let onion = false, ab = false, loopOn = false, loopIn = 0, loopOut = 0;
let selCh = 'text', selProp = '上浮';
let origin = { x: 0.44, y: 0.52 };
const LABEL_W = 132, LABEL_GAP = 10;   // 与 .tl-row 的 grid 与 gap 严格一致，否则标尺与色块错位

// 三次贝塞尔：按 x 二分反解再取 y
function bez(p) {
  const [x1, y1, x2, y2] = p;
  const f = (a, b) => (u) => 3 * (1 - u) ** 2 * u * a + 3 * (1 - u) * u * u * b + u ** 3;
  const fx = f(x1, x2), fy = f(y1, y2);
  return (x) => { let lo = 0, hi = 1, u = x; for (let i = 0; i < 18; i += 1) { u = (lo + hi) / 2; if (fx(u) < x) lo = u; else hi = u; } return fy(u); };
}
const bezCache = new Map();
const easeOf = (p) => { const k = p.join(','); if (!bezCache.has(k)) bezCache.set(k, bez(p)); return bezCache.get(k); };

const cardOn = (id) => { const c = CARDS.find((x) => x.key === id); return c ? (c.always || c.on) : false; };
// 独奏优先于静音：有独奏时只播独奏的；否则排除静音的
function chList(set) {
  const on = (set || CH).filter((c) => cardOn(c.id));
  const soloed = on.filter((c) => c.solo);
  return (soloed.length ? soloed : on).filter((c) => !c.mute);
}
// 时间轴要把静音轨也画出来（只是标成静音），所以另给一个「全部可见轨道」
const chLanes = (set) => (set || CH).filter((c) => cardOn(c.id));
function anchorAt(ch, name) { const a = ch.anchors.find((x) => x[0] === name); return a ? a[1] : 0; }
// 目标通道被关掉时，把链接固化成当时的绝对时间并明确告知。
// 原来 startOf 里静默 fallback，色块会跳位置且不给任何解释。
function breakLinksTo(deadId) {
  const broken = [];
  for (const ch of CH) {
    if (ch.ref === 'trigger' || ch.ref.split('.')[0] !== deadId) continue;
    const abs = Math.round(startOf(ch));
    ch.ref = 'trigger';
    ch.off = abs;
    broken.push(ch.label);
  }
  return broken;
}
// 拒绝环：A 链到 B、B 又链回 A 会让节奏无解
function wouldCycle(ch, ref) {
  let cur = ref.split('.')[0];
  const seen = new Set([ch.id]);
  while (cur) {
    if (seen.has(cur)) return true;
    seen.add(cur);
    const next = CH.find((x) => x.id === cur);
    if (!next || next.ref === 'trigger') return false;
    cur = next.ref.split('.')[0];
  }
  return false;
}
function startOf(ch, set, seen) {
  const list = set || CH;
  const guard = seen || new Set();
  if (guard.has(ch.id)) return 0;
  guard.add(ch.id);
  if (ch.ref === 'trigger') return Math.max(0, ch.off);
  const [tid, aname] = ch.ref.split('.');
  const target = list.find((x) => x.id === tid);
  if (!target || !cardOn(tid)) return Math.max(0, ch.off);
  return Math.max(0, startOf(target, list, guard) + target.dur * anchorAt(target, aname) + ch.off);
}
function totalOf(set) {
  const list = chList(set);
  const ends = list.map((c) => startOf(c, set) + c.dur + (c.repeat ? c.repeat.n * c.repeat.stagger : 0));
  return Math.max(400, Math.ceil(Math.max(TRIGGER.comboWindow, ...ends, 0) / 20) * 20);
}
const totalMs = () => totalOf(CH);

// ── 舞台：一帧 = 时间的纯函数，所以拖播放头能精确定格
function renderFrame(time, host, set) {

  if (!ch.curves[selProp]) selProp = ch.main;
  const keys = Object.keys(ch.curves);
  $('inspector').innerHTML = `
    <div class="flex items-center justify-between gap-2">
      <span class="text-2xs font-semibold text-slate-600">${ch.label} · 属性轨</span>
      <span class="text-2xs tabular-nums text-slate-400" id="bezOut">cubic-bezier(${ch.curves[selProp].map((v) => v.toFixed(2)).join(', ')})</span>
    </div>
    <div class="mt-2 grid gap-2 sm:grid-cols-[minmax(0,1fr)_112px]">
      <div class="space-y-1">
        ${keys.map((k) => `
          <button class="flex w-full items-center gap-2 text-left" data-prop="${k}">
            <span class="w-14 shrink-0 truncate text-2xs ${k === selProp ? 'font-semibold text-slate-800' : 'text-slate-500'}">${k}</span>
            <span class="sub-lane ${k === selProp ? 'sub-lane-on' : ''} min-w-0 flex-1">
              <svg class="absolute inset-0 size-full" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
                <path d="${areaPath(ch.curves[k], 100, 20)}" fill="#0f172a" fill-opacity="${k === selProp ? 0.12 : 0.06}"/>
              </svg>
            </span>
            ${(ch.curves[k][1] > 1 || ch.curves[k][3] > 1) ? '<span class="shrink-0 rounded bg-amber-50 px-1 text-2xs font-medium text-amber-700">过冲</span>' : '<span class="w-6 shrink-0"></span>'}
          </button>`).join('')}
      </div>
      <div class="relative h-[68px] rounded-lg border border-slate-200 bg-white" data-curve>
        <svg class="absolute inset-0 size-full" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="0" y1="90" x2="100" y2="90" stroke="#e2e8f0" stroke-width="0.8"/>
          <line x1="0" y1="10" x2="100" y2="10" stroke="#eef2f6" stroke-width="0.8" stroke-dasharray="3 3"/>
          <path data-cp d="" fill="none" stroke="#0f172a" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="curve-handle" data-ch-h="1"></span>
        <span class="curve-handle" data-ch-h="2"></span>
      </div>
    </div>`;
  document.querySelectorAll('[data-prop]').forEach((b) => b.addEventListener('click', () => { selProp = b.dataset.prop; renderInspector(); }));
  bindCurve(ch);
}
function bindCurve(ch) {
  const box = $('inspector').querySelector('[data-curve]');
  if (!box) return;
  const path = box.querySelector('[data-cp]');
  const hs = [box.querySelector('[data-ch-h="1"]'), box.querySelector('[data-ch-h="2"]')];
  const Y = (v) => 90 - v * 80, X = (v) => v * 100;
  function paintCurve() {
    const p = ch.curves[selProp];
    path.setAttribute('d', `M0 ${Y(0)} C ${X(p[0])} ${Y(p[1])}, ${X(p[2])} ${Y(p[3])}, 100 ${Y(1)}`);
    hs[0].style.left = X(p[0]) + '%'; hs[0].style.top = Y(p[1]) + '%';
    hs[1].style.left = X(p[2]) + '%'; hs[1].style.top = Y(p[3]) + '%';
    const over = p[1] > 1 || p[3] > 1;
    path.setAttribute('stroke', over ? '#d97706' : '#0f172a');
    const out = $('bezOut');
    if (out) out.textContent = `cubic-bezier(${p.map((v) => v.toFixed(2)).join(', ')})` + (over ? ' · 过冲' : '');
  }
  hs.forEach((h, i) => h.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
    const mv = (ev) => {
      const r = box.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
      const v = (90 - ((ev.clientY - r.top) / r.height) * 100) / 80;
      const p = ch.curves[selProp];
      p[i * 2] = x; p[i * 2 + 1] = Math.max(-0.3, Math.min(1.6, v));
      bezCache.clear();
      paintCurve();
      $('inspector').querySelectorAll('[data-prop]').forEach((b) => {
        if (b.dataset.prop !== selProp) return;
        b.querySelector('path').setAttribute('d', areaPath(ch.curves[selProp], 100, 20));
      });
      const bar = document.querySelector(`[data-bar="${ch.id}"] path`);
      if (bar && ch.main === selProp) bar.setAttribute('d', areaPath(ch.curves[selProp], 100, 20));
      paintStage();
    };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); touch(); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  }));
  paintCurve();
}

let cycleWarnAt = 0;
function cycleWarn(ch, want) {
  const now = performance.now();
  if (now - cycleWarnAt < 1800) return;
  cycleWarnAt = now;
  toast(`不能链接：会和「${ch.label}」形成环，已按绝对时间放置`);
}

// ── 抽屉：折叠与拖高度
let drawerOpen = true, drawerH = 236;
function syncDrawer() {
  const body = $('drawerBody');
  body.classList.toggle('hidden', !drawerOpen);
  body.style.height = drawerH + 'px';
  $('drawerChevron').classList.toggle('-rotate-90', !drawerOpen);
  $('drawerToggle').setAttribute('aria-label', drawerOpen ? '折叠时间轴' : '展开时间轴');
  // 折叠时把关键信息提到标题行，否则抽屉收起来就完全失去上下文
  const list = chLanes();
  $('drawerSummary').textContent = drawerOpen
    ? ''
    : `${list.length} 条轨道 · ${list.filter((c) => c.ref !== 'trigger').length} 条已链接 · 播放头 ${Math.round(t)}ms`;
  if (drawerOpen) renderTimeline();
}
$('drawerToggle').addEventListener('click', () => { drawerOpen = !drawerOpen; syncDrawer(); });
$('drawerGrip').addEventListener('pointerdown', (e) => {
  if (!drawerOpen) return;
  $('drawerGrip').setPointerCapture(e.pointerId);
  const y0 = e.clientY, h0 = drawerH;
  const mv = (ev) => { drawerH = Math.max(150, Math.min(460, h0 - (ev.clientY - y0))); syncDrawer(); };
  const up = () => { $('drawerGrip').removeEventListener('pointermove', mv); $('drawerGrip').removeEventListener('pointerup', up); };
  $('drawerGrip').addEventListener('pointermove', mv);
  $('drawerGrip').addEventListener('pointerup', up);
});

// ── 把所有字段注册进 ⌘K：390 个配置决策的可发现性，靠搜索而不是分组
function registerFields() {
  const items = [];
  for (const c of CARDS) {
    const shown = (c.fields || []).map((f) => f.label);
    const hidden = (c.groups || []).flatMap(([, fs]) => fs);
    for (const label of [...shown, ...hidden]) {
      const inGroup = !shown.includes(label);
      items.push([`${c.name} · ${label}`, inGroup ? '其余项' : '', () => revealField(c.key, label, inGroup)]);
    }
  }
  registerCommands('字段', items);
}
function revealField(cardKey, label, inGroup) {
  const c = CARDS.find((x) => x.key === cardKey);
  if (!c.always && !c.on) { c.on = true; renderTimeline(); }   // 字段所在的效果没开就先开
  if (inGroup) c.more = true;
  renderCards(); renderOutputs();
  const card = [...document.querySelectorAll('.cfg-card')].find((el) => el.textContent.includes(c.name));
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // 命中的字段闪一下：跳过去还得自己找是没闭环的
  const hit = [...card.querySelectorAll('span, div')].find((el) => el.children.length === 0 && el.textContent.trim() === label);
  const target = hit?.closest('.ctl-row, .ctl-row-wide, .grid') || hit;
  if (target) {
    target.classList.add('ring-2', 'ring-slate-400', 'rounded-lg');
    setTimeout(() => target.classList.remove('ring-2', 'ring-slate-400', 'rounded-lg'), 1400);
  }
}

function syncHint() {
  const a = ACTIONS.find((x) => x.id === actionId);
  $('hintGesture').textContent = a.gesture;
  $('stageHint').classList.remove('hidden');
  renderTimeline();
}
window.addEventListener('resize', () => renderTimeline());

// ── 布局预设






renderActions(); renderCards(); renderOutputs(); syncHint(); syncLayout(); syncDrawer(); registerFields();
</script>
