name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 架构核心四层（shared / extension / components / desktop）锁定
      # noImplicitAny + strictNullChecks；src/app 仍按宽松 typecheck 校验。
      - run: npm run typecheck:strict
      - run: npm run lint
      # DESIGN.md 反模式门禁：此前设计契约只存在于文档里，CI 无法拦截，
      # 导致 18 处违规全部积压在光标皮肤模块。
      - run: npm run check:design-tokens
      # docs/ui-spec 稿子自检：原生控件数、内联脚本语法、残留外壳 DOM 引用、调色板。
      # 前三条都是走查时反复踩到的坑——页面渲染正常但整段脚本已经死了，人眼查不出来。
      - run: npm run check:ui-spec
      - run: npm run check:dead-code
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:extension
      - run: npm run build:electron
      - run: xvfb-run -a npm run test:desktop

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=cursor-dance-api

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:extension-bundle
      - run: npm run build --workspace=landing

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      # electron-vite 编译 main + preload + renderer 三入口；
      # uiohook-napi / get-windows 在编译期被 externalize，不会触发原生 dlopen，
      # 所以 ubuntu 足够拦截 src/desktop/main/** 与 src/desktop/renderer/engine/** 的编译退化。
      - run: npm run build:electron
      - run: npm run check:desktop-bundle

  package-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CURSORDANCE_PACKAGE_PLATFORM: ${{ matrix.platform }}
      CURSORDANCE_PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: npm ci
      - run: npm run package:ci
      - run: npm run verify:package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: CursorDance-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/ci-${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            release/ci-${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            release/ci-${{ matrix.platform }}-${{ matrix.arch }}/*.blockmap
            release/ci-${{ matrix.platform }}-${{ matrix.arch }}/latest*.yml
          if-no-files-found: error
          retention-days: 7
