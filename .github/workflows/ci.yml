name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:extension
      - run: npm run build:electron
      - run: xvfb-run -a npm run test:desktop

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=cursor-dance-api

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build --workspace=landing

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      # electron-vite 编译 main + preload + renderer 三入口；
      # uiohook-napi / get-windows 在编译期被 externalize，不会触发原生 dlopen，
      # 所以 ubuntu 足够拦截 src/desktop/main/** 与 src/desktop/renderer/engine/** 的编译退化。
      - run: npm run build:electron

  build-windows-cursor-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm run build:native:cursor-helper
      - run: npm run test:native:cursor-helper
